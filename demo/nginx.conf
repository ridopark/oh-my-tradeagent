# The public demo's web server: static files and nothing else.
#
#   /                 -> 302 /status/
#   /status/ etc.     -> the exported site (baked into the image)
#   /data/<feed>.json -> the poller's snapshots (a volume shared with the poller container)
#
# No proxying, no scripting, no upstreams. Anything that is not a GET or HEAD for a file that
# exists is refused. Runs as the unprivileged nginx image (port 8080, non-root, read-only root).

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  gzip on;
  gzip_types application/json text/css application/javascript text/plain;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Requests arrive through Cloudflare; the visitor's address is in CF-Connecting-IP. Limit per
  # visitor: a page polls about one small file per second.
  map $http_cf_connecting_ip $visitor {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
  }
  limit_req_zone $visitor zone=visitor:10m rate=20r/s;
  limit_req_status 429;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 1k;
    limit_req zone=visitor burst=60 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The static export bootstraps with inline scripts, so 'unsafe-inline' is required for script
    # and style. Everything else is locked to this origin; the page never loads third-party code.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Read-only: the page has no forms and posts nothing.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location = / {
      return 302 /status/;
    }

    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nDisallow: /\n";
    }

    # The poller's snapshots: exactly these five files, nothing else from that volume.
    location ~ ^/data/(status|portfolio|fills|orders|marks)\.json$ {
      alias /data/$1.json;
      default_type application/json;
      add_header Cache-Control "public, max-age=3" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /data/ {
      return 404;
    }

    # Hashed build assets never change.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/index.html =404;
    }

    # No dotfiles, whatever they are.
    location ~ /\. {
      return 404;
    }
  }
}
