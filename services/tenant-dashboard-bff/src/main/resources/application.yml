spring:
  application:
    name: tenant-dashboard-bff-svc
  # Redis holds the armed-watchlist set the orchestrator seeds on arm; ProximityReader.watchlist
  # enumerates it instead of a lagging listExecutions visibility query. Default localhost for parity
  # with the orchestrator; the k8s manifest supplies `redis`.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # This service wires TWO read-only datasources by hand (orchestrator + exec_<broker>), so the
  # single-datasource auto-config must be off — otherwise Spring tries to build one DataSource from
  # spring.datasource and a single auto DSLContext, which collides with our qualified beans.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jooq.JooqAutoConfiguration
  jooq:
    sql-dialect: POSTGRES
  # Flyway runs ONLY against the `dashboard` DB (the one schema this service owns — dashboard_user).
  # It gets its own url/user so it never touches the read-only orchestrator/exec datasources. The
  # app datasources connect as bff_readonly and must never run DDL.
  flyway:
    enabled: true
    url: ${DASHBOARD_DB_URL:jdbc:postgresql://localhost:5432/dashboard}
    user: ${DASHBOARD_DB_USER:temporal}
    password: ${DASHBOARD_DB_PASS:temporal}
    locations: classpath:db/dashboard
    placeholders:
      # Injected into V2__dashboard_readonly_role.sql at migration time so the dashboard_readonly
      # role is created with its real password (never a repo-readable literal). NO default on
      # purpose: an unset DASHBOARD_READONLY_PASSWORD fails placeholder resolution at boot — BEFORE
      # Flyway runs — so the role is never created with a known fallback. Set it from the
      # dashboard-secrets Secret in prod; export it locally when running the BFF against a real
      # dashboard DB (unit tests and the ITs never run this migration).
      dashboard_readonly_password: ${DASHBOARD_READONLY_PASSWORD}
      # Injected into V5__dashboard_writer_role.sql at migration time so the least-privilege
      # dashboard_writer role (INSERT dashboard_user + CRUD dashboard_user_invite only) is created
      # with its real password, never a repo-readable literal. Same fail-closed contract as the
      # readonly placeholder above: NO default, so an unset DASHBOARD_WRITER_PASSWORD fails resolution
      # BEFORE the role is created. Only consumed on a cluster that runs Flyway with this Secret set;
      # unit tests / ITs never run this migration via Spring (the migration IT drives Flyway directly).
      dashboard_writer_password: ${DASHBOARD_WRITER_PASSWORD}

# I-1a (operator-account-onboarding): dark gate for the operator-scoped cross-tenant admin read
# (GET /api/admin/tenants). Default OFF — the controller bean is absent and the route 404s until an
# operator deployment sets OPERATOR_ADMIN_READ_ENABLED=true. The endpoint is bearer-gated (every
# BFF request is) AND requires X-Operator-Id; it is a pure READ with no secret egress.
operator:
  admin-read:
    enabled: ${OPERATOR_ADMIN_READ_ENABLED:false}
  # Config surface for the backend operator allowlist (defense-in-depth). The enforcement
  # (requireAllowlistedOperator → 403 on admin-read) is in place. FAIL-CLOSED: unset/blank = deny-all
  # → admin-read 403s. Independent config from the api-gateway; set the SAME operator email(s) here as
  # in the api-gateway OPERATOR_ALLOWLIST and the dashboard OPERATOR_EMAILS.
  allowlist: ${OPERATOR_ALLOWLIST:}
  # Phase 2 dark gate for the operator create-invite endpoint (POST /api/admin/tenant-invites).
  # Default OFF: the TenantInvitesController bean is absent (a two-name @ConditionalOnProperty that
  # requires BOTH this flag AND dashboard.writer.enabled, because the endpoint writes via the
  # dashboard_writer DSL), so the route 404s until an operator deployment sets BOTH
  # OPERATOR_TENANT_INVITE_ENABLED=true and DASHBOARD_WRITER_ENABLED=true. The endpoint is
  # bearer-gated (every BFF request is) AND requires an allowlisted X-Operator-Id.
  tenant-invite:
    enabled: ${OPERATOR_TENANT_INVITE_ENABLED:false}
    # Open invites expire this many days after creation; a re-invite refreshes the window.
    ttl-days: ${OPERATOR_TENANT_INVITE_TTL_DAYS:7}
  # Phase 3 dark gate for the operator tenant-delete teardown, dashboard store (DELETE
  # /api/admin/tenants/{tenant}/dashboard-rows). Default OFF: the TenantDashboardRowsController bean
  # is absent (a two-name @ConditionalOnProperty that requires BOTH this flag AND
  # dashboard.writer.enabled, because the endpoint deletes via the dashboard_writer DSL), so the
  # route 404s until an operator deployment sets BOTH OPERATOR_TENANT_DELETE_ENABLED=true and
  # DASHBOARD_WRITER_ENABLED=true (and has run the V7 DELETE grant). Bearer-gated (every BFF request
  # is) AND requires an allowlisted X-Operator-Id.
  tenant-delete:
    enabled: ${OPERATOR_TENANT_DELETE_ENABLED:false}

# Dark gate for the write path added by the operator tenant-user-invite feature. Default OFF: the
# dashboard_writer DSLContext/HikariDataSource beans are absent (@ConditionalOnProperty), so the
# module boots identically in tests/CI/local with no writer creds. Flipped true only on a cluster
# that has run the V5 dashboard_writer role migration and supplies DASHBOARD_WRITER_PASSWORD. This
# flag alone brings up the login-bind endpoint (POST /internal/provisioning/bind), which needs only
# the writer DSL; the operator create-invite endpoint additionally requires operator.tenant-invite.
dashboard:
  writer:
    enabled: ${DASHBOARD_WRITER_ENABLED:false}

# Dark gate for the read-only /options-chat Discord mirror (V9 store + the scraper's ingest).
# Default OFF: both the read controller and the ingest controller are absent (a two-name
# @ConditionalOnProperty requiring BOTH this flag AND dashboard.writer.enabled, because both go
# through the dashboard_writer DSL), so the routes 404 until a deployment sets BOTH
# OPTIONS_CHAT_ENABLED=true and DASHBOARD_WRITER_ENABLED=true. The ingest is gated too, not just the
# read: a live write endpoint taking untrusted third-party content with nothing consuming it is
# worse than no endpoint.
options-chat:
  enabled: ${OPTIONS_CHAT_ENABLED:false}
  # The Discord channels this mirror accepts, comma-separated. Ingest rejects any other channel_id
  # outright, so the store cannot become a general-purpose blob sink for whoever holds the ingest
  # token — an ALLOWLIST, not a filter.
  #
  # Entries are `id` or `id:Label`; the label is what the page's tab shows, so the page has no
  # channel ids compiled into it. The FIRST entry is the default the page opens on.
  channel-ids: ${OPTIONS_CHAT_CHANNEL_IDS:786109983065505792:Discussion,769797179992571914:Signals}
  # SEPARATE credential from bff.service-token, enforced by ServiceTokenFilter's route scoping on
  # /internal/options-chat/**. The caller is the Discord-scraping pod; with the shared token it
  # could spoof any X-Tenant-Id and read real-money positions. NO default — blank fails closed and
  # the ingest route rejects everything until the secret is provisioned.
  ingest-token: ${OPTIONS_CHAT_INGEST_TOKEN:}
  # Nightly retention (Phase 6). Messages posted longer ago than this are deleted at 03:30 UTC and
  # their attachments cascade with them — the only thing bounding this store's growth.
  #
  # A value below 1 DISABLES the sweep rather than meaning "keep nothing": a 0 here (unset, typo,
  # bad ConfigMap) would compute a cutoff of "now" and delete the entire mirror on the first tick,
  # which is unrecoverable. Failing to delete is the safe direction; deleting everything is not.
  retention-days: ${OPTIONS_CHAT_RETENTION_DAYS:30}

# Read-only application datasources. Credentials are the dedicated bff_readonly role per DB (see the
# operator runbook); SELECT-only grants mean even a query bug cannot mutate trading state.
bff:
  service-token: ${BFF_SHARED_TOKEN:dev-shared-token}
  tenants-dir: ${BFF_TENANTS_DIR:tenants}
  portfolio:
    # Per-section budget for the concurrent portfolio sub-reads (position-state queries + account
    # snapshots). Part of an ordering invariant that MUST hold or /status 500s instead of degrading:
    #   AccountEquityClient RESULT_TIMEOUT_SECONDS (8s, inner worker wait)
    #     <= this budget (9s)
    #     <= dashboard BFF_TIMEOUT_MS in dashboard/lib/bff.ts (12s, the page's abort).
    subread-timeout-seconds: ${BFF_PORTFOLIO_SUBREAD_TIMEOUT_SECONDS:9}
  datasource:
    orchestrator:
      jdbc-url: ${BFF_ORCHESTRATOR_DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
      username: ${BFF_ORCHESTRATOR_DB_USER:temporal}
      password: ${BFF_ORCHESTRATOR_DB_PASS:temporal}
      maximum-pool-size: 4
      read-only: true
    exec-alpaca-paper:
      jdbc-url: ${BFF_EXEC_ALPACA_PAPER_DB_URL:jdbc:postgresql://localhost:5432/exec_alpaca_paper}
      username: ${BFF_EXEC_ALPACA_PAPER_DB_USER:temporal}
      password: ${BFF_EXEC_ALPACA_PAPER_DB_PASS:temporal}
      maximum-pool-size: 4
      read-only: true
    exec-alpaca-live:
      jdbc-url: ${BFF_EXEC_ALPACA_LIVE_DB_URL:jdbc:postgresql://localhost:5432/exec_alpaca_live}
      username: ${BFF_EXEC_ALPACA_LIVE_DB_USER:temporal}
      password: ${BFF_EXEC_ALPACA_LIVE_DB_PASS:temporal}
      maximum-pool-size: 4
      # Open lazily: a cluster with no live tenant (or one with no live orders yet) should not hold
      # idle connections to exec_alpaca_live. Hikari otherwise defaults minimumIdle to maxPoolSize.
      minimum-idle: 0
      read-only: true
    # WRITE datasource for the operator tenant-user-invite feature (connects as the least-privilege
    # dashboard_writer role, V5). DARK by default: the beans only exist when dashboard.writer.enabled
    # is true (see DataSourceConfig), so an unset DASHBOARD_WRITER_PASSWORD never crashes boot in the
    # repo default. NOT read-only — it is the ONLY write path this service has.
    #
    # Env namespace is DASHBOARD_WRITER_* (NOT the BFF_<src>_DB_* used by the read-only orchestrator/
    # exec datasources above) deliberately: those point at EXTERNAL trading-state DBs this BFF only
    # reads, whereas this one connects to the SAME Flyway-managed `dashboard` DB the migrations own
    # (alongside the elevated DASHBOARD_DB_* Flyway creds). The password reuses the exact
    # DASHBOARD_WRITER_PASSWORD Secret that the V5 role migration's ${dashboard_writer_password}
    # placeholder binds — one secret creates the role and the same secret connects as it — so the
    # whole triple stays in the DASHBOARD_WRITER_* namespace for consistency.
    dashboard-writer:
      jdbc-url: ${DASHBOARD_WRITER_URL:jdbc:postgresql://localhost:5432/dashboard}
      username: ${DASHBOARD_WRITER_USER:dashboard_writer}
      password: ${DASHBOARD_WRITER_PASSWORD:}
      maximum-pool-size: 2
      minimum-idle: 0

server:
  port: ${TENANT_DASHBOARD_BFF_PORT:8083}
  error:
    # Never leak stack traces or exception messages in error responses (defence in depth; the
    # catch-all in GlobalExceptionHandler returns a generic body anyway).
    include-stacktrace: never
    include-message: never

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  # Task queue the orchestrator worker polls; the BFF starts the short-lived AccountSnapshotWorkflow
  # on it (the workflow itself dispatches the AccountSnapshotActivity to broker-<target>).
  orchestrator-task-queue: ${TEMPORAL_ORCHESTRATOR_TASK_QUEUE:orchestrator-core}

# Tenant self-service reset of the account daily-loss kill switch. Dark by default: while off, the
# POST /api/account-killswitch/reset write surface 404s (the GET state read stays available). Flip
# to true (alongside the dashboard's ACCOUNT_KILLSWITCH_RESET_WRITE_ENABLED) to enable the reset.
account-killswitch:
  reset:
    write-enabled: ${ACCOUNT_KILLSWITCH_RESET_WRITE_ENABLED:false}

# Tenant self-service per-position force-close (POST /api/positions/force-close), which drives the
# existing PositionWorkflow.force_close Update (marketable SELL for the remaining qty / phantom
# clear). REAL-MONEY capable, so it is dark by default: while off, the write surface 404s server-side
# (the GET /api/positions read stays available). Flip to true (alongside the dashboard's
# FORCE_EXIT_WRITE_ENABLED) to enable the force-close button.
positions:
  force-close:
    write-enabled: ${POSITIONS_FORCE_CLOSE_WRITE_ENABLED:false}
  # Tenant self-service per-position partial close / "Trim" (POST /api/positions/partial-close),
  # which drives PositionWorkflow.partial_close (MARKET SELL of a fraction of the remaining qty;
  # the rest of the position keeps running). REAL-MONEY capable, so it is dark by default and
  # flagged SEPARATELY from force-close — trimming and flattening are independent capabilities.
  # Flip to true (alongside the dashboard's TRIM_WRITE_ENABLED) to enable the Trim button.
  partial-close:
    write-enabled: ${POSITIONS_PARTIAL_CLOSE_WRITE_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{tenant_id:-}] %logger{36} - %msg%n"
