spring:
  application:
    name: audit-svc

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # Surfaces /actuator/health/{liveness,readiness} regardless of Spring Boot's
      # k8s auto-detection heuristic. The k3s manifests probe those paths.
      probes:
        enabled: true

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:orchestrator-core}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{tenant_id:-},%X{strategy_id:-},%X{signal_id:-}] %logger{36} - %msg%n"
