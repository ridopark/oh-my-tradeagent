spring:
  application:
    name: exec-tradier-paper-svc
  datasource:
    url: ${EXEC_TRADIER_PAPER_DB_URL:jdbc:postgresql://localhost:5432/exec_tradier_paper}
    username: ${EXEC_TRADIER_PAPER_DB_USER:temporal}
    password: ${EXEC_TRADIER_PAPER_DB_PASS:temporal}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:broker-tradier-paper}

# OptionsBroker impl selector. Phase 2b ships 'stub' only; 'tradier' lights up
# when TradierPaperBroker (HTTP client to https://sandbox.tradier.com) lands.
broker:
  impl: ${BROKER_IMPL:stub}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
