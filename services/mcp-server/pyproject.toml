[project]
name = "ohmytradeagent-mcp-server"
version = "0.1.0"
description = "Read-only stdio MCP server for the oh-my-tradeagent operator dashboard"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.27",
    "uvicorn>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
omt-mcp = "ohmytradeagent_mcp.main:main"
omt-mcp-gateway = "ohmytradeagent_mcp.gateway.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmytradeagent_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
