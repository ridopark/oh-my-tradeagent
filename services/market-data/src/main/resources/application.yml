spring:
  application:
    name: market-data-svc
  # Worker-only by design (Temporal poll loop is the work driver), but we keep
  # the default servlet web stack so Spring Boot Actuator can expose health /
  # info / prometheus on port 8080. Setting spring.main.web-application-type=none
  # disables the management server too — verified the hard way (commit history).

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:market-data}

# MarketDataProvider impl selector. Values: 'inmemory' (in-process fan-out used by tests
# and dev) | 'alpaca' (HTTPS snapshot + WS premium stream). Additional providers
# (tradier, ibkr, schwab) land as 2c.x follow-ups.
market-data:
  provider: ${MARKET_DATA_PROVIDER:inmemory}
  alpaca:
    data-base-url: ${ALPACA_DATA_BASE_URL:${APCA_API_BASE_URL_DATA:https://data.alpaca.markets}}
    # data-ws-url: retained but UNUSED — the option premium feed is now a REST poll of snapshotQuote
    # (the v1beta1 options WS is msgpack/binary + message-auth and never delivered ticks).
    data-ws-url: ${ALPACA_DATA_WS_URL:wss://stream.data.alpaca.markets/v1beta1/indicative}
    api-key-id: ${APCA_API_KEY_ID_DATA:${APCA_API_KEY_ID:}}
    api-secret-key: ${APCA_API_SECRET_KEY_DATA:${APCA_API_SECRET_KEY:}}
    # Option-premium snapshot poll cadence. 500ms -> 120 req/min per open OCC.
    #
    # The budget is 10,000 req/min (Algo Trader Plus), NOT the "~200 req/min" this comment claimed
    # until 2026-08-17 — that figure is the Basic-plan limit and this account has never been on it.
    # Verified by read-only REST probe 2026-08-16. The old 2000ms was sized against a constraint
    # that did not exist.
    #
    # The req/min budget is NOT the binding constraint, and an earlier draft of this comment was
    # wrong to imply it: 10,000/120 would allow ~83 concurrent contracts, but polls run on a FIXED
    # 4-THREAD pool (AlpacaMarketData#defaultScheduler) making a SYNCHRONOUS snapshotQuote call, so
    # the real ceiling is ~4/RTT calls per second — order ~20 contracts at 500ms versus ~80 at
    # 2000ms. Past that, scheduleAtFixedRate delays overrun tasks instead of running them
    # concurrently, so the realized cadence degrades SILENTLY back toward 1-2s while feed health
    # stays green (there is no metric on achieved poll interval). Today's concurrency is far below
    # this; raise the pool before raising position count, and measure the realized interval.
    # snapshotQuote is also shared with kill-switch MTM, GetOptionQuoteActivity and
    # resolveTrailAnchor, which adds load but is not the limit.
    #
    # WHY 500 AND NOT LOWER: a poll at interval I observes a stop crossing ~I/2 late, so 2000ms
    # cost 0.75s more exposure than 500ms. Against measured premium velocity (127,193 samples,
    # scripts/research/option_velocity.py) that is 1.7-3.5% of premium at p99-p99.9 — the tail is
    # exactly when a stop fires. Going to 200ms would save only a further 0.15s (~0.35-0.71%) and
    # is bounded by something unmeasured: acceptPremiumQuote REJECTS a quote whose retrievedAt
    # matches the previous one, so polling faster than OPRA updates yields rejected duplicates —
    # REST cost, zero information. Measure the quote update rate before going below 500ms
    # (PLAN-2026-08-17-premium-poll-latency Phase 3).
    #
    # ROLLBACK IS GENUINELY THIS ONE VALUE. Nothing else was retuned for 500ms — in particular the
    # RestClient timeouts in AlpacaMarketDataConfig were deliberately left at 1s/1500ms, because
    # that client is SHARED with the account kill-switch MTM path, which is fail-CLOSED. Read the
    # comment there before "fixing" the read-timeout-vs-interval relationship.
    premium-poll-interval-ms: ${ALPACA_PREMIUM_POLL_INTERVAL_MS:500}
    # LIVE-USE GATE for the real-time STOCK trade stream that drives watchlist-trigger entries.
    # Intentionally UNSET by default: when both are blank, subscribeEquity FAILS CLOSED (loud audit,
    # no connect) so a delayed/wrong feed can never silently drive a price-level trigger. An operator
    # opts in ONLY after confirming a real-time entitlement, by setting one of:
    #   stock-data-ws-url : explicit WS URL, OR
    #   stock-feed        : 'iex' | 'sip' -> wss://stream.data.alpaca.markets/v2/<feed>
    # CAVEAT (Alpaca connection limit): setting this opens a SECOND market-data WS on the same key as
    # the options premium stream (data-ws-url). This worker holds one WS per endpoint and fans out to
    # all subscribers, so the count is fixed at 2 (options + stocks) regardless of strategy/leg count.
    # VERIFIED 2026-06-20 (scripts/alpaca-ws-conn-check.py): the limit is ONE connection PER ENDPOINT,
    # not account-wide -- stocks (/v2) and options (/v1beta1) coexist on one key; a 2nd connection to
    # the SAME endpoint gets 406 and is refused (the existing one survives). So this is safe AS LONG
    # AS market-data stays a single replica; a 2nd replica's duplicate connections would be 406'd.
    stock-data-ws-url: ${ALPACA_STOCK_DATA_WS_URL:}
    stock-feed: ${ALPACA_STOCK_FEED:}
  # #776 P2: RTH-gated boot recovery of armed premium subscriptions (PremiumSubscriptionRecovery).
  # Defaults live in the component's @Value declarations; listed here for discoverability only.
  #   trail-recovery.max-attempts: 5            sweep attempts before giving up (alert fires)
  #   trail-recovery.retry-backoff-seconds: 30  pause between failed/partial attempts
  #   trail-recovery.max-subscriptions: 20      cap on subscriptions CREATED per sweep (poll-pool ceiling)
  #   trail-recovery.sweep-deadline-seconds: 120 wall-clock bound on one sweep

# #776 P2: best-effort Discord alert route for the boot recovery (gave-up / truncation / crash).
# Blank/unset (dev/CI default) -> alerts are log-only. In k8s the env var comes from the
# discord-alert-credentials Secret (infra/k8s/53-market-data.yaml), same as exec/orchestrator.
alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        # feedhealth: per-feed WS liveness (FeedHealthEndpoint), read by the tenant-dashboard BFF.
        # (Quote reads live on MarketDataQuoteController at /md/equity|/md/option, NOT actuator —
        # actuator @Selector binding needs -parameters, which the prod build omits.)
        include: health,info,prometheus,feedhealth
  endpoint:
    health:
      probes:
        enabled: true
