spring:
  application:
    name: market-data-svc
  # Worker-only by design (Temporal poll loop is the work driver), but we keep
  # the default servlet web stack so Spring Boot Actuator can expose health /
  # info / prometheus on port 8080. Setting spring.main.web-application-type=none
  # disables the management server too — verified the hard way (commit history).

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:market-data}

# MarketDataProvider impl selector. Values: 'inmemory' (in-process fan-out used by tests
# and dev) | 'alpaca' (HTTPS snapshot + WS premium stream). Additional providers
# (tradier, ibkr, schwab) land as 2c.x follow-ups.
market-data:
  provider: ${MARKET_DATA_PROVIDER:inmemory}
  alpaca:
    data-base-url: ${ALPACA_DATA_BASE_URL:${APCA_API_BASE_URL_DATA:https://data.alpaca.markets}}
    # data-ws-url: retained but UNUSED — the option premium feed is now a REST poll of snapshotQuote
    # (the v1beta1 options WS is msgpack/binary + message-auth and never delivered ticks).
    data-ws-url: ${ALPACA_DATA_WS_URL:wss://stream.data.alpaca.markets/v1beta1/indicative}
    api-key-id: ${APCA_API_KEY_ID_DATA:${APCA_API_KEY_ID:}}
    api-secret-key: ${APCA_API_SECRET_KEY_DATA:${APCA_API_SECRET_KEY:}}
    # Option-premium snapshot poll cadence. 2s -> 30 req/min per open OCC; keep total (poll +
    # flatten/reprice snapshots) under Alpaca's ~200 req/min data-REST limit.
    premium-poll-interval-ms: ${ALPACA_PREMIUM_POLL_INTERVAL_MS:2000}
    # LIVE-USE GATE for the real-time STOCK trade stream that drives watchlist-trigger entries.
    # Intentionally UNSET by default: when both are blank, subscribeEquity FAILS CLOSED (loud audit,
    # no connect) so a delayed/wrong feed can never silently drive a price-level trigger. An operator
    # opts in ONLY after confirming a real-time entitlement, by setting one of:
    #   stock-data-ws-url : explicit WS URL, OR
    #   stock-feed        : 'iex' | 'sip' -> wss://stream.data.alpaca.markets/v2/<feed>
    # CAVEAT (Alpaca connection limit): setting this opens a SECOND market-data WS on the same key as
    # the options premium stream (data-ws-url). This worker holds one WS per endpoint and fans out to
    # all subscribers, so the count is fixed at 2 (options + stocks) regardless of strategy/leg count.
    # VERIFIED 2026-06-20 (scripts/alpaca-ws-conn-check.py): the limit is ONE connection PER ENDPOINT,
    # not account-wide -- stocks (/v2) and options (/v1beta1) coexist on one key; a 2nd connection to
    # the SAME endpoint gets 406 and is refused (the existing one survives). So this is safe AS LONG
    # AS market-data stays a single replica; a 2nd replica's duplicate connections would be 406'd.
    stock-data-ws-url: ${ALPACA_STOCK_DATA_WS_URL:}
    stock-feed: ${ALPACA_STOCK_FEED:}

management:
  endpoints:
    web:
      exposure:
        # feedhealth: per-feed WS liveness (FeedHealthEndpoint), read by the tenant-dashboard BFF.
        # (Quote reads live on MarketDataQuoteController at /md/equity|/md/option, NOT actuator —
        # actuator @Selector binding needs -parameters, which the prod build omits.)
        include: health,info,prometheus,feedhealth
  endpoint:
    health:
      probes:
        enabled: true
