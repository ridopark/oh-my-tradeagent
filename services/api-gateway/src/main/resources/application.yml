spring:
  application:
    name: api-gateway-svc
  datasource:
    url: ${API_GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${API_GATEWAY_DB_USER:temporal}
    password: ${API_GATEWAY_DB_PASS:temporal}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    # api-gateway is a read-only consumer of the orchestrator's audit_log; the
    # orchestrator-svc owns the schema in the dedicated `orchestrator` DB (issue
    # #56 item 9), so api-gateway does not run migrations of its own.
    enabled: false

server:
  port: ${API_GATEWAY_PORT:8082}

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  # Task queue the orchestrator worker polls; api-gateway starts the operator-triggered
  # AdoptionWorkflow (POST /positions/adopt, issue #285) on it.
  orchestrator-task-queue: ${TEMPORAL_ORCHESTRATOR_TASK_QUEUE:orchestrator-core}

api-gateway:
  default-tenant: ${API_GATEWAY_DEFAULT_TENANT:dev}
  default-strategy: ${API_GATEWAY_DEFAULT_STRATEGY:copytrade-v1}
  # UI-P2-a inbound service token for the /broker-credentials route (the dashboard-server hop).
  # Local-dev default; a pod under the `prod` profile MUST override via API_GATEWAY_SHARED_TOKEN
  # or the ServiceTokenFilter fails fast at boot.
  service-token: ${API_GATEWAY_SHARED_TOKEN:dev-shared-token}

# UI-P2-a/c credential-write forward. DARK by default: with write.enabled unset/false NONE of the
# new beans (controller, exec RestClient, ServiceTokenFilter, Clock, CredentialWriteLimiter) exist
# and the route 404s. The opt-in is a manual, per-cluster operator action — NO repo manifest sets
# this true.
broker:
  credentials:
    write:
      enabled: ${BROKER_CREDENTIALS_WRITE_ENABLED:false}
      # UI-P2-c CredentialWriteLimiter (per-tenant, in-process; api-gateway is single-replica).
      # rate-per-minute: per-tenant minute-window write cap (over cap → 429, no forward).
      rate-per-minute: ${BROKER_CREDENTIALS_WRITE_RATE_PER_MINUTE:10}
      # lockout-threshold: consecutive REJECTED_VALIDATION (422) results within lockout-window that
      # arm a lockout. ONLY validation rejects count — a SAVED resets the streak; a persist error
      # never counts.
      lockout-threshold: ${BROKER_CREDENTIALS_WRITE_LOCKOUT_THRESHOLD:5}
      # lockout-window: rolling window the threshold rejections must fall within (ISO-8601 Duration).
      lockout-window: ${BROKER_CREDENTIALS_WRITE_LOCKOUT_WINDOW:PT10M}
      # lockout-duration: how long a tenant is refused (429 before forwarding) once locked out.
      lockout-duration: ${BROKER_CREDENTIALS_WRITE_LOCKOUT_DURATION:PT15M}

# UI-P3-b strategy-config WRITE forward. DARK by default: with write.enabled unset/false the
# StrategyConfigController bean does not exist and the /strategy-config route 404s. The opt-in is a
# manual, per-cluster operator action — NO repo manifest sets this true. The orchestrator's
# StrategyConfigWriter hard-blocks any risk-increasing / live-routing change regardless of this flag.
strategy:
  config:
    write:
      enabled: ${STRATEGY_CONFIG_WRITE_ENABLED:false}

# Operator-account-onboarding admin routes. All DARK by default: with a flag unset/false its
# controller bean does not exist and the route 404s. Each opt-in is a manual, per-cluster operator
# action — NO repo manifest sets these true. When any is enabled, ServiceTokenFilter bearer-gates
# /admin/tenants/ + /broker-credentials.
operator:
  # Phase F one-click live activation/deactivation (ActivationController).
  activation:
    enabled: ${OPERATOR_ACTIVATION_ENABLED:false}
  # Phase I create-tenant (CreateTenantController).
  tenant-create:
    enabled: ${OPERATOR_TENANT_CREATE_ENABLED:false}
  # Phase I operator credential paste/write (OperatorBrokerCredentialController).
  credential-write:
    enabled: ${OPERATOR_CREDENTIAL_WRITE_ENABLED:false}
  # A1 (self-service-copytrade-onboarding) operator enable route (OperatorStrategyEnableController).
  # DARK by default: unset → the enable route 404s. When true it also brings up ServiceTokenFilter
  # (bearer gate) + the exec RestClient (verified-account read).
  strategy-enable:
    enabled: ${OPERATOR_STRATEGY_ENABLE_ENABLED:false}
  # Operator tenant-delete (PLAN-2026-07-03, Phase 4) — the real-money safety gate. DARK by default:
  # unset → the TenantDeleteController (and its readers / exec+bff forwarders / audit-emit client)
  # do not exist and POST /admin/tenants/{tenant}/delete 404s. When true it also brings up
  # ServiceTokenFilter (bearer gate), the exec RestClient (creds delete), and the bff RestClient
  # (dashboard-rows delete). No repo manifest sets this true.
  tenant-delete:
    enabled: ${OPERATOR_TENANT_DELETE_ENABLED:false}
  # Config surface for the backend operator allowlist (defense-in-depth). The enforcement
  # (requireAllowlistedOperator → 403 on the admin routes) is in place. FAIL-CLOSED: unset/blank =
  # deny-all → every admin route 403s. Set to the authorized operator email(s), comma-separated, and
  # keep in sync with the dashboard OPERATOR_EMAILS and the bff OPERATOR_ALLOWLIST.
  allowlist: ${OPERATOR_ALLOWLIST:}

# Phase B1 copytrade fan-out registry. DARK by default: with fanout.enabled unset/false the
# CopytradeFanoutController bean does not exist and GET /internal/copytrade-fanout-targets 404s.
# When enabled, ServiceTokenFilter bearer-gates the route (the sidecar is a SERVICE caller, not an
# operator). The cutover is a manual per-cluster operator action (Phase B3) — NO repo manifest sets
# this true.
copytrade:
  fanout:
    enabled: ${COPYTRADE_FANOUT_ENABLED:false}
    # The copytrade strategy id the registry query scopes to (bind parameter, not a query literal).
    strategy-id: ${COPYTRADE_FANOUT_STRATEGY_ID:copytrade-v1}

# Exec internal base URL the credential forward targets (in-cluster service name).
exec:
  base-url: ${EXEC_BASE_URL:http://exec:8080}
  admin:
    service-token: ${EXEC_ADMIN_SHARED_TOKEN:}

# tenant-dashboard-bff internal base URL + service token for the operator tenant-delete
# dashboard-rows hop (Phase 4 → Phase 3 BFF route). Only used when operator.tenant-delete.enabled is
# true (BffClientConfig is gated on it); a pod under the prod profile with a blank token fails fast.
bff:
  base-url: ${BFF_BASE_URL:http://tenant-dashboard-bff:8080}
  service-token: ${BFF_SHARED_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{tenant_id:-},%X{strategy_id:-}] %logger{36} - %msg%n"
