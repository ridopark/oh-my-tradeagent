spring:
  application:
    name: exec-svc
  # Worker-only by design (Temporal poll loop is the work driver), but we keep
  # the default servlet web stack so Spring Boot Actuator can expose health /
  # info / prometheus on port 8080. Setting spring.main.web-application-type=none
  # disables the management server too — verified the hard way (commit history).
  datasource:
    # Phase 2c.2: env vars renamed EXEC_TRADIER_PAPER_DB_* -> EXEC_DB_* (provider-agnostic).
    # Required env var with no fallback — Spring fails fast on missing value. The journal must
    # point at the right per-broker schema (e.g. exec_alpaca_paper vs exec_tradier_live); a silent
    # default would point a misconfigured tradier-live / ibkr-live deployment at an alpaca-paper
    # journal. Set EXEC_DB_URL explicitly per deployment (k8s manifest, docker-compose, or local
    # .env).
    url: ${EXEC_DB_URL}
    username: ${EXEC_DB_USER:temporal}
    password: ${EXEC_DB_PASS:temporal}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    # exec-svc namespaces its migrations under db/exec so they don't collide with the
    # orchestrator's db/migration V1 when exec-svc is pulled onto orchestrator's test
    # classpath (AdoptionWorkflowIT, issue #285). Flyway keys schema history by version,
    # so relocating the same files to a renamed package is a no-op on already-migrated DBs.
    locations: classpath:db/exec

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  # Phase 2c.2: default to broker-alpaca-paper (matches StrategyConfig.broker_target=alpaca-paper
  # on the orchestrator side). Operators of other brokers (tradier-paper, alpaca-live, etc.)
  # override via TEMPORAL_TASK_QUEUE.
  task-queue: ${TEMPORAL_TASK_QUEUE:broker-alpaca-paper}

# OptionsBroker impl selector. Values: 'stub' (in-memory) | 'alpaca-paper'
# (HTTP client to paper-api.alpaca.markets). Additional adapters (tradier,
# ibkr, schwab) land as 2c.x follow-ups.
broker:
  impl: ${BROKER_IMPL:stub}

alpaca:
  base-url: ${APCA_API_BASE_URL:https://paper-api.alpaca.markets}
  api-key-id: ${APCA_API_KEY_ID:}
  api-secret-key: ${APCA_API_SECRET_KEY:}

# Fill listener (broker push + polling fallback). Default OFF; enable per
# deployment via EXEC_FILL_LISTENER_ENABLED=true. Single-pod constraint —
# multi-pod deployments would multiply dispatch cost by N until leader
# election lands.
exec:
  # P6-c dark credential-write endpoint auth. Only CONSUMED when broker.creds.source=db (the
  # ExecAdminTokenFilter + BrokerCredentialAdminController beans are gated on it AND an alpaca-*
  # impl), so on a homelab pod (broker.creds.source defaults to env) this key is inert and the
  # endpoint does not exist. The insecure default is for local dev only; under the `prod` profile a
  # pod that boots with this default crashloops (fail-fast in ExecAdminTokenFilter), mirroring the
  # BFF shared token.
  admin:
    service-token: ${EXEC_ADMIN_SHARED_TOKEN:dev-admin-token}
  fill-listener:
    enabled: ${EXEC_FILL_LISTENER_ENABLED:false}
    ws-url: ${EXEC_FILL_LISTENER_WS_URL:wss://paper-api.alpaca.markets/stream}
    reconnect-base-ms: 1000
    reconnect-cap-ms: 60000
    dedup-cache-size: 1024
    poll:
      enabled: ${EXEC_FILL_LISTENER_POLL_ENABLED:false}
      interval-ms: 30000
      grace-ms: 60000
      batch-size: 50

# Issue #297 / #295 / #302: non-blocking, best-effort Discord alert on a broker rejection in
# ExecActivitiesImpl.placeOrder (the failure that caused the #295 outage). Issue #302: the webhook
# post runs on a bounded async executor so the ~5s timeout is not consumed inline before the broker
# exception is rethrown unchanged. The webhook URL comes from a k8s secret (operator follow-up) —
# when blank the alerter is a no-op (logs the would-be alert at INFO). A webhook timeout/error is
# caught and logged, NEVER propagated into the broker exception flow (it must not alter the Temporal
# retryable/non-retryable classification).
alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}
    # Optional per-tenant alert routing. `tenant=url` entries, ';'-separated (key/value split on the
    # FIRST '=' so a URL may itself contain '='). A tenant present here routes its broker-rejection
    # alerts to its own webhook; any tenant absent here falls back to webhook-url above. Blank/unset
    # → global only. The real per-tenant URLs are operator secrets injected into the
    # discord-alert-credentials Secret at deploy time (out of band) — never committed to the repo.
    webhook-urls: ${ALERT_DISCORD_WEBHOOK_URLS:}
    broker-rejection:
      enabled: ${ALERT_DISCORD_BROKER_REJECTION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
