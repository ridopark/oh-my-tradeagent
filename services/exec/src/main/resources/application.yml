spring:
  application:
    name: exec-svc
  # Worker-only by design (Temporal poll loop is the work driver), but we keep
  # the default servlet web stack so Spring Boot Actuator can expose health /
  # info / prometheus on port 8080. Setting spring.main.web-application-type=none
  # disables the management server too — verified the hard way (commit history).
  datasource:
    # Phase 2c.2: env vars renamed EXEC_TRADIER_PAPER_DB_* -> EXEC_DB_* (provider-agnostic).
    # Required env var with no fallback — Spring fails fast on missing value. The journal must
    # point at the right per-broker schema (e.g. exec_alpaca_paper vs exec_tradier_live); a silent
    # default would point a misconfigured tradier-live / ibkr-live deployment at an alpaca-paper
    # journal. Set EXEC_DB_URL explicitly per deployment (k8s manifest, docker-compose, or local
    # .env).
    url: ${EXEC_DB_URL}
    username: ${EXEC_DB_USER:temporal}
    password: ${EXEC_DB_PASS:temporal}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  # Phase 2c.2: default to broker-alpaca-paper (matches StrategyConfig.broker_target=alpaca-paper
  # on the orchestrator side). Operators of other brokers (tradier-paper, alpaca-live, etc.)
  # override via TEMPORAL_TASK_QUEUE.
  task-queue: ${TEMPORAL_TASK_QUEUE:broker-alpaca-paper}

# OptionsBroker impl selector. Values: 'stub' (in-memory) | 'alpaca-paper'
# (HTTP client to paper-api.alpaca.markets). Additional adapters (tradier,
# ibkr, schwab) land as 2c.x follow-ups.
broker:
  impl: ${BROKER_IMPL:stub}

alpaca:
  base-url: ${APCA_API_BASE_URL:https://paper-api.alpaca.markets}
  api-key-id: ${APCA_API_KEY_ID:}
  api-secret-key: ${APCA_API_SECRET_KEY:}

# Fill listener (broker push + polling fallback). Default OFF; enable per
# deployment via EXEC_FILL_LISTENER_ENABLED=true. Single-pod constraint —
# multi-pod deployments would multiply dispatch cost by N until leader
# election lands.
exec:
  fill-listener:
    enabled: ${EXEC_FILL_LISTENER_ENABLED:false}
    ws-url: ${EXEC_FILL_LISTENER_WS_URL:wss://paper-api.alpaca.markets/stream}
    reconnect-base-ms: 1000
    reconnect-cap-ms: 60000
    dedup-cache-size: 1024
    poll:
      enabled: ${EXEC_FILL_LISTENER_POLL_ENABLED:false}
      interval-ms: 30000
      grace-ms: 60000
      batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
