spring:
  application:
    name: exec-svc
  # Worker-only service; spring-boot-starter-web is on the classpath for RestClient,
  # but no HTTP listener should bind on this pod.
  main:
    web-application-type: none
  datasource:
    url: ${EXEC_TRADIER_PAPER_DB_URL:jdbc:postgresql://localhost:5432/exec_tradier_paper}
    username: ${EXEC_TRADIER_PAPER_DB_USER:temporal}
    password: ${EXEC_TRADIER_PAPER_DB_PASS:temporal}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:broker-tradier-paper}

# OptionsBroker impl selector. Values: 'stub' (in-memory) | 'alpaca-paper'
# (HTTP client to paper-api.alpaca.markets). Additional adapters (tradier,
# ibkr, schwab) land as 2c.x follow-ups.
broker:
  impl: ${BROKER_IMPL:stub}

alpaca:
  base-url: ${APCA_API_BASE_URL:https://paper-api.alpaca.markets}
  api-key-id: ${APCA_API_KEY_ID:}
  api-secret-key: ${APCA_API_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
