[project]
name = "ohmytradeagent-sidecar"
version = "0.1.0"
description = "Discord signal-source sidecar for oh-my-tradeagent"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "python-dotenv>=1.0",
    "temporalio>=1.9",
    "tzdata>=2024.1",
    "ohmytradeagent-contract",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.uv.sources]
ohmytradeagent-contract = { path = "../../contract/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmytradeagent_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
