# Per-test timeout so a HANG becomes a NAMED FAILURE in 60s instead of a job that burns
# GitHub's 360-minute default doing nothing.
#
# Why this exists: the orchestrator leg hung twice on 2026-08-16/17 — once for 21+ minutes
# against a 3m42s-4m02s norm, stuck inside `mvn verify` with no indication of which test. The
# remedy each time was "cancel and re-run", which tells you nothing and loses the evidence. A
# hang and a slow suite are indistinguishable from the outside; this makes them distinguishable,
# and the failure message names the test method.
#
# Why 60s is safe: measured over the full suite on 2026-08-17 — 1346 test methods, slowest
# single method 5.54s (CopytradeSignalWorkflowImplPreTradeDispatchTest), and ZERO methods over
# 10s. 60s is ~11x the slowest observed test, so a CI runner would have to be an order of
# magnitude slower than a laptop before this fires on a healthy test. Re-measure before lowering
# it; a timeout tuned so tight that it fires on load is worse than none, because it trains
# everyone to re-run on red.
#
# Scope note: this is the TESTABLE-METHOD default only. It deliberately does NOT cover @BeforeAll
# / static initialisers / fork startup — a hang there produces no test to attribute it to. That
# gap is covered by surefire's forkedProcessTimeoutInSeconds in this module's pom.xml, and by
# timeout-minutes on the CI job.
junit.jupiter.execution.timeout.testable.method.default = 60s
