# Per-test timeout so a HANG becomes a NAMED FAILURE in 60s instead of a job that burns
# GitHub's 360-minute default doing nothing.
#
# Why this exists: the orchestrator leg hung twice on 2026-08-16/17 — once for 21+ minutes
# against a 3m42s-4m02s norm, stuck inside `mvn verify` with no indication of which test. The
# remedy each time was "cancel and re-run", which tells you nothing and loses the evidence. A
# hang and a slow suite are indistinguishable from the outside; this makes them distinguishable,
# and the failure message names the test method.
#
# Why 90s, raised from 60s on 2026-08-23: it MUST clear the bounded wait helpers' own budget with
# room to spare. PositionWorkflowImplTest's waiters give up after WAIT_DEADLINE_MS (50s) and then
# fail with a NAMED assertion saying which audit kind or placeOrder count was awaited. At 60s a
# test that exhausted one of those budgets and then did a little more work tripped THIS timeout
# first, and the two outcomes are not equally useful: the named assertion tells you what the
# workflow failed to do, while "timed out after 60 seconds" tells you nothing and costs a re-run.
# 8 of the last 10 CI re-runs before this change were PositionWorkflowImplTest, split between
# exactly those two shapes.
#
# So the ordering is deliberate and load-bearing: helper budget (50s) < per-test timeout (90s) <
# surefire forkedProcessTimeoutInSeconds (900s). Each layer names more than the one below it, so
# the cheapest-to-diagnose layer should always fire first. If you change one, check the others.
#
# The happy path is unaffected: measured over the full suite, the slowest single healthy method is
# ~5.5s and none exceed 10s, so 90s is still ~16x the slowest observed test. Raising the ceiling
# only delays how long a genuine WEDGE takes to surface (60s -> 90s), which is a cheap trade for
# never mistaking an exhausted wait for a hang.
#
# Scope note: this is the TESTABLE-METHOD default only. It deliberately does NOT cover @BeforeAll
# / static initialisers / fork startup — a hang there produces no test to attribute it to. That
# gap is covered by surefire's forkedProcessTimeoutInSeconds in this module's pom.xml, and by
# timeout-minutes on the CI job.
junit.jupiter.execution.timeout.testable.method.default = 90s

# Auto-register test-scoped extensions found via ServiceLoader (META-INF/services). Currently just
# ThreadDumpOnTimeout, which turns the timeout above from a bare "X timed out after 60 seconds" into
# a full thread dump with lock ownership. #723's armTrail_* flake has never reproduced locally, so
# the ONLY chance to see it is the CI run where it fires; without this, each occurrence costs a
# re-run and records nothing. Autodetection rather than @ExtendWith because that flake has already
# hit three different classes and a per-class annotation would miss the next one.
junit.jupiter.extensions.autodetection.enabled = true
