spring:
  application:
    name: orchestrator-svc
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:postgresql://localhost:5432/temporal}
    username: ${ORCHESTRATOR_DB_USER:temporal}
    password: ${ORCHESTRATOR_DB_PASS:temporal}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:orchestrator-core}

orchestrator:
  tenants-dir: ${ORCHESTRATOR_TENANTS_DIR:tenants}
  capital:
    per-strategy: ${ORCHESTRATOR_CAPITAL_PER_STRATEGY:100000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
