spring:
  application:
    name: orchestrator-svc
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
    # Issue #84: the application-runtime path connects as the least-privileged
    # `orchestrator_runtime` role, which inherits `orchestrator_app` and is therefore
    # bound by the V3 REVOKE UPDATE,DELETE,TRUNCATE on `audit_log`. Postgres superusers
    # (the prior `temporal` default) bypass that REVOKE — see docs/ops/audit-retention.md §4.
    # Flyway keeps its privileged creds via spring.flyway.user/password below.
    username: ${ORCHESTRATOR_DB_USER:orchestrator_runtime}
    password: ${ORCHESTRATOR_DB_PASS:orchestrator_runtime}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Issue #84: Flyway migrations need DDL+GRANT privileges (CREATE ROLE, GRANT) that
    # `orchestrator_runtime` deliberately lacks. The override below keeps Flyway connected
    # as the schema owner / superuser-class `temporal` role while the application
    # DataSource above flips to the constrained runtime role.
    user: ${ORCHESTRATOR_FLYWAY_USER:temporal}
    password: ${ORCHESTRATOR_FLYWAY_PASS:temporal}
    # The orchestrator owns a dedicated `orchestrator` Postgres database (issue #56
    # item 9). It used to share the `temporal` DB with Temporal's auto-setup, which
    # made `DROP DATABASE temporal` in the temporal-consolidation teardown runbook
    # destroy `audit_log` and `option_symbol_cache`. The dedicated DB is empty on
    # fresh deploys, but baseline-on-migrate is retained for back-compat with
    # already-deployed clusters that pre-date item 9 (they keep the schema where
    # Temporal had populated `public`, until they cut over to a fresh DB).
    baseline-on-migrate: true
    # baseline-version: 0 was originally needed to keep V1 from being skipped on
    # the shared-with-Temporal DB (issue #56 item 3). It's harmless on the new
    # dedicated DB (empty `public`) and still correct for fresh deploys.
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:orchestrator-core}

orchestrator:
  tenants-dir: ${ORCHESTRATOR_TENANTS_DIR:tenants}
  capital:
    per-strategy: ${ORCHESTRATOR_CAPITAL_PER_STRATEGY:100000}

# Watchlist-trigger ingest discriminator. WatchlistMirrorActivitiesImpl fans a clean watchlist parse
# out to a WatchlistTriggerSessionWorkflow ONLY for the strategy_id named here. Setting it makes the
# ingest wiring LIVE; actual live trading is still double-gated by the strategy's `enabled: false`
# (watchlist-trigger-v1.yaml) AND the (unconfigured by default) real-time stock feed. The operator
# enables trading by flipping enabled:true on the dashboard after entitling the stock feed — no
# config change here is needed. Blank disables the fan-out entirely (mirror-only behaviour).
watchlist:
  trigger:
    strategy-id: ${WATCHLIST_TRIGGER_STRATEGY_ID:watchlist-trigger-v1}

# Issue #85: audit-log per-row SHA-256 hash chain. When enabled, AuditActivitiesImpl
# takes a `pg_advisory_xact_lock(hashtext(tenant_id)::int4, hashtext(strategy_id)::int4)`
# — two-arg form; 2^64 distinct key tuples; auto-releases at transaction commit —
# to serialize concurrent inserts to the same (tenant, strategy) chain.
# Plain SELECT (no FOR UPDATE) reads the prior chain head; V3 immutability REVOKE
# blocks SELECT FOR UPDATE which would require UPDATE privilege.
# Persists prev_hash + row_hash on every INSERT.
# Disable (set to false) for single-knob rollback if a hashing bug surfaces in
# production — new rows then carry NULL hash columns (V3 schema permits it).
audit:
  chain-writer:
    enabled: ${AUDIT_CHAIN_WRITER_ENABLED:true}

# Issue #297 / #302: non-blocking, best-effort Discord alert on copytrade BTO/STC order failures.
# OrderFailureAlerter consumes an internal event published by AuditActivitiesImpl.log() via
# @TransactionalEventListener(AFTER_COMMIT) and dispatches a Discord webhook for allowlisted failure
# kinds AFTER the audit transaction commits — so a slow webhook can never hold the audit DB
# transaction open (issue #302). The webhook URL comes from a k8s secret (operator follow-up) — when
# blank the alerter is a no-op (logs the would-be alert at INFO). A webhook timeout/error is caught
# and logged, NEVER propagated into the audit write or the trading path.
#
# Issue #308: SignalFeedAlerter mirrors the FULL signal feed to the SAME webhook via the same
# after-commit seam — a "received" message on ingest plus an "accepted/rejected/avg-skipped" outcome.
# It is gated by alert.discord.signal-feed.enabled (ALERT_SIGNAL_FEED_ENABLED, default false) so the
# high-volume mirror toggles independently of the failure alerts. SignalRejected was dropped from
# failure-kinds below: the feed alerter owns it now, so a rejected signal posts exactly one message.
alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}
    # Optional per-tenant alert routing. `tenant=url` entries, ';'-separated (key/value split on the
    # FIRST '=' so a URL may itself contain '='). A tenant present here routes its alerts to its own
    # webhook; any tenant absent here falls back to webhook-url above. Blank/unset → global only.
    # The real per-tenant URLs are operator secrets injected into the discord-alert-credentials
    # Secret at deploy time (out of band) — never committed to the repo.
    webhook-urls: ${ALERT_DISCORD_WEBHOOK_URLS:}
    # Comma-separated allowlist of audit kinds that trigger a failure alert (avoids channel spam).
    # SignalRejected intentionally absent (issue #308) — owned by the signal-feed outcome mirror.
    # B3 (PLAN-exit-place-duplicate-422-crash): PositionOrphan / PositionOrphanOngoing (recon's
    # live-orphan pages) and PartialExitPlaceFailed (a failed exit placement) are shipped in this
    # IMAGE default — NOT via 40-tenants-config, which deploy.yml never applies — so the orphan-blind
    # spot from the QQQ-725 incident cannot silently reopen. Mirrors DEFAULT_FAILURE_KINDS in
    # OrderFailureAlerter.java.
    failure-kinds: ${ALERT_DISCORD_FAILURE_KINDS:OrphanSTC,EntryExpired,PositionOrphan,PositionOrphanOngoing,PartialExitPlaceFailed}
    signal-feed:
      # Issue #308: mirror every BTO/STC/AVG signal (received + outcome) to the same webhook.
      # Off by default — opt in via ALERT_SIGNAL_FEED_ENABLED=true. Independent of failure alerts.
      enabled: ${ALERT_SIGNAL_FEED_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Surfaces /actuator/health/{liveness,readiness} regardless of Spring Boot's
      # k8s auto-detection heuristic. The k3s manifests probe those paths.
      probes:
        enabled: true
