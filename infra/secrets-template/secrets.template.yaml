# Template — do NOT apply this file as-is. Copy to secrets.local.yaml, fill in
# real values, `kubectl apply -f secrets.local.yaml`, then keep secrets.local.yaml
# out of git. The placeholder values below will not start a working cluster on
# purpose — fail-loud is safer than fail-silent on weak defaults.
#
# Tradier and Discord blocks light up in 5b.D and onwards.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: copytrade
type: Opaque
stringData:
  # POSTGRES_USER / POSTGRES_PASSWORD remain the superuser-class `temporal` creds.
  # They back BOTH Temporal's auto-setup and Flyway (spring.flyway.user/password
  # via ORCHESTRATOR_FLYWAY_USER / ORCHESTRATOR_FLYWAY_PASS in
  # infra/k8s/51-orchestrator.yaml). DDL + GRANT need this elevated role.
  POSTGRES_USER: REPLACE_WITH_POSTGRES_USER
  POSTGRES_PASSWORD: REPLACE_WITH_STRONG_POSTGRES_PASSWORD
  # Issue #84: the orchestrator application-runtime DataSource connects as
  # `orchestrator_runtime` — a non-superuser login role with `orchestrator_app`
  # membership. The V3 REVOKE UPDATE,DELETE,TRUNCATE on `audit_log` only binds
  # for non-superusers, so this is the role that makes audit-log immutability
  # actually enforceable at the engine layer. See docs/ops/audit-retention.md §4.
  #
  # Operators MUST set ORCHESTRATOR_RUNTIME_PASSWORD here AND run
  # `ALTER ROLE orchestrator_runtime PASSWORD '<value>'` against the DB AFTER
  # V4__orchestrator_runtime_role.sql has executed (the migration creates the
  # role with placeholder `__SET_BY_OPERATOR__`). The PR body for #84 has the
  # full step-by-step.
  ORCHESTRATOR_RUNTIME_USER: orchestrator_runtime
  ORCHESTRATOR_RUNTIME_PASSWORD: REPLACE_WITH_STRONG_ORCHESTRATOR_RUNTIME_PASSWORD
---
# Required sidecar config — the sidecar Deployment will fail to start until
# this Secret exists with all three keys. Env-var names match exactly what
# services/signal-source-discord/ohmytradeagent_sidecar/main.py reads
# (TENANT_ID / STRATEGY_ID / DISCORD_CHANNEL_URL — not the copytrade_*
# variants that an earlier draft of the manifest used).
apiVersion: v1
kind: Secret
metadata:
  name: sidecar-config
  namespace: copytrade
type: Opaque
stringData:
  DISCORD_CHANNEL_URL: "https://discord.com/channels/<server-id>/<channel-id>"
  TENANT_ID: dev
  STRATEGY_ID: copytrade-v1
---
# Phase 2c.2: Alpaca paper credentials shared by exec-svc (broker) and
# market-data-svc (snapshot + WS stream). Required when BROKER_IMPL=alpaca-paper
# or MARKET_DATA_PROVIDER=alpaca; both pods will fail-fast at startup on a
# blank key.
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-credentials
  namespace: copytrade
type: Opaque
# WARNING: 'REPLACE_ME' is non-blank and will pass the AlpacaMarketDataConfig.isBlank() fail-fast
# check at startup. The market-data-svc and exec-svc pods will START successfully with these
# placeholder values, but every Alpaca REST call will 401 and every WS stream will be rejected.
# Replace both keys with real credentials before applying this Secret to a cluster you expect to
# trade. Leaving the literal string here is strictly worse than blank — it hides the
# misconfiguration behind a successful boot.
stringData:
  APCA_API_KEY_ID: REPLACE_ME
  APCA_API_SECRET_KEY: REPLACE_ME
  APCA_API_BASE_URL: https://paper-api.alpaca.markets
---
# Alpaca LIVE (real-money) credentials for the exec-alpaca-live Deployment
# (BROKER_IMPL=alpaca-live, task queue broker-alpaca-live, DB exec_alpaca_live).
# Kept SEPARATE from alpaca-credentials so a paper pod can never pick up live keys
# and vice-versa. AlpacaConfig enforces a base-url/broker.impl coherence guard: an
# alpaca-live impl fails fast at startup unless APCA_API_BASE_URL is the live host
# (must NOT contain 'paper'). This Secret is NOT applied by deploy.yml — the
# operator creates it by hand at cutover (see PLAN-alpaca-live-adapter.md Phase 3),
# ideally with `kubectl create secret generic alpaca-credentials-live ...` using a
# freshly rotated key rather than committing real values here.
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-credentials-live
  namespace: copytrade
type: Opaque
# WARNING: same caveat as alpaca-credentials — 'REPLACE_ME' is non-blank, so the
# pod boots but every REST call 401s. Replace with real LIVE credentials before
# applying to a cluster you expect to trade real money.
stringData:
  APCA_API_KEY_ID: REPLACE_ME
  APCA_API_SECRET_KEY: REPLACE_ME
  APCA_API_BASE_URL: https://api.alpaca.markets
---
# P4-b: per-tenant scoped broker credentials for the FileMountedBrokerCredentialSource
# (broker.creds.source=file). Mounted as a VOLUME (not envFrom) at
# /etc/broker-creds/<tenant>-<provider>/ so each Secret data key becomes a per-field file
# (api-key-id, api-secret-key, base-url, ws-url[opt], expected-account-id[opt]). This example
# is the `staging_paper` tenant on alpaca; the operator creates the real one with:
#   kubectl create secret generic broker-creds-staging-paper -n copytrade \
#     --from-literal=api-key-id=<PAPER_KEY> \
#     --from-literal=api-secret-key=<PAPER_SECRET> \
#     --from-literal=base-url=https://paper-api.alpaca.markets \
#     --from-literal=expected-account-id=PA3FKGPFYPLH
# NOT applied by deploy.yml — activation is a gated operator step. See
# docs/ops/multi-tenant-staging-paper-activation.md. NEVER commit real keys here.
apiVersion: v1
kind: Secret
metadata:
  name: broker-creds-staging-paper
  namespace: copytrade
type: Opaque
# expected-account-id pins the brokerage account the keys must authenticate (the P2 boot
# assertion reads /v2/account and crashloops on mismatch) AND is cross-checked against the
# strategy config's broker_account_id at order time (P4-c-b-2). Keep it == the tenant config's
# broker_account_id (PA3FKGPFYPLH) or orders fail closed with AccountMismatchError.
stringData:
  api-key-id: REPLACE_ME
  api-secret-key: REPLACE_ME
  base-url: https://paper-api.alpaca.markets
  expected-account-id: PA3FKGPFYPLH
---
# Tradier sandbox creds — wire up in 5b.D when flipping BROKER_IMPL to
# `tradier`. Until then the exec-tradier-paper Deployment runs with the
# stub broker.
apiVersion: v1
kind: Secret
metadata:
  name: tradier-credentials
  namespace: copytrade
type: Opaque
stringData:
  TRADIER_API_TOKEN: "REPLACE_WITH_SANDBOX_TOKEN"
  TRADIER_ACCOUNT_ID: "REPLACE_WITH_ACCOUNT_ID"
---
# Tenant dashboard (BFF + Next.js web). Consumed by infra/k8s/58-tenant-dashboard-bff.yaml and
# 59-dashboard.yaml. The web app fails to start without AUTH_SECRET + provider creds; the BFF
# fails its DB reads without the bff_readonly creds.
#
# OPERATOR SETUP for the bff_readonly role (the BFF owns NO schema on the orchestrator/exec DBs, so
# it must NOT run DDL there — provision the role out of band, mirroring the orchestrator_runtime
# `__SET_BY_OPERATOR__` pattern). Run ONCE per DB as the superuser `temporal` role, AFTER the owning
# service's Flyway has created the tables:
#
#   -- orchestrator DB (audit_log):
#   CREATE ROLE bff_readonly LOGIN PASSWORD '<BFF_ORCHESTRATOR_DB_PASS>';
#   GRANT CONNECT ON DATABASE orchestrator TO bff_readonly;
#   GRANT USAGE ON SCHEMA public TO bff_readonly;
#   GRANT SELECT ON audit_log TO bff_readonly;        -- SELECT ONLY — no INSERT/UPDATE/DELETE
#   GRANT SELECT ON strategy_config TO bff_readonly;        -- SELECT ONLY
#
#   -- exec_alpaca_paper DB (order_intent_journal):
#   CREATE ROLE bff_readonly LOGIN PASSWORD '<BFF_EXEC_ALPACA_PAPER_DB_PASS>';
#   GRANT CONNECT ON DATABASE exec_alpaca_paper TO bff_readonly;
#   GRANT USAGE ON SCHEMA public TO bff_readonly;
#   GRANT SELECT ON order_intent_journal TO bff_readonly;
#
# SELECT-only grants mean even a SQL-injection bug in the BFF cannot mutate trading state.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
  namespace: copytrade
type: Opaque
stringData:
  # Auth.js. AUTH_SECRET: `openssl rand -base64 32`. Provider creds from the Google Cloud / Meta
  # developer consoles; redirect URI is https://<host>/api/auth/callback/{google,facebook}
  # (Google/Facebook reject non-localhost http:// — see the TLS note in 59-dashboard.yaml).
  AUTH_SECRET: REPLACE_WITH_OPENSSL_RAND_BASE64_32
  AUTH_GOOGLE_ID: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID
  AUTH_GOOGLE_SECRET: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_SECRET
  AUTH_FACEBOOK_ID: REPLACE_WITH_FACEBOOK_APP_ID
  AUTH_FACEBOOK_SECRET: REPLACE_WITH_FACEBOOK_APP_SECRET
  # Shared service token presented by the Next.js server on every BFF call (must match on both
  # pods). Generate a long random value: `openssl rand -hex 32`.
  BFF_SHARED_TOKEN: REPLACE_WITH_LONG_RANDOM_SHARED_TOKEN
  # SELECT-only role password for the `dashboard` DB — the SINGLE source of this credential. The
  # BFF's Flyway (V2__dashboard_readonly_role.sql) injects it into CREATE ROLE at migration time (via
  # the `dashboard_readonly_password` placeholder), and the Next.js web app connects to `dashboard`
  # as `dashboard_readonly` with it (59-dashboard.yaml builds the connection from discrete fields, so
  # there is no connection URL to keep in sync). The web app uses this least-privilege role — NOT the
  # elevated `temporal` role — so its compromise cannot run DDL. Generate: `openssl rand -hex 32`.
  DASHBOARD_READONLY_PASSWORD: REPLACE_WITH_STRONG_DASHBOARD_READONLY_PASSWORD
  # bff_readonly creds per trading-state DB (see the OPERATOR SETUP block above).
  BFF_ORCHESTRATOR_DB_USER: bff_readonly
  BFF_ORCHESTRATOR_DB_PASS: REPLACE_WITH_STRONG_BFF_READONLY_PASSWORD
  BFF_EXEC_ALPACA_PAPER_DB_USER: bff_readonly
  BFF_EXEC_ALPACA_PAPER_DB_PASS: REPLACE_WITH_STRONG_BFF_READONLY_PASSWORD
