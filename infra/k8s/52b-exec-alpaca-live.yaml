apiVersion: v1
kind: Service
metadata:
  name: exec-alpaca-live
  namespace: copytrade
spec:
  selector:
    app: exec-alpaca-live
  ports:
    # Spring Boot actuator on the main HTTP port. Use for health / info /
    # prometheus scrape and ad-hoc `kubectl exec ... wget /actuator/...` triage.
    # No business-logic controllers on this port — exec-svc is a Temporal
    # worker, so requests to `/` get a Spring 404.
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-alpaca-live
  namespace: copytrade
  labels:
    app: exec-alpaca-live
spec:
  # MUST stay at 1 — this is a LOAD-BEARING FILL-CORRECTNESS invariant, not a
  # cost knob. The fill-listener (AlpacaTradeUpdatesStream + FillPoller in the
  # exec-svc fill package) is not leader-elected. Under Phase G's per-tenant
  # mode each pod opens N trade-updates sockets (one per live tenant); M pods ×
  # N sockets = M duplicate fill signals PER ACCOUNT (the WS dedup map is
  # per-socket/per-pod, so it cannot suppress a duplicate arriving on another
  # pod's socket). Single-pod is the SOLE guard against duplicate fills until
  # the deferred leader-elected fill router lands. Scaling this >1 (HPA, manual
  # edit, or a rollout that briefly runs 2 pods) double-counts live fills. See
  # docs/ops/fill-listener.md for the constraint + the leader-election follow-up.
  replicas: 1
  selector:
    matchLabels:
      app: exec-alpaca-live
  template:
    metadata:
      labels:
        app: exec-alpaca-live
    spec:
      containers:
        - name: exec-alpaca-live
          # Same provider-agnostic exec-svc image as exec-alpaca-paper; the live
          # Alpaca adapter is selected at boot via BROKER_IMPL=alpaca-live (the
          # AlpacaConfig/AlpacaPaperBroker/AlpacaTradeUpdatesStream conditions
          # activate on any alpaca-* target). TEMPORAL_TASK_QUEUE and EXEC_DB_URL
          # point at the dedicated live queue + DB so live order intents/journal
          # never share idempotency keys with the paper book.
          # NOTE: this Deployment is NOT applied by deploy.yml (exec-alpaca-live
          # is not in the SERVICES matrix); the operator applies it by hand at
          # cutover. See _workspace/PLAN-alpaca-live-adapter.md Phase 3.
          image: ghcr.io/ridopark/oh-my-tradeagent-exec:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # Alpaca LIVE credentials: APCA_API_KEY_ID + APCA_API_SECRET_KEY +
            # APCA_API_BASE_URL (https://api.alpaca.markets). Operator-provisioned
            # separately (kubectl create secret generic alpaca-credentials-live ...);
            # kept distinct from alpaca-credentials so live keys never reach a paper
            # pod. AlpacaConfig fails fast if this base-url points at a paper host.
            - secretRef:
                name: alpaca-credentials-live
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            - name: TEMPORAL_TASK_QUEUE
              value: broker-alpaca-live
            - name: EXEC_DB_URL
              value: jdbc:postgresql://postgres:5432/exec_alpaca_live
            - name: EXEC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: EXEC_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: BROKER_IMPL
              value: alpaca-live
            # Phase P2 live-safety: the brokerage account the live keys MUST authenticate. At boot,
            # AlpacaAccountIdentityProbe reads /v2/account and refuses to start (fail closed →
            # crashloop) if the keys authenticate a different account, or if this is blank on a
            # -live impl. Operator-applied at cutover; the live exec is not in the deploy matrix.
            - name: EXPECTED_ALPACA_ACCOUNT_ID
              value: "847309116"
            # Production fill detection: WS trade-updates + 30s polling fallback.
            # docs/ops/fill-listener.md for the cooperation model + single-pod constraint.
            # Both default OFF in application.yml; this manifest opts in.
            - name: EXEC_FILL_LISTENER_ENABLED
              value: "true"
            - name: EXEC_FILL_LISTENER_POLL_ENABLED
              value: "true"
            # The fill-listener WS URL is a SEPARATE knob from the REST base-url
            # (which comes from the alpaca-credentials-live Secret). It defaults to
            # the PAPER stream in application.yml, so a live deployment MUST override
            # it to the live trade-updates stream or the WS authenticates live keys
            # against the paper endpoint (rejected) and fills fall back to the 30s
            # REST poller only. The AlpacaConfig base-url guard does NOT cover this.
            - name: EXEC_FILL_LISTENER_WS_URL
              value: wss://api.alpaca.markets/stream
            # DECLARED 2026-08-16 to close a drift, not to change behaviour — the running pod
            # already had this set IMPERATIVELY (absent from both this manifest and
            # last-applied-configuration). It survived `kubectl apply` only by strategic-merge
            # accident, exactly like ALPACA_STOCK_FEED=sip on market-data.
            #
            # It is load-bearing for REAL MONEY: this pod serves prod_real / prod-kipark /
            # prod-jinchul, three DISTINCT Alpaca accounts. Reverting to the single-socket default
            # would authenticate one pod-wide credential and silently stop delivering fills for the
            # others — the exact failure exec-alpaca-paper is in today. A delete/recreate, a
            # namespace rebuild, or a switch to server-side apply would have done that, and the
            # only symptom would have been fills quietly arriving 30-69s late again.
            - name: EXEC_FILL_LISTENER_PER_TENANT_ENABLED
              value: "true"
            # Same drift, same reason: set IMPERATIVELY on the running pod, absent from this
            # manifest and from last-applied-configuration. Declared here, no behaviour change.
            #
            # BROKER_CREDS_SOURCE is the dangerous one on a REAL-MONEY pod: without it the source
            # falls back to `env` (matchIfMissing) and every tenant would resolve the single
            # pod-wide alpaca-credentials-live key instead of its own row — prod-kipark and
            # prod-jinchul orders would route to prod_real's account. The
            # BrokerAccountIdentityVerifier cross-check should catch that and fail closed, but
            # relying on a downstream assertion to save a misconfiguration is not a design.
            #
            # NOTE: unlike exec-alpaca-paper, this pod KEEPS its `envFrom` secretRef. The same
            # analysis says it is unread here too, but removing a real-money credential is a
            # separate change that deserves its own verification rather than riding along.
            - name: BROKER_CREDS_SOURCE
              value: db
            - name: EXEC_BOOTSTRAP_TENANT_ID
              value: prod_real
            - name: BROKER_CREDS_DB_LIVE_ENABLED
              value: "true"
            # Operator-provisioned; NOT optional (see the paper manifest for the rationale).
            - name: EXEC_ADMIN_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: exec-admin-credentials
                  key: EXEC_ADMIN_SHARED_TOKEN
            # Issue #297 / #295: non-blocking Discord alert on a broker rejection in placeOrder.
            # The webhook URL is an operator-provisioned secret. `optional: true` so the pod still
            # boots when the secret is absent — the alerter is then a no-op (logs the would-be
            # alert) and the broker/order path is entirely unaffected. Provisioning the
            # `discord-alert-credentials` Secret with key ALERT_DISCORD_WEBHOOK_URL is an operator
            # follow-up.
            - name: ALERT_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-alert-credentials
                  key: ALERT_DISCORD_WEBHOOK_URL
                  optional: true
            # Per-tenant alert routing: an optional `tenant=url;tenant=url` map (split on the first
            # `=` per entry). A tenant present here routes its broker-rejection alert to its own
            # webhook; any tenant absent here falls back to ALERT_DISCORD_WEBHOOK_URL above. Without
            # this, this LIVE tenant's order-failure alert lands in another tenant's (e.g. paper)
            # channel. The real per-tenant URLs are operator secrets injected into the
            # discord-alert-credentials Secret at deploy time (out of band) — never committed.
            # `optional: true` so the pod still boots when the key is absent (the map is then empty
            # and every tenant uses the global default).
            - name: ALERT_DISCORD_WEBHOOK_URLS
              valueFrom:
                secretKeyRef:
                  name: discord-alert-credentials
                  key: ALERT_DISCORD_WEBHOOK_URLS
                  optional: true
          # exec-svc is a Temporal worker but keeps the default servlet web stack so
          # actuator (health / info / prometheus) is reachable on 8080. No
          # business-logic controllers; the worker poll loop is still the implicit
          # liveness signal — no httpGet probes wired today.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
