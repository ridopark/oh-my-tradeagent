apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: copytrade
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8082
      targetPort: 8082
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: copytrade
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Issue #108: first-deploy readiness gate. api-gateway's AuditController
      # reads `audit_log` from the `orchestrator` Postgres DB, but on a clean
      # cluster boot it can race orchestrator-svc's Flyway V2 migration that
      # creates the table — returning empty results until V2 lands. Block Ready
      # here until `audit_log` exists in the orchestrator DB. Reuses the
      # existing postgres-credentials secret (POSTGRES_USER / POSTGRES_PASSWORD,
      # same keys orchestrator-svc's Flyway uses), so no new secrets, no new
      # ServiceAccount, no new RBAC. The `postgres:16` image is already pulled
      # by the postgres StatefulSet — initContainer reuse keeps cluster image
      # footprint unchanged. Loop polls every 3s with no upper bound so the
      # pod stays Init:0/1 until orchestrator-svc finishes migrating.
      initContainers:
        - name: wait-for-audit-log
          image: postgres:16
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: orchestrator
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              echo "wait-for-audit-log: polling orchestrator.audit_log existence"
              until [ "$(psql -tA -c "SELECT to_regclass('public.audit_log') IS NOT NULL")" = "t" ]; do
                echo "  audit_log not yet present (orchestrator-svc Flyway V2 pending); retrying in 3s"
                sleep 3
              done
              echo "wait-for-audit-log: audit_log table present; api-gateway may proceed"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api-gateway
          image: ghcr.io/ridopark/oh-my-tradeagent-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            # Issue #56 item 9: api-gateway reads `audit_log` from the dedicated
            # `orchestrator` database the orchestrator-svc writes it to. Must stay
            # co-located, otherwise AuditController returns empty results.
            - name: API_GATEWAY_DB_URL
              value: jdbc:postgresql://postgres:5432/orchestrator
            - name: API_GATEWAY_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: API_GATEWAY_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: API_GATEWAY_PORT
              value: "8082"
            - name: API_GATEWAY_DEFAULT_TENANT
              value: dev
            - name: API_GATEWAY_DEFAULT_STRATEGY
              value: copytrade-v1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
# Operator REST. Traefik is k3s's default ingress controller; matches by host
# header. Update the host to whatever you point at the homelab node.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: copytrade
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: copytrade.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8082
