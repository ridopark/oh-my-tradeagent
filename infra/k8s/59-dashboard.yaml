# Next.js tenant dashboard — the SINGLE public surface for this feature. Deployment + Service +
# Ingress (Traefik, TLS). The browser talks ONLY to this; the server-side calls the off-ingress BFF
# (58-tenant-dashboard-bff.yaml) over in-cluster HTTP with the shared service token.
#
# TLS (plan §G): terminated at Traefik on the `websecure` entrypoint using the operator-provisioned
# `dashboard-tls` secret — a homelab-CA-signed wildcard cert for *.192.168.10.123.nip.io (the nip.io
# host resolves to the LAN IP with no /etc/hosts entry; provisioning steps in infra/k8s/README.md).
# https is REQUIRED here, unlike the http-only operator services: Google/Facebook reject non-localhost
# http:// redirect URIs, and the session cookie's Secure flag is only honored over https. The homelab
# CA is not publicly trusted — operators import it into their browser/OS once. For a publicly
# resolvable host, swap in a real cert (cert-manager + Let's Encrypt) and keep the rest unchanged.
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: copytrade
spec:
  selector:
    app: dashboard
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: copytrade
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/ridopark/oh-my-tradeagent-dashboard:latest
          imagePullPolicy: Always
          # Least-privilege runtime. The image already runs as UID 1001 (dashboard/Dockerfile, the
          # `nextjs` user); make it explicit + drop caps and privilege escalation. Next.js standalone
          # serves prebuilt assets, so readOnlyRootFilesystem could be added later with a writable
          # /tmp mount.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            # Auth.js. AUTH_URL builds the OAuth callback URLs and is the trusted origin for the
            # session cookie, so it must name the host the browser actually arrives on. Since the
            # Cloudflare Tunnel went up (2026-06-18) that is the PUBLIC host, not the LAN Ingress
            # below — logins come in through cloudflared.
            #
            # DECLARED 2026-08-17 to close a drift, not to change behaviour: the live pod has
            # carried the public value since the tunnel shipped, while this manifest still said
            # nip.io. Applying the file as written would have repointed Auth.js at the LAN host and
            # broken public sign-in on redirect_uri mismatch. Same class as the exec drift in #696
            # and the market-data drift in #700.
            #
            # Do NOT "simplify" this by deleting AUTH_URL and leaning on AUTH_TRUST_HOST — that was
            # tried first and FAILED through the tunnel: Auth.js v5 derived the base URL from the
            # pod bind address and sent Google `redirect_uri=https://0.0.0.0:3000/...`, which Google
            # rejected (CallbackRouteError / invalid_request).
            #
            # TRADEOFF, accepted: login is pinned to the public host, so signing in at the LAN
            # nip.io address bounces to tradeagent.ridopark.com and pure-offline LAN login is gone
            # if the tunnel is down. Emergency controls do not depend on it — the kill switch is
            # operable over LAN via kubectl/Temporal. Both callback URLs are registered on the
            # homelab Google OAuth client, so re-pinning to the LAN host is a one-value change.
            - name: AUTH_URL
              value: https://tradeagent.ridopark.com
            # Auth.js v5 runs behind Traefik (not Vercel), so trust the proxied Host header when
            # constructing callback URLs.
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: AUTH_SECRET
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: AUTH_GOOGLE_ID
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: AUTH_GOOGLE_SECRET
            - name: AUTH_FACEBOOK_ID
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: AUTH_FACEBOOK_ID
            - name: AUTH_FACEBOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: AUTH_FACEBOOK_SECRET
            # Identity -> tenant lookup (the `dashboard` DB the BFF owns). Discrete fields so the
            # password is single-sourced from DASHBOARD_READONLY_PASSWORD (same value the BFF Flyway
            # creates the dashboard_readonly role with) — no URL to keep in sync.
            - name: DASHBOARD_DB_HOST
              value: postgres
            - name: DASHBOARD_DB_NAME
              value: dashboard
            - name: DASHBOARD_DB_USER
              value: dashboard_readonly
            - name: DASHBOARD_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: DASHBOARD_READONLY_PASSWORD
            # Off-ingress BFF: in-cluster ClusterIP DNS + the shared service token.
            - name: BFF_INTERNAL_URL
              value: http://tenant-dashboard-bff:8083
            - name: BFF_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: BFF_SHARED_TOKEN
            # UI-P2-b: api-gateway broker-credential WRITE endpoint. In-cluster ClusterIP DNS + the
            # shared service token (must equal api-gateway's API_GATEWAY_SHARED_TOKEN). The secret
            # entered in the form flows server-side ONLY — never returned to the browser.
            - name: API_GATEWAY_BASE_URL
              value: http://api-gateway:8082
            # optional: true keeps the dashboard pod booting while the credential-write feature is
            # dark (the key only matters when BROKER_CREDENTIALS_WRITE_ENABLED=true and a tenant
            # submits via /settings). Without this, a missing key is a CreateContainerConfigError that
            # blocks the whole dashboard rollout. The operator adds the real key (matching
            # api-gateway's token) at activation — see docs/ops/broker-credential-opt-in.md.
            - name: API_GATEWAY_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: API_GATEWAY_SHARED_TOKEN
                  optional: true
            # Dark-by-default: status panel only until flipped to "true" (and the api-gateway route's
            # own flag is on). Re-applying this manifest reverts to dark.
            - name: BROKER_CREDENTIALS_WRITE_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /signin
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /signin
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: copytrade
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  # TLS terminated with the operator-provisioned `dashboard-tls` secret (homelab-CA wildcard for
  # *.192.168.10.123.nip.io — see infra/k8s/README.md). nip.io resolves the host to the LAN IP.
  tls:
    - hosts:
        - dashboard.192.168.10.123.nip.io
      secretName: dashboard-tls
  rules:
    - host: dashboard.192.168.10.123.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 3000
