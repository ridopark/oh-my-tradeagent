apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: copytrade
spec:
  selector:
    app: audit
  ports:
    - port: 8081
      targetPort: 8081
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: copytrade
  labels:
    app: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      containers:
        - name: audit
          image: ghcr.io/ridopark/oh-my-tradeagent-audit:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          env:
            # Phase 5b.E: consolidated onto the shared temporal/temporal-frontend
            # cluster under Temporal namespace `copytrade`. The in-`copytrade`
            # Temporal Deployment (30-temporal.yaml) and bootstrap Job
            # (31-temporal-bootstrap.yaml) are retained in-repo for now and torn
            # down by the operator after the consolidation smoke passes — see
            # docs/ops/temporal-consolidation-teardown.md.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
          # audit-svc has no spring-boot-starter-web today (skeleton from Phase 0b — the
          # audit_log writes actually happen via orchestrator's AuditActivitiesImpl).
          # No HTTP listener, so http-get probes would loop the pod. The JVM exits as
          # soon as main() returns because there's no worker keeping it alive — a real
          # follow-up will add a Temporal worker registration (or remove this Deployment
          # if audit stays purely an Activity on the orchestrator side).
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
