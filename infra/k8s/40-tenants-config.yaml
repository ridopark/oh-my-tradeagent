# Tenants config mounted into orchestrator-svc at /etc/copytrade/tenants/.
# Kept here verbatim so a kubectl apply is the single source of truth in
# the cluster. The dev tenant + copytrade-v1 strategy live in tenants/ at
# the repo root; we re-emit them as a ConfigMap rather than baking into the
# image (config changes only require a kubectl apply + pod restart).
#
# k8s ConfigMap keys forbid `/`, so we keep flat keys here and reconstruct
# the directory layout (`dev/tenant.yaml`, `dev/strategies/copytrade-v1.yaml`)
# via the `items:` projection in 51-orchestrator.yaml.
#
# CI guardrail (follow-up): a small script could diff this ConfigMap's
# contents against tenants/dev/* and fail PRs that drift.

apiVersion: v1
kind: ConfigMap
metadata:
  name: tenants-config
  namespace: copytrade
data:
  tenant.yaml: |
    tenant_id: dev
    display_name: Local development tenant
    strategies:
      - copytrade-v1
  copytrade-v1.yaml: |
    schema_version: 1
    tenant_id: dev
    strategy_id: copytrade-v1
    broker_target: alpaca-paper
    author_whitelist:
      - TradingTheTrend
      - Edtrader
      - TB22
      - beendoubleyou
      - ridopark # local-dev test author (harmless in homelab — does not post in its source channel)
    # Issue #3: per-side signal-age defaults replace the legacy unified
    # max_signal_age_secs (1800s) that produced adverse selection on options.
    max_signal_age_bto_secs: 30
    max_signal_age_stc_secs: 60
    bto_price_move_reject_pct: 0.10
    max_positions: 5
    capital_weight: 0.2
    min_contracts: 1
    max_contracts: 50
    # Issue #336 portfolio dollar-exposure cap (keep in sync): 25% of cost-basis capital base.
    notional_cap_pct_of_capital_base: 0.25
    skip_avg: true
    default_stc_fraction: 0.5
    partial_fractions:
      out: 1.0
      "all out": 1.0
      close: 1.0
      half: 0.5
      "half out": 0.5
      partial: 0.5
      third: 0.33
      "two thirds": 0.67
      trim: 0.25
    pending_ttl_paper_secs: 90
    pending_ttl_live_secs: 30
    # Issue #16: governs partial_exit when remaining_qty <= 1; skip = log + no-op.
    min_partial_qty_behavior: skip
    trail_on_partial: true
    trail_giveback_pct: 0.15
    daily_loss_threshold: 2500.00
    reset_cooldown_secs: 60
    # Issue #202: Copytrade mirrors a Discord author; the only normal exit is an STC
    # message from the author. Never EOD-flatten — would diverge from the author's
    # actual position and break mirror fidelity. The expiry-close timer (0DTE) still
    # closes positions that expire today; chandelier trail, risk-breach, and operator
    # force_close remain as emergency exits. Any strategy mirroring an external author
    # MUST set this to false. This is policy, not a tunable. (Dropped here once before,
    # which re-armed the blanket 15:55 ET flatten and closed a non-0DTE copytrade
    # position — keep in sync with tenants/dev/strategies/copytrade-v1.yaml.)
    eod_force_flatten: false
    # Issue #15: flatten 0DTE expiry-day positions at 2:45pm ET while market-maker quotes
    # still exist, so the (intentionally) MARKET flatten order fills. By 15:30 ET the
    # deep-OTM/illiquid contract often has no live quote and the market order is rejected.
    # Keep in sync with tenants/dev/strategies/copytrade-v1.yaml.
    force_close_0dte_et: "14:45"
    # Plan-2A R-AA-5: bounded scheduled-flatten floors (fail-SAFE → marketable; expiry
    # collapses to expiry_day_floor). Keep in sync with the canonical strategy file.
    exit_floor_abs: 0.05
    exit_floor_pct: 0.5
    expiry_day_floor: 0.01
    # Plan-2B R-AB-1: guaranteed bounded flatten timer for EVERY lot (multi-day included)
    # at (expiry_close - flatten_lead_minutes) ET; fires reason=expiry_lead through the 2A
    # bounded flatten. Keep in sync with tenants/dev/strategies/copytrade-v1.yaml.
    flatten_lead_minutes: 30
    # Plan-2B R-AB-2: bounded stepped repricing on the normal exit (3 steps of 0.05,
    # bounded by exit_floor; the flatten_lead timer is the backstop).
    exit_reprice_steps: 3
    exit_reprice_tick: 0.05
    # Plan-2B R-AB-3: entry fill-rate within the willing-to-pay cap (lesser of +$0.05 or
    # +5%). No market orders. Keep in sync with the canonical strategy file.
    max_slippage_abs: 0.05
    max_slippage_pct: 0.05
