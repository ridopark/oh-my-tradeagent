# Read-only ServiceAccount used by the CI k8s drift-check workflow
# (.github/workflows/k8s-drift.yml). The workflow runs `kubectl diff -f
# infra/k8s/` against the live homelab cluster from a self-hosted runner;
# binding the runner's kubeconfig to this SA (verbs: get, list, watch only)
# means the workflow physically cannot mutate cluster state even if the
# diff logic were buggy.
#
# Resource list mirrors the kinds declared by manifests 00-55:
#   namespaces, configmaps, secrets, deployments, services,
#   statefulsets, jobs, cronjobs.
# Add new groups here when manifests start touching new kinds; otherwise
# `kubectl diff` will succeed silently but skip the new objects.
#
# One-time setup (see docs/ops/k8s-drift-check.md):
#   kubectl apply -f infra/k8s/56-ci-readonly-sa.yaml
#   # then generate a long-lived kubeconfig bound to this SA's token
#   # and add it as repo secret KUBECONFIG_READONLY.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-drift-checker
  namespace: copytrade
  labels:
    app.kubernetes.io/part-of: oh-my-tradeagent
    app.kubernetes.io/component: ci-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-drift-checker-readonly
  labels:
    app.kubernetes.io/part-of: oh-my-tradeagent
    app.kubernetes.io/component: ci-readonly
rules:
  # Core API group: namespaces, configmaps, secrets, services.
  # secrets is included so `kubectl diff` against secrets manifests (if
  # any future PR re-adds them under infra/k8s/) does not skip them
  # silently; values stay redacted in the diff output by default.
  - apiGroups: [""]
    resources:
      - namespaces
      - configmaps
      - secrets
      - services
    verbs: [get, list, watch]
  # apps: deployments + statefulsets (used by 51-orchestrator, 10-postgres, etc.)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: [get, list, watch]
  # batch: jobs (31-temporal-bootstrap) + cronjobs (future).
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]
  # networking: Ingress (54-api-gateway).
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-drift-checker-readonly
  labels:
    app.kubernetes.io/part-of: oh-my-tradeagent
    app.kubernetes.io/component: ci-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-drift-checker-readonly
subjects:
  - kind: ServiceAccount
    name: ci-drift-checker
    namespace: copytrade
