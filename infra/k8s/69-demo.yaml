# Public demo (PLAN-2026-11-26-public-staging-preview.md): a login-free, read-only view of the
# PAPER tenant staging_paper, to be published at https://tradeagent-demo.ridopark.com.
#
# One pod, two containers, one shared in-memory volume:
#   web     unprivileged nginx serving the statically exported site and /data/*.json. It has NO
#           credentials and makes no outbound calls. This is the only thing the internet reaches.
#   poller  fetches the BFF's /api/preview/* projections with the preview token, runs its own
#           allow-list check on every response, and writes the files the web container serves.
#
# NOT APPLIED BY deploy.yml. Apply by hand, in this order, when the plan's phase 5 is done:
#   1. kubectl -n copytrade create secret generic demo-preview-token --from-literal=token=<token>
#      and add "<sha256 of token>:staging_paper" to BFF_PREVIEW_READ_TOKENS on the BFF.
#   2. kubectl apply -f infra/k8s/69-demo.yaml
#   3. The additive NetworkPolicy at the bottom of this file grants the pod network access to the
#      BFF. It is applied with the rest of the file; delete it to cut the data (runbook, "Off
#      switch").
#   4. Operator, in Cloudflare: add the published application tradeagent-demo.ridopark.com ->
#      http://demo:8080 on tunnel homelab-dashboard. No Access application for it.
#
# Until step 4 nothing is public: the pod runs and publishes, but no hostname routes to it.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: copytrade-demo
# Below the default (0) that every trading pod runs at: under memory pressure the demo is evicted
# first, and it can never preempt anything.
value: -100
preemptionPolicy: Never
globalDefault: false
description: "Public demo pod: evicted before any trading workload."
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: copytrade
  labels:
    app: demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: copytrade
  labels:
    app: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      priorityClassName: copytrade-demo
      # The pod never talks to the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The poller needs one name and the pod has no DNS egress (a compromised pod could otherwise
      # tunnel out through the cluster resolver), so the name is given here. The address is the
      # tenant-dashboard-bff Service's ClusterIP, fixed for the life of that Service. If the Service
      # is ever deleted and recreated, update this from
      #   kubectl -n copytrade get svc tenant-dashboard-bff -o jsonpath='{.spec.clusterIP}'
      # (the symptom is every feed "not published (fetch-TypeError)" and stale pages).
      hostAliases:
        - ip: "10.43.80.233"
          hostnames: ["tenant-dashboard-bff"]
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Both images are pinned by DIGEST (built from main at 6b163c48): this pod is
        # internet-facing, and `:latest` would re-pull whatever is newest on any restart or node
        # reboot. To update: merge, let "Build and push images" finish, read the digest of the image
        # tagged with that commit SHA (GHCR package page, or
        #   gh api /users/ridopark/packages/container/oh-my-tradeagent-demo-web/versions),
        # change both lines here, and apply this file.
        - name: web
          image: ghcr.io/ridopark/oh-my-tradeagent-demo-web@sha256:a4dd306fc2cc78af60a2688cdd7b4e53d14436988be635a708efc307f130961b
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 48Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: web-tmp
              mountPath: /tmp
        - name: poller
          image: ghcr.io/ridopark/oh-my-tradeagent-demo-poller@sha256:10bba5976cab32df3ef2de112d34f527b1efc26f69a371441370421b42f07fed
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: BFF_URL
              value: "http://tenant-dashboard-bff:8085"
            - name: OUT_DIR
              value: "/data"
            - name: PREVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-preview-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Snapshots live in memory: nothing published is ever written to the node's disk.
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: web-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
# Who may reach the demo: the Cloudflare tunnel connector, on the web port, and nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-allow-cloudflared
  namespace: copytrade
spec:
  podSelector:
    matchLabels:
      app: demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
---
# What the demo may reach: the BFF's port, and nothing else. Not DNS, not the internet, not
# Postgres, not Temporal, not the orchestrator, not the api-gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-egress-bff-only
  namespace: copytrade
spec:
  podSelector:
    matchLabels:
      app: demo
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tenant-dashboard-bff
      ports:
        - protocol: TCP
          port: 8085
    # No DNS: the one name the pod needs is in its hostAliases.
---
# The grant that lets the poller reach the BFF, on its preview-only port (BFF_PREVIEW_PORT, #1089).
# That port serves the five /api/preview/* routes to the preview token and nothing else, on its own
# two request threads. The pod is NOT admitted to 8083, where /actuator/** needs no token and the
# request threads are the ones operators' actions on live tenants run on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-dashboard-bff-allow-demo
  namespace: copytrade
spec:
  podSelector:
    matchLabels:
      app: tenant-dashboard-bff
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: demo
      ports:
        - protocol: TCP
          port: 8085
