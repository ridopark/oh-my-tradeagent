# Public demo (PLAN-2026-11-26-public-staging-preview.md): a login-free, read-only view of the
# PAPER tenant staging_paper, to be published at https://tradeagent-demo.ridopark.com.
#
# One pod, two containers, one shared in-memory volume:
#   web     unprivileged nginx serving the statically exported site and /data/*.json. It has NO
#           credentials and makes no outbound calls. This is the only thing the internet reaches.
#   poller  fetches the BFF's /api/preview/* projections with the preview token, runs its own
#           allow-list check on every response, and writes the files the web container serves.
#
# NOT APPLIED BY deploy.yml. Apply by hand, in this order, when the plan's phase 5 is done:
#   1. kubectl -n copytrade create secret generic demo-preview-token --from-literal=token=<token>
#      and add "<sha256 of token>:staging_paper" to BFF_PREVIEW_READ_TOKENS on the BFF.
#   2. kubectl apply -f infra/k8s/69-demo.yaml
#   3. Grant the pod network access to the BFF (the additive NetworkPolicy at the bottom of this
#      file is deliberately commented out until the BFF's unauthenticated /actuator/** on the same
#      port is closed off — see the plan's "must be settled before" list).
#   4. Operator, in Cloudflare: add the published application tradeagent-demo.ridopark.com ->
#      http://demo:8080 on tunnel homelab-dashboard. No Access application for it.
#
# Until step 3 the pod runs and serves the site, but the poller cannot reach the BFF, so every
# page says "waiting for data". That is the intended dark state.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: copytrade-demo
# Below the default (0) that every trading pod runs at: under memory pressure the demo is evicted
# first, and it can never preempt anything.
value: -100
preemptionPolicy: Never
globalDefault: false
description: "Public demo pod: evicted before any trading workload."
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: copytrade
  labels:
    app: demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: copytrade
  labels:
    app: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      priorityClassName: copytrade-demo
      # The pod never talks to the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/ridopark/oh-my-tradeagent-demo-web:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 48Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: web-tmp
              mountPath: /tmp
        - name: poller
          image: ghcr.io/ridopark/oh-my-tradeagent-demo-poller:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: BFF_URL
              value: "http://tenant-dashboard-bff:8083"
            - name: OUT_DIR
              value: "/data"
            - name: PREVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-preview-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Snapshots live in memory: nothing published is ever written to the node's disk.
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: web-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
# Who may reach the demo: the Cloudflare tunnel connector, on the web port, and nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-allow-cloudflared
  namespace: copytrade
spec:
  podSelector:
    matchLabels:
      app: demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
---
# What the demo may reach: the BFF's port and DNS. Not the internet, not Postgres, not Temporal,
# not the orchestrator, not the api-gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-egress-bff-only
  namespace: copytrade
spec:
  podSelector:
    matchLabels:
      app: demo
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tenant-dashboard-bff
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
# ---
# DELIBERATELY NOT ENABLED YET. This is the grant that lets the poller reach the BFF. The BFF serves
# /actuator/prometheus without a token on this same port, and its per-route request counters would
# let a compromised demo pod watch operator actions on live tenants. Enable only after that is
# closed off (a separate management port, or a token on /actuator/prometheus for non-monitoring
# peers).
