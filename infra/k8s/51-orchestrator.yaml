apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: copytrade
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: copytrade
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/ridopark/oh-my-tradeagent-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            # ReconciliationScheduleBootstrapper re-creates recon-t-dev-s-copytrade-v1-alpaca-paper
            # on first start against the new namespace (idempotent).
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            # Issue #56 item 9: orchestrator-svc owns a dedicated `orchestrator`
            # database (audit_log + option_symbol_cache live here). Temporal keeps
            # the `temporal` DB to itself via its auto-setup initContainer.
            - name: ORCHESTRATOR_DB_URL
              value: jdbc:postgresql://postgres:5432/orchestrator
            # Issue #84: runtime path connects as the constrained `orchestrator_runtime`
            # role so the V3 REVOKE UPDATE,DELETE,TRUNCATE on `audit_log` binds at the
            # engine layer. Flyway keeps the elevated `temporal` creds below for
            # DDL/GRANT migrations. See docs/ops/audit-retention.md §4.
            - name: ORCHESTRATOR_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: ORCHESTRATOR_RUNTIME_USER
            - name: ORCHESTRATOR_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: ORCHESTRATOR_RUNTIME_PASSWORD
            # Issue #84: Flyway needs DDL+GRANT privileges (CREATE ROLE, GRANT) which
            # `orchestrator_runtime` deliberately lacks. These two env vars feed
            # spring.flyway.user / spring.flyway.password and keep migrations running
            # as the superuser-class `temporal` role.
            - name: ORCHESTRATOR_FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: ORCHESTRATOR_FLYWAY_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: ORCHESTRATOR_TENANTS_DIR
              value: /etc/copytrade/tenants
            # Issue #88: TenantConfigChangedEmitter writes a per-(tenant, strategy) JSON
            # diff cache so the next boot can detect configmap edits. The configmap
            # projection above is read-only, so the snapshot lives on a separate
            # emptyDir volume mounted at a distinct writable path. Resets on pod
            # replacement (acceptable per the plan — the audit log is the source of
            # truth, not the snapshot).
            - name: ORCHESTRATOR_SNAPSHOT_DIR
              value: /var/lib/copytrade/snapshot
            - name: ORCHESTRATOR_CAPITAL_PER_STRATEGY
              value: "100000"
            # Issue #297: non-blocking Discord alert on BTO/STC order failures. The webhook URL is
            # an operator-provisioned secret. `optional: true` so the pod still boots when the secret
            # is absent — the alerter is then a no-op (logs the would-be alert) and the trading path
            # is entirely unaffected. Provisioning the `discord-alert-credentials` Secret with key
            # ALERT_DISCORD_WEBHOOK_URL is the operator follow-up.
            - name: ALERT_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-alert-credentials
                  key: ALERT_DISCORD_WEBHOOK_URL
                  optional: true
            # Issue #308: SignalFeedAlerter mirrors the FULL BTO/STC/AVG signal feed (received +
            # accepted/rejected/avg-skipped outcomes) to the SAME discord-alert-credentials webhook
            # via the same after-commit seam. Off by default so the high-volume mirror is opt-in and
            # toggles independently of the failure alerts. Set to "true" to enable. A blank/absent
            # webhook keeps it a no-op (logs would-be alerts) — the trading path is unaffected either
            # way (non-blocking, exception-swallowing dispatch).
            - name: ALERT_SIGNAL_FEED_ENABLED
              value: "false"
          volumeMounts:
            - name: tenants
              mountPath: /etc/copytrade/tenants
              readOnly: true
            - name: tenants-snapshot
              mountPath: /var/lib/copytrade/snapshot
          # orchestrator-svc is a pure Temporal worker (no spring-boot-starter-web in its
          # pom — see services/orchestrator/pom.xml comment). No HTTP listener on :8080,
          # so http-get probes would always fail with "connection refused" and trigger a
          # restart loop. The Temporal worker poll loop is the implicit liveness signal —
          # if the JVM is alive, the worker is polling. Adding spring-boot-starter-web so
          # /actuator/health works is the v0 follow-up (tracked separately); for now,
          # default-Ready-on-Running is correct.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1.5Gi
      volumes:
        - name: tenants
          configMap:
            name: tenants-config
            # k8s ConfigMap keys can't contain `/`, so we store flat keys in the
            # ConfigMap (see 40-tenants-config.yaml) and rebuild the nested
            # tenants/<id>/strategies/<id>.yaml layout the orchestrator walks.
            items:
              - key: tenant.yaml
                path: dev/tenant.yaml
              - key: copytrade-v1.yaml
                path: dev/strategies/copytrade-v1.yaml
        # Issue #88: emptyDir for TenantConfigChangedEmitter's snapshot file
        # (one JSON per (tenant, strategy)). Persists across in-pod restarts,
        # resets on pod replacement — re-arms one false-negative on first boot
        # post-replacement, acceptable since the audit log remains source of
        # truth for incident review.
        - name: tenants-snapshot
          emptyDir: {}
