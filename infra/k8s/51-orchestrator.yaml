apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: copytrade
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: copytrade
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/ridopark/oh-my-tradeagent-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # Phase 5b.E: consolidated onto the shared temporal/temporal-frontend
            # cluster under Temporal namespace `copytrade`. ReconciliationScheduleBootstrapper
            # is idempotent — on first start against the new namespace it re-creates the
            # `recon-t-dev-s-copytrade-v1-alpaca-paper` Schedule.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            - name: ORCHESTRATOR_DB_URL
              value: jdbc:postgresql://postgres:5432/temporal
            - name: ORCHESTRATOR_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: ORCHESTRATOR_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: ORCHESTRATOR_TENANTS_DIR
              value: /etc/copytrade/tenants
            - name: ORCHESTRATOR_CAPITAL_PER_STRATEGY
              value: "100000"
          volumeMounts:
            - name: tenants
              mountPath: /etc/copytrade/tenants
              readOnly: true
          # orchestrator-svc is a pure Temporal worker (no spring-boot-starter-web in its
          # pom — see services/orchestrator/pom.xml comment). No HTTP listener on :8080,
          # so http-get probes would always fail with "connection refused" and trigger a
          # restart loop. The Temporal worker poll loop is the implicit liveness signal —
          # if the JVM is alive, the worker is polling. Adding spring-boot-starter-web so
          # /actuator/health works is the v0 follow-up (tracked separately); for now,
          # default-Ready-on-Running is correct.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1.5Gi
      volumes:
        - name: tenants
          configMap:
            name: tenants-config
            # k8s ConfigMap keys can't contain `/`, so we store flat keys in the
            # ConfigMap (see 40-tenants-config.yaml) and rebuild the nested
            # tenants/<id>/strategies/<id>.yaml layout the orchestrator walks.
            items:
              - key: tenant.yaml
                path: dev/tenant.yaml
              - key: copytrade-v1.yaml
                path: dev/strategies/copytrade-v1.yaml
