apiVersion: v1
kind: Service
metadata:
  name: exec-alpaca-paper
  namespace: copytrade
spec:
  selector:
    app: exec-alpaca-paper
  ports:
    # Spring Boot actuator on the main HTTP port. Use for health / info /
    # prometheus scrape and ad-hoc `kubectl exec ... wget /actuator/...` triage.
    # No business-logic controllers on this port — exec-svc is a Temporal
    # worker, so requests to `/` get a Spring 404.
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-alpaca-paper
  namespace: copytrade
  labels:
    app: exec-alpaca-paper
spec:
  # MUST stay at 1. The fill-listener (AlpacaTradeUpdatesStream + FillPoller in
  # the exec-svc fill package) is not leader-elected; multi-pod deployments
  # would multiply broker calls and Temporal signals by N. See
  # docs/ops/fill-listener.md for the constraint + the multi-pod leader-election
  # follow-up.
  replicas: 1
  selector:
    matchLabels:
      app: exec-alpaca-paper
  template:
    metadata:
      labels:
        app: exec-alpaca-paper
    spec:
      containers:
        - name: exec-alpaca-paper
          # exec-svc image is provider-agnostic; the active adapter is selected
          # at boot via BROKER_IMPL. Phase 2c.2: TEMPORAL_TASK_QUEUE now defaults
          # to broker-alpaca-paper to match StrategyConfig.broker_target=alpaca-paper
          # routing on the orchestrator side. DB env vars are renamed
          # EXEC_TRADIER_PAPER_DB_* -> EXEC_DB_* (migration note: the operator must
          # apply both names during the rollout window; the application reads
          # EXEC_DB_* only from this PR onwards).
          image: ghcr.io/ridopark/oh-my-tradeagent-exec:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # Alpaca paper credentials: APCA_API_KEY_ID + APCA_API_SECRET_KEY.
            # The operator creates this Secret separately (kubectl apply
            # -f infra/secrets-template/secrets.template.yaml after filling values).
            - secretRef:
                name: alpaca-credentials
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            - name: TEMPORAL_TASK_QUEUE
              value: broker-alpaca-paper
            - name: EXEC_DB_URL
              value: jdbc:postgresql://postgres:5432/exec_alpaca_paper
            - name: EXEC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: EXEC_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: BROKER_IMPL
              value: alpaca-paper
            # Production fill detection: WS trade-updates + 30s polling fallback.
            # docs/ops/fill-listener.md for the cooperation model + single-pod constraint.
            # Both default OFF in application.yml; this manifest opts in.
            - name: EXEC_FILL_LISTENER_ENABLED
              value: "true"
            - name: EXEC_FILL_LISTENER_POLL_ENABLED
              value: "true"
            # Issue #297 / #295: non-blocking Discord alert on a broker rejection in placeOrder.
            # The webhook URL is an operator-provisioned secret. `optional: true` so the pod still
            # boots when the secret is absent — the alerter is then a no-op (logs the would-be
            # alert) and the broker/order path is entirely unaffected. Provisioning the
            # `discord-alert-credentials` Secret with key ALERT_DISCORD_WEBHOOK_URL is an operator
            # follow-up.
            - name: ALERT_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-alert-credentials
                  key: ALERT_DISCORD_WEBHOOK_URL
                  optional: true
            # Per-tenant alert routing: an optional `tenant=url;tenant=url` map (split on the first
            # `=` per entry). A tenant present here routes its broker-rejection alert to its own
            # webhook; any tenant absent here falls back to ALERT_DISCORD_WEBHOOK_URL above. Without
            # this, a live tenant's order-failure alert lands in another tenant's channel. The real
            # per-tenant URLs are operator secrets injected into the discord-alert-credentials Secret
            # at deploy time (out of band) — never committed. `optional: true` so the pod still boots
            # when the key is absent (the map is then empty and every tenant uses the global default).
            - name: ALERT_DISCORD_WEBHOOK_URLS
              valueFrom:
                secretKeyRef:
                  name: discord-alert-credentials
                  key: ALERT_DISCORD_WEBHOOK_URLS
                  optional: true
          # exec-svc is a Temporal worker but keeps the default servlet web stack so
          # actuator (health / info / prometheus) is reachable on 8080. No
          # business-logic controllers; the worker poll loop is still the implicit
          # liveness signal — no httpGet probes wired today.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            # P6-a envelope KEK for DB-sourced broker credentials. exec reads the
            # base64-encoded 32-byte KEK from broker.creds.db.kek-path (default
            # /etc/broker-kek/kek). DARK by default: the crypto bean that reads this
            # file only exists when broker.creds.source=db, so with the default source
            # this mount is inert and the pod is byte-identical. `optional: true` on the
            # volume keeps the pod booting while the Secret is absent.
            - name: broker-kek
              mountPath: /etc/broker-kek
              readOnly: true
      volumes:
        # Operator-provisioned, exec-only KEK. Create out-of-band (never committed):
        #   kubectl -n copytrade create secret generic broker-kek \
        #     --from-literal=kek="$(head -c 32 /dev/urandom | base64)"
        # The mounted file /etc/broker-kek/kek then holds that base64 string, which
        # loadKek() base64-decodes to the 32-byte key. See
        # docs/ops/broker-credential-opt-in.md.
        - name: broker-kek
          secret:
            secretName: broker-kek
            optional: true
            items:
              - key: kek
                path: kek
---
# UI-P2-c: restrict who may reach exec's HTTP port (8080). exec serves the dark P6-c
# `POST /internal/broker-credentials` endpoint (and the actuator) on the default Spring Boot port
# 8080 — exec sets no `server.port`, so it matches the Service `port: 8080` above. The api-gateway
# RestClient forwards tenant credentials to `http://exec:8080/internal/broker-credentials`, so this
# policy admits ingress ONLY from the api-gateway pod, blocking any other namespace pod from
# probing the credential endpoint (which fronts the broker /v2/account key-test path).
#
# Ingress-ONLY by design: exec's Temporal worker talks to Temporal as an EGRESS connection
# (exec→temporal-frontend:7233), which an Ingress policy does not restrict — so this does NOT
# break the worker poll loop, fill listener, or any outbound broker call.
#
# Enforced ONLY on a cluster running a NetworkPolicy-capable CNI. Stock k3s ships kube-router,
# which DOES enforce policies here (proven by the tenant-dashboard-bff policy in
# 58-tenant-dashboard-bff.yaml). kube-router also permits health-probe traffic from the hosting
# node, so the kubelet liveness/readiness checks on 8080 keep working without an explicit rule.
# Per the deploy model this file is applied as a whole (deploy.yml globs *-exec-alpaca-paper.yaml);
# on a cluster where it is not auto-applied it must be applied manually (`kubectl apply -f`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exec-alpaca-paper-allow-api-gateway-internal
  namespace: copytrade
spec:
  podSelector:
    matchLabels:
      app: exec-alpaca-paper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8080
