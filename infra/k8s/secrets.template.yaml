# Template — do NOT commit real values. Copy to secrets.local.yaml, fill in,
# `kubectl apply -f secrets.local.yaml`, then keep that file out of git
# (the repo's .gitignore covers *.local.yaml via existing rules; verify before
# editing). The Tradier and Discord blocks light up in 5b.D and onwards.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: copytrade
type: Opaque
stringData:
  POSTGRES_USER: temporal
  # Override for production. The v0 homelab single-node target ships with
  # this weak default to match infra/docker-compose.yml — change it before
  # any cluster that's reachable beyond the LAN.
  POSTGRES_PASSWORD: temporal
---
# Optional sidecar config — referenced with optional: true so the sidecar
# starts even without it. Populate when wiring real Discord + tenant config.
apiVersion: v1
kind: Secret
metadata:
  name: sidecar-config
  namespace: copytrade
type: Opaque
stringData:
  DISCORD_CHANNEL_URL: "https://discord.com/channels/<server-id>/<channel-id>"
  COPYTRADE_TENANT_ID: dev
  COPYTRADE_STRATEGY_ID: copytrade-v1
---
# Tradier sandbox creds — wire up in 5b.D when flipping BROKER_IMPL to
# `tradier`. Until then the exec-tradier-paper Deployment runs with the
# stub broker.
apiVersion: v1
kind: Secret
metadata:
  name: tradier-credentials
  namespace: copytrade
type: Opaque
stringData:
  TRADIER_API_TOKEN: "REPLACE_WITH_SANDBOX_TOKEN"
  TRADIER_ACCOUNT_ID: "REPLACE_WITH_ACCOUNT_ID"
