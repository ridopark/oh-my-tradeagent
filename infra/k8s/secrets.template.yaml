# Template — do NOT apply this file as-is. Copy to secrets.local.yaml, fill in
# real values, `kubectl apply -f secrets.local.yaml`, then keep secrets.local.yaml
# out of git. The placeholder values below will not start a working cluster on
# purpose — fail-loud is safer than fail-silent on weak defaults.
#
# Tradier and Discord blocks light up in 5b.D and onwards.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: copytrade
type: Opaque
stringData:
  POSTGRES_USER: REPLACE_WITH_POSTGRES_USER
  POSTGRES_PASSWORD: REPLACE_WITH_STRONG_POSTGRES_PASSWORD
---
# Required sidecar config — the sidecar Deployment will fail to start until
# this Secret exists with all three keys. Env-var names match exactly what
# services/signal-source-discord/ohmytradeagent_sidecar/main.py reads
# (TENANT_ID / STRATEGY_ID / DISCORD_CHANNEL_URL — not the copytrade_*
# variants that an earlier draft of the manifest used).
apiVersion: v1
kind: Secret
metadata:
  name: sidecar-config
  namespace: copytrade
type: Opaque
stringData:
  DISCORD_CHANNEL_URL: "https://discord.com/channels/<server-id>/<channel-id>"
  TENANT_ID: dev
  STRATEGY_ID: copytrade-v1
---
# Phase 2c.2: Alpaca paper credentials shared by exec-svc (broker) and
# market-data-svc (snapshot + WS stream). Required when BROKER_IMPL=alpaca-paper
# or MARKET_DATA_PROVIDER=alpaca; both pods will fail-fast at startup on a
# blank key.
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-credentials
  namespace: copytrade
type: Opaque
stringData:
  APCA_API_KEY_ID: REPLACE_ME
  APCA_API_SECRET_KEY: REPLACE_ME
  APCA_API_BASE_URL: https://paper-api.alpaca.markets
---
# Tradier sandbox creds — wire up in 5b.D when flipping BROKER_IMPL to
# `tradier`. Until then the exec-tradier-paper Deployment runs with the
# stub broker.
apiVersion: v1
kind: Secret
metadata:
  name: tradier-credentials
  namespace: copytrade
type: Opaque
stringData:
  TRADIER_API_TOKEN: "REPLACE_WITH_SANDBOX_TOKEN"
  TRADIER_ACCOUNT_ID: "REPLACE_WITH_ACCOUNT_ID"
