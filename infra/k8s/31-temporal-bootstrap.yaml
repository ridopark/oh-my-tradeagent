# Registers the custom Search Attributes (TenantStrategy, ContractSymbol) on
# the default namespace. Idempotent — re-running is a no-op once the SAs exist.
# Mirrors the `temporal-bootstrap` service from infra/docker-compose.yml.
#
# DEPRECATED (Phase 5b.E): SAs are now registered on the shared cluster's
# `copytrade` Temporal namespace via
# `scripts/ops/temporal-copytrade-namespace-bootstrap.sh`. This Job is retained
# in-repo until the operator runs the teardown runbook
# (docs/ops/temporal-consolidation-teardown.md). A follow-up PR will delete
# this file once the consolidation has bedded in.

apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-bootstrap
  namespace: copytrade
spec:
  # Clean up completed Job pods after 10 minutes so they don't accumulate
  # in the namespace across re-applies.
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: temporal-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          # admin-tools tags don't track Temporal server versions directly. The 1.29.x
          # line bundles a recent `temporal` CLI that talks to server 1.20+ via gRPC; we
          # pin to the major.minor for reproducibility. Bump deliberately when the
          # cluster moves.
          image: temporalio/admin-tools:1.29
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for Temporal frontend..."
              for i in $(seq 1 60); do
                if temporal operator cluster health >/dev/null 2>&1; then
                  echo "Temporal reachable."
                  break
                fi
                sleep 2
              done

              echo "Waiting for default namespace (auto-setup is async on cold start)..."
              for i in $(seq 1 60); do
                if temporal operator namespace describe default >/dev/null 2>&1; then
                  echo "default namespace ready."
                  break
                fi
                sleep 2
              done

              # Register the two custom Search Attributes referenced by the workflows.
              # Both are Keyword type; we swallow AlreadyExists to keep this idempotent.
              # Branch on exit code (not output text) so this stays robust across
              # admin-tools CLI version skews.
              register_sa() {
                local name="$1"
                local out
                if out=$(temporal operator search-attribute create --namespace default --name "$name" --type Keyword 2>&1); then
                  echo "  $name: registered"
                elif echo "$out" | grep -qi 'AlreadyExists'; then
                  echo "  $name: already registered"
                else
                  echo "$out"
                  exit 1
                fi
              }
              register_sa TenantStrategy
              register_sa ContractSymbol
              echo "bootstrap complete."
