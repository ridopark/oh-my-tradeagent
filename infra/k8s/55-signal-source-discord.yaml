# Discord sidecar. Needs a persistent volume for Playwright's `storage_state.json`
# (login cookies) and the heartbeat file the healthcheck reads. The volume is
# initially empty — the bootstrap container (services/signal-source-discord/
# Dockerfile entry) writes storage_state.json after a one-time interactive
# Discord login, which is the manual step on the runbook for 5b.D.
#
# Session-cutover: this PVC is also expected to hold a pre-staged secondary
# /app/state/storage_state.secondary.json for the 60s RTO hot-swap path
# documented in docs/ops/sidecar-session-cutover.md. The secondary is refreshed
# weekly by the operator; without it, recovery from a mid-day Discord session
# expiry falls back to the X-server/2FA re-bootstrap path in
# docs/ops/discord-session-expired.md (RTO measured in minutes-to-hours).
# Heartbeat-staleness alert spec lives at docs/ops/sidecar-pagerduty-alert.md;
# the actual Alertmanager wiring is deferred to Phase 6.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal-source-discord-state
  namespace: copytrade
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-source-discord
  namespace: copytrade
  labels:
    app: signal-source-discord
spec:
  # In-memory dedupe LRU is cost-only; durable dedupe is Temporal's job (see
  # PRD.md §14). Replica >= 1 is safe; v0 ships at 1 to keep storage_state.json
  # write coordination trivial.
  replicas: 1
  selector:
    matchLabels:
      app: signal-source-discord
  template:
    metadata:
      labels:
        app: signal-source-discord
    spec:
      containers:
        - name: sidecar
          image: ghcr.io/ridopark/oh-my-tradeagent-signal-source-discord:latest
          imagePullPolicy: Always
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            - name: STATE_DIR
              value: /app/state
            # Channel + tenant + strategy come from the `sidecar-config` Secret. Env-var
            # names match exactly what services/signal-source-discord/ohmytradeagent_sidecar/
            # main.py reads (TENANT_ID / STRATEGY_ID / DISCORD_CHANNEL_URL). Secret is
            # required (not optional) so the pod fails fast at boot if the operator
            # forgets the Secret, rather than running silently scopeless.
            - name: DISCORD_CHANNEL_URL
              valueFrom:
                secretKeyRef:
                  name: sidecar-config
                  key: DISCORD_CHANNEL_URL
            - name: TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: sidecar-config
                  key: TENANT_ID
            - name: STRATEGY_ID
              valueFrom:
                secretKeyRef:
                  name: sidecar-config
                  key: STRATEGY_ID
            # Watchlist mirror (Option B): read a SECOND channel and emit
            # WatchlistMirrorWorkflow once per ET day. Disabled by default; the
            # channel URL comes from the same `sidecar-config` Secret.
            - name: WATCHLIST_MIRROR_ENABLED
              value: "false"
            - name: WATCHLIST_POLL_INTERVAL_SECS
              value: "45"
            - name: WATCHLIST_AUTHOR
              value: "TradingTheTrend"
            - name: DISCORD_WATCHLIST_CHANNEL_URL
              valueFrom:
                secretKeyRef:
                  name: sidecar-config
                  key: DISCORD_WATCHLIST_CHANNEL_URL
                  # Absent key → "" so the pod still starts (the signal path is
                  # trading-critical). WATCHLIST_MIRROR_ENABLED gates _required(),
                  # so the feature never runs with an empty URL.
                  optional: true
          volumeMounts:
            - name: state
              mountPath: /app/state
          # Healthcheck comes from the Dockerfile's HEALTHCHECK directive;
          # k8s ignores that and uses these probes. Heartbeat-file freshness
          # mirrors the same contract: file present + mtime within 120s.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /app/state/heartbeat && test $(( $(date +%s) - $(stat -c %Y /app/state/heartbeat) )) -lt 120
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: signal-source-discord-state
