apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: copytrade
spec:
  selector:
    app: market-data
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: copytrade
  labels:
    app: market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      containers:
        - name: market-data
          image: ghcr.io/ridopark/oh-my-tradeagent-market-data:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TEMPORAL_TARGET
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: default
          # market-data-svc is a Temporal worker only (no spring-boot-starter-web).
          # No HTTP listener — http-get probes would loop the pod. Worker poll loop is
          # the implicit liveness signal.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
