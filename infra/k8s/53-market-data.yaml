apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: copytrade
  # app label lets the ServiceMonitor (infra/k8s/64-copytrade-servicemonitor.yaml)
  # select this Service for actuator/prometheus scraping. See #721.
  labels:
    app: market-data
spec:
  selector:
    app: market-data
  ports:
    # Spring Boot actuator on the main HTTP port. Use for health / info /
    # prometheus scrape and ad-hoc `kubectl exec ... wget /actuator/...` triage.
    # No business-logic controllers on this port — market-data is a Temporal
    # worker, so requests to `/` get a Spring 404.
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: copytrade
  labels:
    app: market-data
spec:
  replicas: 1
  # Recreate, NOT the default RollingUpdate. At replicas:1 the default maxSurge:25% rounds UP to 1,
  # so the new pod starts BEFORE the old terminates and two pods briefly hold connections to the
  # same Alpaca data endpoint. Alpaca's limit is ONE connection per endpoint and does not rise with
  # the paid plan, so the second connection is a guaranteed 406 — on the stocks WebSocket that is
  # LIVE TODAY and that watchlist-trigger entries depend on. Confirmed on the live cluster: the
  # deployment carried {"rollingUpdate":{"maxSurge":"25%","maxUnavailable":"25%"}}.
  #
  # Recreate trades feed downtime during a roll for never having two connections. That is the right
  # trade at replicas:1 — the surge bought no availability anyway, since one replica means the old
  # pod is going away regardless, and the 406 leaves the NEW pod believing it is subscribed.
  #
  # ⚠ ROLLING THIS POD IS NOT FREE, AND Recreate IS NOT WHY. The premium subscription registry is
  # in-process (`AlpacaMarketData.bySymbol` / `premiumPolls`, :75 / :82) and `subscribePremium` is
  # called ONCE at arm time from three sites in PositionWorkflowImpl (:2077, :2207, :2459). Nothing
  # re-subscribes on boot. So after ANY market-data restart — under either strategy — every ARMED
  # trailing stop on every open position stops receiving ticks permanently, while the workflow
  # still reports `trailingArmed=true` and a stop price. The one-shot staleness timer (:2422) only
  # asks "did the feed ever start?", is watchlist-only, and its window closes 90s after arm.
  #
  # Until a re-subscribe sweep or a rolling staleness backstop ships, roll market-data ONLY
  # pre-open or with no armed trails on the book. Downtime is also longer than it looks: there is
  # no readiness probe, so `kubectl rollout status` reports success as soon as the process starts,
  # before the Temporal worker or the WS is up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      containers:
        - name: market-data
          image: ghcr.io/ridopark/oh-my-tradeagent-market-data:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # market-data uses the DATA-entitled Alpaca credential (NOT the paper trading
            # secret): the paper key is not entitled to stream stocks and returns 402. This
            # secret provides APCA_API_KEY_ID_DATA + APCA_API_SECRET_KEY_DATA. The operator
            # creates it once (kubectl apply -f infra/secrets-template/secrets.template.yaml
            # after filling values).
            - secretRef:
                name: alpaca-credentials-data
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            # Phase 2c.2: select the Alpaca market-data adapter (REST snapshot + WS premium
            # stream). Flip to 'inmemory' to disable the live feed for triage.
            - name: MARKET_DATA_PROVIDER
              value: alpaca
            # DECLARED 2026-08-17 to close a drift, not to change behaviour — this was set
            # IMPERATIVELY on the running pod and was absent from this manifest AND from
            # last-applied-configuration, surviving `kubectl apply` only by strategic-merge
            # accident (a field in neither the new config nor last-applied is preserved).
            #
            # It is load-bearing: application.yml intentionally leaves `stock-feed` BLANK so that
            # subscribeEquity FAILS CLOSED (StockFeedGatedException, loud audit, no connect) rather
            # than letting a delayed or wrong feed silently drive a price-level trigger. With this
            # var absent, effectiveStockDataWsUrl() returns empty and every watchlist-trigger entry
            # stops. A delete/recreate, a namespace rebuild, or a switch to server-side apply would
            # have done exactly that, and nothing in the repo hinted the live feed depended on it.
            #
            # Same class as the exec drift in #696.
            - name: ALPACA_STOCK_FEED
              value: sip
            # #776 P2: Discord alert route for the premium-subscription boot recovery
            # (PremiumSubscriptionRecovery): fires on attempts-exhausted, sweep truncation, and
            # loop crash. Same operator-provisioned discord-alert-credentials Secret as
            # exec/orchestrator; `optional: true` so the pod still boots when the secret is
            # absent — the alerter is then log-only and recovery itself is unaffected.
            - name: ALERT_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-alert-credentials
                  key: ALERT_DISCORD_WEBHOOK_URL
                  optional: true
          # market-data-svc is a Temporal worker but keeps the default servlet web
          # stack so actuator (health / info / prometheus) is reachable on 8080. No
          # business-logic controllers; the worker poll loop is still the implicit
          # liveness signal — no httpGet probes wired today.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
