apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: copytrade
spec:
  selector:
    app: market-data
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: copytrade
  labels:
    app: market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      containers:
        - name: market-data
          image: ghcr.io/ridopark/oh-my-tradeagent-market-data:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # Alpaca paper credentials shared with exec-svc: APCA_API_KEY_ID + APCA_API_SECRET_KEY.
            # The operator creates this Secret once (kubectl apply -f
            # infra/secrets-template/secrets.template.yaml after filling values).
            - secretRef:
                name: alpaca-credentials
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            # Phase 2c.2: select the Alpaca market-data adapter (REST snapshot + WS premium
            # stream). Flip to 'inmemory' to disable the live feed for triage.
            - name: MARKET_DATA_PROVIDER
              value: alpaca
          # market-data-svc is a Temporal worker only (web-application-type=none).
          # No HTTP listener — http-get probes would loop the pod. Worker poll loop is
          # the implicit liveness signal.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
