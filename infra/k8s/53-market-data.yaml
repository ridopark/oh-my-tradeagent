apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: copytrade
spec:
  selector:
    app: market-data
  ports:
    # Spring Boot actuator on the main HTTP port. Use for health / info /
    # prometheus scrape and ad-hoc `kubectl exec ... wget /actuator/...` triage.
    # No business-logic controllers on this port — market-data is a Temporal
    # worker, so requests to `/` get a Spring 404.
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: copytrade
  labels:
    app: market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      containers:
        - name: market-data
          image: ghcr.io/ridopark/oh-my-tradeagent-market-data:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # market-data uses the DATA-entitled Alpaca credential (NOT the paper trading
            # secret): the paper key is not entitled to stream stocks and returns 402. This
            # secret provides APCA_API_KEY_ID_DATA + APCA_API_SECRET_KEY_DATA. The operator
            # creates it once (kubectl apply -f infra/secrets-template/secrets.template.yaml
            # after filling values).
            - secretRef:
                name: alpaca-credentials-data
          env:
            # Phase 5b.E: shared Temporal at temporal/temporal-frontend, Temporal-level ns `copytrade`.
            - name: TEMPORAL_TARGET
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: copytrade
            # Phase 2c.2: select the Alpaca market-data adapter (REST snapshot + WS premium
            # stream). Flip to 'inmemory' to disable the live feed for triage.
            - name: MARKET_DATA_PROVIDER
              value: alpaca
          # market-data-svc is a Temporal worker but keeps the default servlet web
          # stack so actuator (health / info / prometheus) is reachable on 8080. No
          # business-logic controllers; the worker poll loop is still the implicit
          # liveness signal — no httpGet probes wired today.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
