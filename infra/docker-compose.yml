# oh-my-tradeagent Phase 0 stack.
# Bring up:   docker compose -f infra/docker-compose.yml up -d
# Tear down:  docker compose -f infra/docker-compose.yml down -v
#
# Ports:
#   Temporal frontend           7233 (gRPC)
#   Temporal Web UI             8080 (http://localhost:8080)
#   Postgres (Temporal)         5432
#   Redis                       6379
#   Prometheus                  9091 (http://localhost:9091) — host port 9090 was taken
#   OTel Collector OTLP/gRPC    4317
#   OTel Collector OTLP/HTTP    4318

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      VISIBILITY_DB: temporal_visibility
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 72h
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/development.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || temporal operator cluster health --address temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.32.0
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  # Bootstrap container: registers custom Search Attributes once the cluster is up.
  # Idempotent — re-running is safe (operator returns "AlreadyExists" which we swallow).
  temporal-bootstrap:
    image: temporalio/admin-tools:1.25
    depends_on:
      temporal:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export TEMPORAL_ADDRESS=temporal:7233
        echo "Waiting for Temporal frontend..."
        for i in $$(seq 1 30); do
          if temporal operator cluster health >/dev/null 2>&1; then
            echo "Temporal reachable."
            break
          fi
          sleep 2
        done

        echo "Waiting for default namespace (auto-setup is async on cold start)..."
        for i in $$(seq 1 30); do
          if temporal operator namespace describe default >/dev/null 2>&1; then
            echo "default namespace ready."
            break
          fi
          sleep 2
        done

        register_sa() {
          name=$$1; type=$$2
          # auto-setup's visibility-manager init is async relative to the
          # default namespace becoming describable; a sub-second window
          # exists where this call returns "Namespace default is not found"
          # transiently. Retry on that specific error for up to ~60s.
          for attempt in $$(seq 1 30); do
            output=$$(temporal operator search-attribute create --name "$$name" --type "$$type" 2>&1) && rc=0 || rc=$$?
            if echo "$$output" | grep -qiE "already exists|AlreadyExists"; then
              echo "  $$name already registered."
              return 0
            elif [ "$$rc" -eq 0 ]; then
              echo "  $$name registered ($$type)."
              return 0
            elif echo "$$output" | grep -qiE "Namespace .* is not found|namespace not found"; then
              [ "$$attempt" -eq 1 ] && echo "  $$name: visibility manager not ready yet, retrying..."
              sleep 2
              continue
            else
              echo "  $$name FAILED to register (rc=$$rc): $$output" >&2
              return 1
            fi
          done
          echo "  $$name FAILED: visibility manager never became ready after 60s" >&2
          return 1
        }

        echo "Registering custom Search Attributes..."
        register_sa TenantStrategy Keyword
        register_sa ContractSymbol Keyword

        echo "Final search-attribute list:"
        temporal operator search-attribute list
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # Discord watcher. State (cookies + heartbeat) lives on a named volume so
  # restart preserves session. Replica >= 1 is safe (durable dedupe via Temporal).
  # To run two replicas: `docker compose -f infra/docker-compose.yml up -d --scale signal-source-discord=2`.
  signal-source-discord:
    build:
      context: ..
      dockerfile: services/signal-source-discord/Dockerfile
    depends_on:
      temporal:
        condition: service_started
      temporal-bootstrap:
        condition: service_completed_successfully
    environment:
      DISCORD_CHANNEL_URL: ${DISCORD_CHANNEL_URL:-}
      TENANT_ID: ${TENANT_ID:-dev}
      STRATEGY_ID: ${STRATEGY_ID:-copytrade-v1}
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: orchestrator-core
      POLL_INTERVAL_SECS: "1.0"
      LOG_LEVEL: info
    volumes:
      - sidecar-state:/app/state
    restart: unless-stopped
    profiles: ["sidecar"]

  # Bootstrap (login) sidecar: same image, run interactively with display
  # forwarding to capture Discord cookies into sidecar-state once.
  # `docker compose -f infra/docker-compose.yml --profile bootstrap run --rm sidecar-bootstrap`
  sidecar-bootstrap:
    build:
      context: ..
      dockerfile: services/signal-source-discord/Dockerfile
    entrypoint: ["python", "-m", "ohmytradeagent_sidecar.bootstrap"]
    environment:
      DISCORD_CHANNEL_URL: ${DISCORD_CHANNEL_URL:-}
      DISPLAY: ${DISPLAY:-}
    volumes:
      - sidecar-state:/app/state
      - /tmp/.X11-unix:/tmp/.X11-unix
    profiles: ["bootstrap"]

volumes:
  postgres-data:
  sidecar-state:
