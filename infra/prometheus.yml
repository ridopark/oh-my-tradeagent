global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: temporal
    static_configs:
      - targets:
          - temporal:8000

  # Additional services will be added here as they expose /actuator/prometheus
  # on a stable port reachable from this compose network.
