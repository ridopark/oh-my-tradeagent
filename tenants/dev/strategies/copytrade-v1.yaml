schema_version: 1
tenant_id: dev
strategy_id: copytrade-v1
broker_target: alpaca-paper  # DEFAULT; real money (alpaca-live) is a per-cluster operator override applied out-of-band, never the repo default. See 40-tenants-config.yaml.

# Phase 2a risk gates
author_whitelist:
  - TradingTheTrend
  - Edtrader
  - TB22
  - beendoubleyou
  - ridopark # local-dev test author (harmless in homelab — ridopark does not post in its source channel)
# Issue #3: per-side signal-age defaults. The legacy unified `max_signal_age_secs`
# (1800s) produced systematic adverse selection on options. BTO tolerates ~30s
# before premium has moved enough to invalidate the entry; STC tolerates ~60s
# because late exits are safer than late entries. Any value above 120s here is
# an explicit per-strategy override and should be reviewed.
max_signal_age_bto_secs: 30
max_signal_age_stc_secs: 60
# Issue #3: BTO secondary price-move gate (documented; market-data wiring lands
# separately). Rejects BTO when bid/ask (mid) has moved more than this fraction
# from payload.price since posted_at, regardless of age.
max_positions: 5

# Phase 2a sizing
capital_weight: 0.2
# dynamic-account-cash-sizing: selects the capital base for capital-weight sizing
# (allocation = capital_base * capital_weight, clamped to min/max_contracts).
#   static       — global ORCHESTRATOR_CAPITAL_PER_STRATEGY ($100k on homelab) for every
#                  tenant (DEFAULT; null/absent treated as static). Over-sizes a small
#                  real-money account (a $5k account sized as if it held $100k).
#   account_cash — sizes from the broker account's live CASH (the same AccountSnapshotActivity
#                  cash the notional-cap gate reads). fail-CLOSED: null/zero cash REJECTS the BTO
#                  (capital_unavailable), never falls back to the static $100k. Also forces the
#                  account-snapshot dispatch even with no notional cap.
# dev is paper and stays on static. prod_real/copytrade-v1 (live-cluster-only, NOT in this repo)
# must be set to account_cash out-of-band in its strategy_config DB row + tenants mount.
capital_source: static
min_contracts: 1
max_contracts: 50

# Issue #336 portfolio dollar-exposure gate (canonical field). Rejects a BTO when
# (sum_open_notional + new_notional) > notional_cap_pct_of_capital_base * (cash +
# sum_open_notional). Bounds TOTAL premium-at-risk across positions — complements the
# count caps (max_positions / max_contracts), which don't limit dollars. 0.25 = at most
# 25% of the cost-basis capital base deployed at once. null disables.
notional_cap_pct_of_capital_base: 0.25

# Phase 2a default per Open Question #10
skip_avg: true

# Phase 3 exit logic
default_stc_fraction: 0.5
partial_fractions:
  out: 1.0
  "all out": 1.0
  close: 1.0
  half: 0.5
  "half out": 0.5
  partial: 0.5
  third: 0.33
  "two thirds": 0.67
  trim: 0.25
  # Issue F3: full-close synonyms → 1.0. An unqualified full-close STC ("STC ...
  # cutting") matched no key and fell to default_stc_fraction (0.5), closing only
  # half. Only unambiguous full-close phrases that don't substring-collide are added
  # (no bare "cut"/"sold"/"exit"/"gone"/"flat" — they collide with "haircut",
  # "without", "exit was clean", etc.). default_stc_fraction stays 0.5 (operator
  # declined the default→1.0 policy change).
  cutting: 1.0
  closing: 1.0
  closed: 1.0
  "all the way out": 1.0
  "stopped out": 1.0
  dumped: 1.0
  dumping: 1.0
pending_ttl_paper_secs: 90
pending_ttl_live_secs: 30
# Issue #16: governs partial_exit when remaining_qty <= 1 (integer broker
# quantum can no longer represent a partial honestly).
#   skip       — log + no-op the partial; runner rides to trail/EOD (default)
#   full_close — close the last contract on the partial signal
min_partial_qty_behavior: skip

# Phase 4 trailing exit
trail_on_partial: true
trail_giveback_pct: 0.15

# Phase 5 kill switch
daily_loss_threshold: 2500.00
reset_cooldown_secs: 60

# Issue #202: Copytrade mirrors a Discord author; the only normal exit is an STC
# message from the author. Never EOD-flatten — would diverge from the author's
# actual position and break mirror fidelity. Expiry-close timer (0DTE),
# chandelier trail, risk-breach, and operator force_close remain as emergency
# exits. Any future strategy that mirrors an external author MUST also set this
# to false. This is policy, not a tunable.
eod_force_flatten: false
# Issue #15: flatten 0DTE expiry-day positions at 2:45pm ET while market-maker quotes
# still exist, so the (intentionally) MARKET flatten order fills. By 15:30 ET the
# deep-OTM/illiquid contract often has no live quote and the market order is rejected.
force_close_0dte_et: "14:45"

# Plan-2A R-AA-5: bounded scheduled-flatten floors. Scheduled exits (eod/expiry/
# chandelier) place a bounded marketable LIMIT anchored on the live bid instead of a
# market dump. The floor is fail-SAFE: a null/unresolvable floor — or one above the
# live bid — collapses to a marketable exit (never "no sell"). Conservative values: a
# small absolute floor and a 50% fractional floor; whichever is more conservative
# (max) applies. On the EXPIRY session the floor collapses to expiry_day_floor (near
# zero) so a decaying long is sold for something rather than ridden to $0; a contract
# with no live bid still goes fully marketable. Not consumed by workflow logic yet
# (R-AA-3, next chunk) — defaults hold from code if this ConfigMap is stale.
exit_floor_abs: 0.05
exit_floor_pct: 0.5
expiry_day_floor: 0.01

# Plan-2B R-AB-1: arm a GUARANTEED bounded flatten timer for EVERY lot (multi-day
# included) at (expiry_close - flatten_lead_minutes) ET so a position with no STC is
# sold via a bounded marketable LIMIT before expiry rather than ridden to $0 (the
# QQQ-725 ride-to-expiry class). Independent of eod_force_flatten. Fires with
# reason=expiry_lead through the 2A bounded reason-scoped flatten path. Conservative
# 30 minutes.
flatten_lead_minutes: 30
# Plan-2B R-AB-2: bounded stepped repricing on the normal exit. Walk the exit limit
# toward the market over exit_reprice_steps re-places (each re-anchored on a fresh
# live bid/mid, bounded by exit_floor), then stop — the flatten_lead timer above is
# the backstop. Conservative: 3 steps of 0.05 each.
exit_reprice_steps: 3
exit_reprice_tick: 0.05

# Plan-2B R-AB-3: entry fill-rate within the willing-to-pay cap. With both unset the
# BTO limit is an exact mirror of the author-posted price, which systematically
# non-fills on fast options. Conservative caps: pay up to the lesser of +$0.05
# absolute or +5% so the entry crosses the spread without chasing. No market orders;
# the cap is the bound (buy-side cap is authoritative).
max_slippage_abs: 0.05
max_slippage_pct: 0.05
