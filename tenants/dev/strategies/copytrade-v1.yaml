schema_version: 1
tenant_id: dev
strategy_id: copytrade-v1
broker_target: alpaca-paper  # Phase 2c.2: routes to broker-alpaca-paper task queue

# Phase 2a risk gates
author_whitelist:
  - acme_trader
  - beta_signals
max_signal_age_secs: 1800
max_positions: 5

# Phase 2a sizing
capital_weight: 0.2
min_contracts: 1
max_contracts: 5

# Phase 2a default per Open Question #10
skip_avg: true

# Phase 3 exit logic
default_stc_fraction: 0.5
partial_fractions:
  out: 1.0
  "all out": 1.0
  close: 1.0
  half: 0.5
  "half out": 0.5
  partial: 0.5
  third: 0.33
  "two thirds": 0.67
  trim: 0.25
pending_ttl_paper_secs: 90
pending_ttl_live_secs: 30

# Phase 4 trailing exit
trail_on_partial: true
trail_giveback_pct: 0.15

# Phase 5 kill switch
daily_loss_threshold: 2500.00
reset_cooldown_secs: 60
