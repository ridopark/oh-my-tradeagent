schema_version: 1
tenant_id: dev
strategy_id: watchlist-trigger-v1
# DEFAULT is alpaca-paper. Real money (alpaca-live) is a deliberate per-cluster operator override
# applied out-of-band, never the repo default — a fresh apply / local / CI never trades live.
broker_target: alpaca-paper

# REQUIRED for account-cash sizing. The trigger path sizes entries from the broker account's live
# CASH (the same AccountSnapshotActivity cash the notional-cap gate reads); the session parent only
# dispatches the account snapshot when capital_source=account_cash, so this MUST be set for sizing
# to work. fail-CLOSED: null/zero cash REJECTS the entry, never falls back to the static $100k.
capital_source: account_cash

# Sizing (conservative). allocation = account_cash * capital_weight, clamped to min/max_contracts.
capital_weight: 0.05
min_contracts: 1
max_contracts: 5
# Issue #336 portfolio dollar-exposure cap: at most 10% of the cost-basis capital base deployed.
notional_cap_pct_of_capital_base: 0.10
max_positions: 3

# Watchlist-trigger behaviour.
#   entry_mode BREAKOUT       — enter when the underlying first trades through `trigger` in `direction`.
#   watchlist_expiry_rule     — pick the nearest weekly expiry on/after et_date.
#   gap_tolerance_pct 0.005   — a trigger that gaps through its level by >0.5% at open is treated as gapped.
#   equity_emit_delta_pct     — min 0.05% underlying move before a new equity tick is emitted (tick throttle).
entry_mode: BREAKOUT
watchlist_expiry_rule: NEAREST_WEEKLY
gap_tolerance_pct: 0.005
equity_emit_delta_pct: 0.0005

# Exit policy (watchlist-trigger 2:1 reward:risk + trailing stop). All opt-in: omitting
# sl_pct/tp_ratio disables the premium exit entirely (copytrade-only behaviour). Evaluated on the
# live bid (the price a long must sell into), getVersion-gated so copytrade positions are unaffected.
#   sl_pct 0.30                     — hard stop at -30% of entry premium (= -1R); routes MARKET.
#   tp_ratio 2.0                    — first take-profit at +2R = +60% premium.
#   tp_partial_fraction 0.5         — book half at the target; remainder moves to breakeven + trails.
#   trail_giveback_pct 0.30         — chandelier giveback on the runner (off the premium peak).
#   no_progress_time_stop_secs 1500 — flatten a stalled breakout after 25m (theta defense).
#   force_close_eod_et 15:30        — hard EOD flatten 30m before the 16:00 ET close (flat by EOD).
#   eod_force_flatten true          — arm the blanket EOD timer (watchlist is not an author-mirror).
#   no_entry_within_close_minutes 30 — refuse a new entry within 30m of force_close_eod_et (root-cause
#                                     guard for the 2026-06-24 orphan: a leg fired at 15:33, 3m after
#                                     its own 15:30 flatten, and could not close before the 16:00 bell).
sl_pct: 0.30
tp_ratio: 2.0
tp_partial_fraction: 0.5
trail_giveback_pct: 0.30
no_progress_time_stop_secs: 1500
force_close_eod_et: "15:30"
no_entry_within_close_minutes: 30
eod_force_flatten: true
# Bounded-flatten floors (Plan-2A): fail-SAFE → marketable; the expiry session collapses the floor
# to expiry_day_floor. Without these three the bounded-flatten path can't resolve a floor and emits
# FlattenFloorConfigError (losing floor protection). Mirrors copytrade-v1; keep in sync with the
# embedded copy in infra/k8s/40-tenants-config.yaml.
exit_floor_abs: 0.05
exit_floor_pct: 0.5
expiry_day_floor: 0.01

# SHIP DISABLED. The operator flips this on (dashboard per-tenant toggle) ONLY AFTER confirming the
# real-time stock feed is entitled/configured. With enabled:false the strategy loads but admits no
# entries (WatchlistMirrorActivitiesImpl skips the session start). enabled:false + an unconfigured
# stock feed are the two independent live-trade gates.
#
# PRE-FLIGHT before enabling: (1) the stock feed needs a real-time-entitled DATA key -- a paper key
# returns 402 on the stocks WS (verified). market-data reads APCA_API_KEY_ID_DATA (the data-entitled
# key). (2) Alpaca connection limit: VERIFIED 2026-06-20 via scripts/alpaca-ws-conn-check.py that the
# limit is ONE connection PER ENDPOINT (not account-wide) -- the stocks (/v2) and options (/v1beta1)
# streams coexist on one key, so this strategy's stocks WS does NOT collide with copytrade's options
# WS. The only rule: keep market-data a single replica (a 2nd replica's duplicate connections get 406).
enabled: false

# Copytrade-only schema-required fields, set to safe inert values. The trigger path does NOT consult
# author_whitelist or the signal-age gates (those gate the Discord-author copytrade path); they are
# present only to satisfy the shared strategy-config schema's `required` list (author_whitelist has
# minItems:1, so it cannot be empty — a single inert non-posting author is used).
author_whitelist:
  - watchlist-trigger-unused
max_signal_age_bto_secs: 30
max_signal_age_stc_secs: 60
