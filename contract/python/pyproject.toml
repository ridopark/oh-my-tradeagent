[project]
name = "ohmytradeagent-contract"
version = "0.1.0"
description = "Generated pydantic models from contract/schemas/*.json"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    # `ohmytradeagent_contract.search_attributes` constructs
    # `temporalio.common.SearchAttributeKey` instances at import time so the
    # sidecar + harness can share a single source of truth for the custom SA
    # names. Pinned to the same 1.9.x line the sidecar uses.
    "temporalio>=1.9,<2",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.27.1",
    "pytest>=8.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmytradeagent_contract"]

[tool.ruff]
line-length = 100
target-version = "py312"
