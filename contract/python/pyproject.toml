[project]
name = "ohmytradeagent-contract"
version = "0.1.0"
description = "Generated pydantic models from contract/schemas/*.json"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.27.1",
    "pytest>=8.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmytradeagent_contract"]

[tool.ruff]
line-length = 100
target-version = "py312"
