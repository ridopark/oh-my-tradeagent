name: Claude review

# Runs Claude as an advisory code reviewer on every PR. Posts a sticky
# review comment; the job is treated as advisory — plain CI in
# `.github/workflows/ci.yml` is the merge gate.
#
# Auth: uses CLAUDE_CODE_OAUTH_TOKEN (tied to a Claude Max subscription).
# Generate with `claude setup-token` on a workstation logged into the Max
# account, then add as a repo secret.
#
# Fork-PR safety: GitHub does not expose repo secrets to runs from forks.
# The job gates on head.repo == base.repo so external contributors see a
# clean skip instead of a hard failure at the action step.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/README*"
      - ".gitignore"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # required by anthropics/claude-code-action@v1 OIDC flow

concurrency:
  group: claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STICKY_MARKER: "<!-- claude-code-review -->"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Code review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Steps:
            1. Read `.claude/agents/code-reviewer.md` for the project review rubric.
            2. `gh pr view ${{ github.event.pull_request.number }} --json title,body,headRefName,baseRefName`
            3. `gh pr diff ${{ github.event.pull_request.number }}`
            4. Produce a structured review:
               - Overview (1-2 sentences)
               - Findings (severity-tagged: blocker | major | minor | nit). Section by:
                 * Correctness
                 * Project conventions (Java 21 / Spring Boot 3 / Maven / jOOQ / Temporal Java SDK; Python 3.12 / pydantic v2 / Temporal Python SDK; JSON Schema as source of truth for cross-language DTOs)
                 * Security
                 * Test coverage
               - Verdict: READY | NEEDS FIXES | BLOCKED
            5. Write the review to /tmp/review.md (start with the literal first line `${STICKY_MARKER}` so re-runs update in place).
            6. Post via the project helper:
               scripts/gh-sticky-comment.sh "${{ github.repository }}" "${{ github.event.pull_request.number }}" "${STICKY_MARKER}" /tmp/review.md
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowed-tools 'Bash Read Grep'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STICKY_MARKER: ${{ env.STICKY_MARKER }}
