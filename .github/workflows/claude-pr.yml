name: Claude review

# Runs Claude as an advisory code reviewer on every PR. Posts a sticky
# review comment; the job is treated as advisory — plain CI in
# `.github/workflows/ci.yml` is the merge gate.
#
# Auth: uses CLAUDE_CODE_OAUTH_TOKEN (tied to a Claude Max subscription).
# Generate with `claude setup-token` on a workstation logged into the Max
# account, then add as a repo secret.
#
# Fork-PR safety: GitHub does not expose repo secrets to runs from forks.
# The job gates on head.repo == base.repo so external contributors see a
# clean skip instead of a hard failure at the action step.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/README*"
      - ".gitignore"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # required by anthropics/claude-code-action@v1 OIDC flow

concurrency:
  group: claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Code review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Steps:
            1. Read `CLAUDE.md` at the repo root for the project's coding rubric (SOLID/DRY/KISS,
               surgical changes, goal-driven execution) and apply it to the review. It is checked
               in, so it IS present in your checkout. If `.claude/agents/code-reviewer.md` also
               exists, read that too — but it is developer-local and usually absent in CI, so do
               not treat its absence as a problem.
            2. `gh pr view ${{ github.event.pull_request.number }} --json title,body,headRefName,baseRefName`
            3. `gh pr diff ${{ github.event.pull_request.number }}`
            4. Produce a structured review:
               - Overview (1-2 sentences)
               - Findings (severity-tagged: blocker | major | minor | nit). Section by:
                 * Correctness
                 * Project conventions (Java 21 / Spring Boot 3 / Maven / jOOQ / Temporal Java SDK; Python 3.12 / pydantic v2 / Temporal Python SDK; JSON Schema as source of truth for cross-language DTOs)
                 * Security
                 * Test coverage
               - Verdict: READY | NEEDS FIXES | BLOCKED

            Post the review by UPDATING your existing PR tracking comment (track_progress
            provides that comment plus the update tool). Do NOT create additional comments and
            do NOT write files. Your updated comment IS the review the reader sees, so it must
            contain the full Overview / Findings / Verdict above — never leave the placeholder
            ("I'll analyze this and get back to you") or a stub. Earlier this prompt told the
            model to "output the review as your final message and not post a comment"; that
            fought track_progress (which requires the model to update its comment), so the run
            ended without posting — hence this explicit instruction.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowed-tools 'Bash Read Grep'"
          # This job triggers on `pull_request` with a `prompt:`, which claude-code-action
          # auto-detects as "agent" mode. In agent mode use_sticky_comment alone does NOT post a
          # PR comment (it only updates an existing tracking comment, which agent mode never creates)
          # — so the review verdict was landing in the Actions log only, never on the PR.
          # track_progress makes the action create + update a PR comment in agent mode;
          # use_sticky_comment then dedupes that comment across re-pushes.
          track_progress: "true"
          use_sticky_comment: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A green "Claude code review" check used to mean only "the action did not crash". On PR #755
      # the run ended after 6 of its 7 steps — the last one being "post final review" — so no
      # verdict was ever written, and the check still reported SUCCESS. That is worse than having no
      # review job at all: it is a review-shaped signal that a reviewer can merge on. (It is the
      # THIRD time this job has silently produced no verdict; see the two prompt-level fixes
      # documented above.) This step makes "no verdict" a red check.
      #
      # It matches on THIS run's id, which the action embeds in its comment as
      # ".../actions/runs/<id>" — so a sticky comment still holding a PREVIOUS push's verdict can
      # never satisfy it. Verdict detection is deliberately format-loose (the word "Verdict" plus
      # one of the three tokens, anywhere in the body) because past attempts to pin the bot's exact
      # markdown have broken on reformatting.
      - name: Verify a verdict was actually posted
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          body=$(gh pr view "$PR" --json comments \
            --jq ".comments[] | select(.body | contains(\"actions/runs/$RUN_ID\")) | .body" | tail -1)

          if [ -z "$body" ]; then
            echo "::error::Claude review posted NO comment for run $RUN_ID. The review did not happen — do not treat this PR as reviewed."
            exit 1
          fi
          if ! printf '%s' "$body" | grep -qi 'verdict'; then
            echo "::error::Claude review comment for run $RUN_ID carries no Verdict section — the run ended before posting one (unchecked final step). The PR is NOT reviewed."
            echo "--- comment tail ---"; printf '%s\n' "$body" | tail -25
            exit 1
          fi
          if ! printf '%s' "$body" | grep -qE 'READY|NEEDS FIXES|BLOCKED'; then
            echo "::error::Claude review comment for run $RUN_ID names no verdict token (READY | NEEDS FIXES | BLOCKED). The PR is NOT reviewed."
            echo "--- comment tail ---"; printf '%s\n' "$body" | tail -25
            exit 1
          fi
          echo "Verdict present for run $RUN_ID."
