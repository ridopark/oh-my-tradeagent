name: Claude review

# Runs Claude as a code reviewer on every PR and makes its verdict MACHINE-READABLE:
#   - the review returns its verdict through `--json-schema` (structured_output), so it is a
#     validated enum, not a word to grep out of markdown;
#   - the job's conclusion IS the verdict: green only on READY (or a docs-only skip), red on
#     NEEDS_FIXES / BLOCKED / no verdict;
#   - a commit status `claude/verdict` on the head SHA says which, e.g. "NEEDS_FIXES: <summary>".
# Readers (pr-review-loop's probe, a merge rule) read that status, never the comment text. The
# sticky comment stays as the human-readable review.
#
# Auth: uses CLAUDE_CODE_OAUTH_TOKEN (tied to a Claude Max subscription).
# Generate with `claude setup-token` on a workstation logged into the Max
# account, then add as a repo secret.
#
# Fork-PR safety: GitHub does not expose repo secrets to runs from forks.
# The job gates on head.repo == base.repo so external contributors see a
# clean skip instead of a hard failure at the action step.

# No paths-ignore: a filtered PR gets NO check at all, which a required check (or any reader)
# cannot tell from "still running". Docs-only PRs are detected in the job instead and get a green
# `claude/verdict` = "SKIPPED: docs-only" without spending a review.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write  # the `claude/verdict` commit status
  id-token: write  # required by anthropics/claude-code-action@v1 OIDC flow

concurrency:
  group: claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only diffs (the old paths-ignore list) and diffs that edit .github/workflows/** (which
      # GitHub blocks from running their own review: the action posts nothing) skip the review.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          kind=review
          if [ -z "$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$|(^|/)README[^/]*$|^\.gitignore$' || true)" ]; then
            kind=docs
          elif printf '%s\n' "$files" | grep -q '^\.github/workflows/'; then
            kind=workflow
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "scope: $kind"

      - name: Code review
        id: review
        if: steps.scope.outputs.kind == 'review'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Steps:
            1. Read `CLAUDE.md` at the repo root for the project's coding rubric (SOLID/DRY/KISS,
               surgical changes, goal-driven execution) and apply it to the review. It is checked
               in, so it IS present in your checkout. If `.claude/agents/code-reviewer.md` also
               exists, read that too — but it is developer-local and usually absent in CI, so do
               not treat its absence as a problem.
            2. `gh pr view ${{ github.event.pull_request.number }} --json title,body,headRefName,baseRefName`
            3. `gh pr diff ${{ github.event.pull_request.number }}`
            DO NOT RUN BUILDS OR TEST SUITES. No `mvn`, no `pytest`, no `npm test`. A single
               orchestrator suite takes ~4 minutes and will consume your entire budget before you
               post a verdict — this has stalled the review TWICE on PR #765 (3m16s and 4m10s),
               both times parked on "run the tests to confirm green", leaving the final step
               unchecked and no verdict written. CI already runs every suite as a REQUIRED check;
               a green `Java (services/...)` leg is the evidence you would be duplicating. Your job
               is to review the DIFF. Use Bash only for the `gh` commands above and cheap reads
               (grep/sed/head). If a test's correctness cannot be judged by reading it, say so in
               the review — that is a finding, not a reason to go build the repo.
            4. Produce a structured review:
               - Overview (1-2 sentences)
               - Findings (severity-tagged: blocker | major | minor | nit). Section by:
                 * Correctness
                 * Project conventions (Java 21 / Spring Boot 3 / Maven / jOOQ / Temporal Java SDK; Python 3.12 / pydantic v2 / Temporal Python SDK; JSON Schema as source of truth for cross-language DTOs)
                 * Security
                 * Test coverage
               - Verdict: READY | NEEDS FIXES | BLOCKED

            VERDICT CONTRACT (this is what gates the PR, so it must be exact):
            - Your FINAL answer is the structured output required by the JSON schema: `verdict` is
              exactly one of READY, NEEDS_FIXES, BLOCKED; `summary` is one sentence naming the worst
              finding (or "no blocking findings"); `findings` lists each finding's severity + title.
            - READY = nothing at blocker/major severity. NEEDS_FIXES = at least one blocker or major
              the author can fix. BLOCKED = you could not review (diff unreadable, out of budget).
            - The comment's last line must repeat it verbatim: `Verdict: <READY|NEEDS_FIXES|BLOCKED>`.
              If the comment and the structured output ever disagree, the structured output wins.

            Post the review by UPDATING your existing PR tracking comment (track_progress
            provides that comment plus the update tool). Do NOT create additional comments and
            do NOT write files. Your updated comment IS the review the reader sees, so it must
            contain the full Overview / Findings / Verdict above — never leave the placeholder
            ("I'll analyze this and get back to you") or a stub. Earlier this prompt told the
            model to "output the review as your final message and not post a comment"; that
            fought track_progress (which requires the model to update its comment), so the run
            ended without posting — hence this explicit instruction.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowed-tools 'Bash Read Grep'
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","summary","findings"],"properties":{"verdict":{"type":"string","enum":["READY","NEEDS_FIXES","BLOCKED"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","title"],"properties":{"severity":{"type":"string","enum":["blocker","major","minor","nit"]},"title":{"type":"string"}}}}}}'

          # This job triggers on `pull_request` with a `prompt:`, which claude-code-action
          # auto-detects as "agent" mode. In agent mode use_sticky_comment alone does NOT post a
          # PR comment (it only updates an existing tracking comment, which agent mode never creates)
          # — so the review verdict was landing in the Actions log only, never on the PR.
          # track_progress makes the action create + update a PR comment in agent mode;
          # use_sticky_comment then dedupes that comment across re-pushes.
          track_progress: "true"
          use_sticky_comment: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE GATE. A green check used to mean only "the action did not crash" (#755: no verdict, still
      # SUCCESS), and then "a verdict word exists somewhere in the comment" — still green on NEEDS
      # FIXES, and grep-on-markdown broke every time the bot reformatted. Now the verdict comes from
      # the schema-validated structured_output of THIS run (so a stale sticky comment cannot satisfy
      # it), the job's conclusion is the verdict, and `claude/verdict` records which.
      #
      # Tested by scripts/tests/test_claude_review_gate.py, which extracts this step and runs it
      # against a fake `gh`. Edit both together.
      #
      # NOTE: for same-repo `pull_request` runs GitHub uses the workflow from the PR HEAD, so an edit
      # here runs on its own PR — but that PR edits .github/workflows/**, so the review itself is
      # skipped there (kind=workflow). The first real exercise is the NEXT ordinary PR.
      - name: Verdict gate
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: ${{ steps.scope.outputs.kind }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
        run: |
          set -uo pipefail
          status() {  # state, description (GitHub caps it at 140 chars)
            gh api -X POST "repos/$REPO/statuses/$SHA" -f context=claude/verdict -f state="$1" \
              -f description="${2:0:140}" -f target_url="$RUN_URL" >/dev/null \
              || echo "::warning::could not set the claude/verdict status"
          }
          case "$KIND" in
            docs)
              status success "SKIPPED: docs-only diff, not reviewed"
              echo "Docs-only diff: review skipped."; exit 0 ;;
            workflow)
              # Not a failure of the PR: GitHub does not let a workflow-editing PR run this review.
              # The job stays green so CI-fix PRs are not permanently red, but the STATUS says it was
              # not reviewed, so nothing that reads claude/verdict can treat it as approved.
              status failure "NOT_REVIEWED: edits .github/workflows, review by hand"
              echo "::warning::This PR edits .github/workflows/** — GitHub blocks its own Claude review. NOT reviewed by the bot; review by hand."
              exit 0 ;;
            review) ;;
            *)
              status error "NO_VERDICT: scope step did not run"
              echo "::error::scope step produced no kind ('$KIND')"; exit 1 ;;
          esac
          verdict=$(printf '%s' "$STRUCTURED" | jq -r '.verdict // empty' 2>/dev/null || true)
          summary=$(printf '%s' "$STRUCTURED" | jq -r '.summary // empty' 2>/dev/null || true)
          case "$verdict" in
            READY)
              status success "READY: $summary"
              echo "Verdict READY: $summary" ;;
            NEEDS_FIXES|BLOCKED)
              status failure "$verdict: $summary"
              echo "::error::Claude review verdict $verdict: $summary"
              printf '%s' "$STRUCTURED" | jq -r '.findings[]? | "- [\(.severity)] \(.title)"' || true
              exit 1 ;;
            *)
              status error "NO_VERDICT: review step $REVIEW_OUTCOME, no structured verdict"
              echo "::error::The review produced no structured verdict (review step: $REVIEW_OUTCOME). The PR is NOT reviewed."
              exit 1 ;;
          esac
