name: Deploy to homelab

# Rolls one or more service Deployments on the homelab k3s cluster so they
# re-pull the `:latest` image pushed by `build-images.yml`. All manifests in
# `infra/k8s/` pin `:latest` with `imagePullPolicy: Always`, so a plain
# `kubectl apply` is a no-op on an unchanged manifest — only a pod restart
# (`kubectl rollout restart`) triggers the re-pull. This workflow is that
# restart.
#
# Two trigger paths:
#   - workflow_run: auto-chained off a successful "Build and push images"
#     run on main. DIFF-SCOPED: rolls ONLY the services whose files changed
#     in the triggering commit (PRs squash-merge to main, so the head commit
#     is the whole change). This stops a deploy from re-applying an UNRELATED
#     service's manifest and clobbering a live-only `kubectl` override — e.g.
#     the orchestrator's homelab `prod_real` tenant mount or
#     exec-alpaca-paper's `BROKER_CREDS_SOURCE=db` (the deploy-all clobber bit
#     on 2026-06-15: a BFF-only PR rolled orchestrator + exec and reverted
#     both). A change to shared Java code (`contract/**`, root `pom.xml`,
#     the java-service Dockerfile) still rolls all Java services, because they
#     are all rebuilt — that residual clobber is inherent to a real shared
#     change and must be re-patched by hand.
#   - workflow_dispatch: manual redeploy from the Actions tab. Pick one
#     service or `all`. `all` is an explicit operator reconcile. Use for
#     rolling restart on config change, or to replay after a failed deploy.
#
# Both paths require:
#   - Self-hosted runner with label `homelab` (shared with k8s-drift).
#   - Repo variable `DEPLOY_ENABLED=true` (operator flips after setup).
#   - Repo secret `KUBECONFIG_DEPLOY` populated with a write-capable
#     kubeconfig for the `copytrade` namespace.
#   - GitHub Environment `production-homelab` configured with a required
#     reviewer (= you). The approval prompt blocks the deploy job until
#     you click Approve in the Actions UI.
#
# One-time operator setup (do once, leave alone):
#   1. Register the self-hosted runner with labels `self-hosted,homelab`
#      if it isn't already (the k8s-drift workflow reuses it — see
#      docs/ops/k8s-drift-check.md for runner setup).
#   2. Settings → Environments → New environment: `production-homelab`.
#      Under "Required reviewers" add yourself. (Optional: restrict to
#      `main` branch.)
#   3. Settings → Secrets and variables → Actions → Secrets:
#      add `KUBECONFIG_DEPLOY` with the contents of a write-capable
#      kubeconfig (typically the operator's `~/.kube/config-homelab`).
#   4. Settings → Secrets and variables → Actions → Variables:
#      add `DEPLOY_ENABLED=true`. Until you flip this, the workflow
#      exits early with a friendly skip notice so the introducing PR
#      doesn't fail on its own merge.
#
# Verification after deploy:
#   Rollout-status exit code is the source of truth — the job fails if any
#   new pod doesn't reach Ready within 180s. For service-specific signals
#   (e.g. confirming the new orchestrator meters appear on
#   `/actuator/prometheus`), run the per-PR test-plan checks manually
#   against the cluster — those are not gated here on purpose, to keep the
#   deploy workflow's responsibility narrow (image → rolled out, Ready).

on:
  workflow_run:
    workflows: ["Build and push images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to redeploy"
        required: true
        type: choice
        default: all
        options:
          - all
          - orchestrator
          - exec-alpaca-paper
          - market-data
          - api-gateway
          - signal-source-discord
          - discord-chat-mirror
          - discord-signals-mirror
          - tenant-dashboard-bff
          - dashboard
          - stc-intent-service

permissions:
  contents: read

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

env:
  NAMESPACE: copytrade
  # Authoritative service list for the deploy matrix. The workflow_dispatch
  # `inputs.service.options:` block above must stay in sync — GitHub Actions
  # requires `choice` options to be a literal YAML list, so single-sourcing
  # both lists is not possible.
  #
  # Naming note: `service: exec` in `build-images.yml`'s matrix builds the
  # `oh-my-tradeagent-exec` image which the `exec-alpaca-paper` Deployment
  # pulls. Build-name ≠ Deployment-name is intentional — see
  # `infra/k8s/52-exec-alpaca-paper.yaml`.
  SERVICES: "orchestrator exec-alpaca-paper market-data api-gateway signal-source-discord discord-chat-mirror discord-signals-mirror tenant-dashboard-bff dashboard stc-intent-service"

jobs:
  preflight:
    name: Preflight (gate on operator setup + upstream success)
    runs-on: ubuntu-latest
    # Skip the entire workflow if the auto-trigger fired off a failed build.
    # (workflow_dispatch always proceeds to the gate check below.)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check DEPLOY_ENABLED + KUBECONFIG_DEPLOY presence
        id: gate
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          KUBECONFIG_PRESENT: ${{ secrets.KUBECONFIG_DEPLOY != '' }}
        run: |
          if [ "${DEPLOY_ENABLED}" != "true" ]; then
            echo "::notice::DEPLOY_ENABLED is not 'true' — skipping deploy. Set repo variable DEPLOY_ENABLED=true after first-time setup."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${KUBECONFIG_PRESENT}" != "true" ]; then
            echo "::notice::KUBECONFIG_DEPLOY secret is empty — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build deploy matrix
        id: matrix
        # All inputs handed through `env:` so the script is pure shell — no
        # mixing of GitHub-expression and shell-expression contexts.
        #   - workflow_dispatch: the chosen service, or `all` (operator reconcile).
        #   - workflow_run (auto): DIFF-SCOPED — map the triggering commit's changed
        #     files to affected services so we never roll an unrelated service. gh is
        #     preinstalled on ubuntu runners; contents:read covers the commits API.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ github.event.inputs.service }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SERVICE="${DISPATCH_SERVICE:-all}"
            if [ "$SERVICE" != "all" ]; then
              matrix=$(jq -nc --arg s "$SERVICE" '{service: [$s]}')
            else
              matrix=$(jq -nc --arg s "$SERVICES" '{service: ($s | split(" "))}')
            fi
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "Dispatch deploy matrix: $matrix"
            exit 0
          fi

          # --- workflow_run: diff-based matrix ---
          files=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.files[].filename' || true)
          if [ -z "$files" ]; then
            echo "::warning::Could not determine changed files for ${HEAD_SHA}; deploying nothing. Run deploy.yml manually (workflow_dispatch) if a rollout is needed."
            echo 'matrix={"service":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A want
          add_all_java() { for s in orchestrator exec-alpaca-paper market-data api-gateway tenant-dashboard-bff; do want["$s"]=1; done; }
          add_all() { for s in $SERVICES; do want["$s"]=1; done; }
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              services/orchestrator/*)                 want[orchestrator]=1 ;;
              services/exec/*)                          want[exec-alpaca-paper]=1 ;;
              services/market-data/*)                   want[market-data]=1 ;;
              services/api-gateway/*)                   want[api-gateway]=1 ;;
              # ONE source dir, TWO Deployments (PLAN-2026-08-12): the /options-chat mirror ships
              # as a second entrypoint (ohmytradeagent_sidecar.chat_main) in the SAME image, so any
              # change here rebuilds the one image BOTH pods pull and both must be rolled.
              # CONSEQUENCE: a chat-mirror-only fix (e.g. a chat_dom selector) also restarts the
              # LIVE trading signal watcher, which loses its rendered scrollback with no backfill.
              # Merge changes under this path outside market hours.
              services/signal-source-discord/*)         want[signal-source-discord]=1
                                                        want[discord-chat-mirror]=1
                                                        want[discord-signals-mirror]=1 ;;
              services/stc-intent-service/*)            want[stc-intent-service]=1 ;;
              services/tenant-dashboard-bff/*)          want[tenant-dashboard-bff]=1 ;;
              services/audit/*)                         : ;;   # no rolled Deployment
              dashboard/*)                              want[dashboard]=1 ;;
              # Shared Java inputs rebuild every Java image -> roll them all.
              contract/*|pom.xml|infra/docker/java-service.Dockerfile) add_all_java ;;
              # Other build-context-wide inputs -> roll everything.
              infra/docker/*|.dockerignore)             add_all ;;
              # A bundled manifest edit rolls its own service (NN-<service>.yaml).
              infra/k8s/51-orchestrator.yaml)           want[orchestrator]=1 ;;
              infra/k8s/52-exec-alpaca-paper.yaml)      want[exec-alpaca-paper]=1 ;;
              infra/k8s/53-market-data.yaml)            want[market-data]=1 ;;
              infra/k8s/54-api-gateway.yaml)            want[api-gateway]=1 ;;
              infra/k8s/55-signal-source-discord.yaml)  want[signal-source-discord]=1 ;;
              infra/k8s/62-discord-chat-mirror.yaml)    want[discord-chat-mirror]=1 ;;
              infra/k8s/63-discord-signals-mirror.yaml) want[discord-signals-mirror]=1 ;;
              infra/k8s/60-stc-intent-service.yaml)     want[stc-intent-service]=1 ;;
              infra/k8s/58-tenant-dashboard-bff.yaml)   want[tenant-dashboard-bff]=1 ;;
              infra/k8s/59-dashboard.yaml)              want[dashboard]=1 ;;
              *) : ;;   # docs, .github, tenants/, other infra/k8s -> no rollout
            esac
          done <<< "$files"

          # One service key per line into jq; select drops the lone blank line that
          # printf emits when `want` is empty, yielding {"service":[]}.
          matrix=$(printf '%s\n' "${!want[@]}" | jq -Rnc '[inputs | select(. != "")] | {service: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; printf '%s\n' "$files"
          echo "Diff-based deploy matrix: $matrix"
          if [ "$matrix" = '{"service":[]}' ]; then
            echo "::notice::No deployable service changed in ${HEAD_SHA}; skipping rollout."
          fi

  deploy:
    name: Roll ${{ matrix.service }}
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    # LAN-only runner — shares the `homelab` label with k8s-drift.
    runs-on: [self-hosted, homelab]
    # Required-reviewer gate. The job blocks on approval before any
    # `kubectl` runs — secrets are not even injected until approval lands.
    environment: production-homelab
    timeout-minutes: 10
    strategy:
      # One service failure shouldn't cancel the others — they're independent
      # rolling restarts and we'd rather see partial success than nothing.
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout repo (for infra/k8s manifests)
        uses: actions/checkout@v4

      - name: Write deploy kubeconfig
        env:
          KUBECONFIG_DEPLOY: ${{ secrets.KUBECONFIG_DEPLOY }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBECONFIG_DEPLOY" > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Apply manifest for ${{ matrix.service }}
        # Picks up env-var / resource / image-tag changes from git.
        # Prior to this step, deploy.yml only ran `kubectl rollout restart`,
        # which preserves whatever spec is live in etcd — so manifest edits
        # never reached the cluster without a manual `kubectl apply`.
        # See post-incident notes from the fill-listener launch.
        #
        # Each service has exactly one manifest under infra/k8s/ named
        # `NN-<service>.yaml` (51-orchestrator.yaml, 52-exec-alpaca-paper.yaml,
        # 53-market-data.yaml, 54-api-gateway.yaml, 55-signal-source-discord.yaml).
        # The glob below fails if there's not exactly one match — adding a
        # second matching manifest is a config error worth surfacing here.
        run: |
          set -euo pipefail
          # Services carrying LIVE-ONLY overrides applied out-of-band via `kubectl patch`
          # (NOT reflected in the repo manifest) — applying NN-<svc>.yaml would REVERT them
          # and break the live pipeline. Skip apply for these; the rollout restart below still
          # re-pulls :latest while preserving the live spec. Apply genuine manifest changes for
          # them BY HAND. (Footgun confirmed 2026-06-15 and 2026-06-16 — see ops notes.)
          #   - orchestrator: tenants volume items → prod_real/ + staging_paper/ (repo = dev/)
          #   - dashboard + api-gateway: STRATEGY_CONFIG_WRITE_ENABLED=true (repo keeps the
          #     config-write path DARK by default → absent in repo → apply re-darks the config page)
          #   - orchestrator (also): STRATEGY_CONFIG_SOURCE=db (configs read from the strategy_config
          #     table, not the YAML ConfigMap, so the dashboard enable-toggle is the live control)
          #   - market-data: ALPACA_STOCK_FEED=sip (repo keeps the equity feed UNSET/fail-closed by
          #     default → absent in repo → apply re-gates it). Its alpaca-credentials-data secretRef
          #     IS in repo; only the feed selector is the live override.
          #   - signal-source-discord: SIGNAL_EMIT_ADDITIONAL_TARGETS=staging_paper:copytrade-v1,
          #     staging_paper:watchlist-trigger-v1 (repo has no shadow targets → apply drops them →
          #     staging_paper stops receiving the daily watchlist fan-out)
          #   - tenant-dashboard-bff: OPERATOR_ADMIN_READ_ENABLED=true + OPERATOR_ALLOWLIST=<operator email>
          #     (operator Add-Tenant admin-read enablement; repo keeps admin-read DARK by default →
          #     absent in repo → apply re-darks the /api/admin/tenants route and the operator can no
          #     longer see the tenant list). Same class as api-gateway's operator overrides.
          #
          # exec-alpaca-paper was REMOVED from this list 2026-08-16. Its two listed overrides
          # (BROKER_CREDS_SOURCE=db + EXEC_BOOTSTRAP_TENANT_ID=staging_paper) are now DECLARED in
          # 52-exec-alpaca-paper.yaml, along with the other three that were never listed here at
          # all (BROKER_CREDENTIALS_DELETE_ENABLED, EXEC_ADMIN_SHARED_TOKEN,
          # EXEC_FILL_LISTENER_PER_TENANT_ENABLED) — so apply no longer strips anything.
          # Verified: `kubectl diff -f 52-exec-alpaca-paper.yaml` exits 0 against the live cluster,
          # i.e. a full-object apply is a genuine no-op, not merely an env-var match.
          #
          # This matters beyond tidiness. While it sat here, manifest edits for this service
          # reached the cluster ONLY by hand, so the manifest was decorative and drifted silently
          # — which is precisely how the fill-listener 401 (#695) went unnoticed. Skipping apply
          # to protect undeclared state keeps the state undeclared.
          #
          # ORDER MATTERS: this removal is only safe because the declarations merged with it. Do
          # not remove another service from this list without first declaring its overrides AND
          # confirming `kubectl diff` exits 0 for its manifest.
          RESTART_ONLY="orchestrator dashboard api-gateway market-data signal-source-discord tenant-dashboard-bff"
          for s in $RESTART_ONLY; do
            if [ "$s" = "${{ matrix.service }}" ]; then
              echo "::notice::${{ matrix.service }} has live-only overrides — skipping apply (rollout restart below still re-pulls :latest)."
              exit 0
            fi
          done
          shopt -s nullglob
          matches=(infra/k8s/*-${{ matrix.service }}.yaml)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one infra/k8s/*-${{ matrix.service }}.yaml; found ${#matches[@]}: ${matches[*]:-<none>}"
            exit 1
          fi
          kubectl -n "$NAMESPACE" apply -f "${matches[0]}"

      - name: Rollout restart deployment/${{ matrix.service }}
        # Still needed even after `apply`: when the manifest hasn't changed
        # but a new `:latest` image was pushed, this forces a pod restart so
        # `imagePullPolicy: Always` actually re-pulls (the policy only fires
        # on pod creation, not on existing pods).
        run: |
          kubectl -n "$NAMESPACE" rollout restart deployment/${{ matrix.service }}

      - name: Wait for rollout
        # `kubectl rollout status` exits non-zero on timeout, so this step
        # IS the verification — if a new pod fails its probes (or fails to
        # pull :latest) the job fails here.
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/${{ matrix.service }} --timeout=180s

      - name: Show running pods + image digests
        # Best-effort visibility into what's actually live now. Never blocks
        # the job — `|| true` so a label-scheme tweak elsewhere doesn't
        # break the deploy.
        run: |
          kubectl -n "$NAMESPACE" get pods -l app=${{ matrix.service }} \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[*].imageID}{"\n"}{end}' \
            || true

      - name: Warn loudly if exec-alpaca-live is now behind (real-money pod is NOT auto-rolled)
        # exec-alpaca-live shares the `oh-my-tradeagent-exec` image with exec-alpaca-paper but is
        # DELIBERATELY excluded from this workflow (real-money pod = manual roll only, so no merge
        # can ever auto-restart the live account). Consequence: every paper roll to a NEW image
        # silently leaves the live pod on an OLDER image. This step surfaces that drift LOUDLY the
        # moment it happens, so the operator remembers to hand-roll the live pod when it's safe.
        # Fires only after a successful exec-alpaca-paper roll. Manual `kubectl` rolls of paper are
        # not covered (they're deliberate); this guards the automatic path.
        if: ${{ success() && matrix.service == 'exec-alpaca-paper' }}
        run: |
          set -uo pipefail
          NS="$NAMESPACE"
          digest() { kubectl -n "$NS" get pod -l app="$1" \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}' 2>/dev/null || echo ""; }
          paper="$(digest exec-alpaca-paper)"
          live="$(digest exec-alpaca-live)"
          echo "paper=$paper"
          echo "live=$live"
          if [ -z "$live" ]; then
            echo "::notice::exec-alpaca-live pod not found — no drift check."
            exit 0
          fi
          if [ "$live" = "$paper" ]; then
            echo "::notice::exec-alpaca-live is on the same exec image as exec-alpaca-paper — no drift."
            exit 0
          fi
          MSG="exec-alpaca-paper was just rolled to a NEW exec image, but exec-alpaca-live (REAL MONEY) is STILL on an OLDER image and was NOT updated — it is intentionally excluded from CI deploy. Roll it MANUALLY when the live account is flat / market is closed (replicas:1 → the roll briefly drops the live fill listener): kubectl rollout restart deployment/exec-alpaca-live -n copytrade   [paper=$paper live=$live commit=${GITHUB_SHA:0:8}]"
          # Job log annotation + run summary (always).
          echo "::warning::$MSG"
          { echo "## ⚠️ exec-alpaca-live is BEHIND exec-alpaca-paper"; echo ""; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
          # Loud channel: prefer a dedicated deploy webhook secret; else the cluster's global alert
          # webhook (zero-setup — the LAN runner already has kubectl). Never fails the deploy.
          hook="${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}"
          if [ -z "$hook" ]; then
            hook="$(kubectl -n "$NS" get secret discord-alert-credentials \
              -o jsonpath='{.data.ALERT_DISCORD_WEBHOOK_URL}' 2>/dev/null | base64 -d 2>/dev/null || echo "")"
          fi
          if [ -n "$hook" ]; then
            DISCORD_WEBHOOK_URL="$hook" ./scripts/discord-notify.sh \
              "⚠️ exec-alpaca-live is BEHIND — manual roll needed" "$MSG" red \
              || echo "::warning::discord notify failed (non-fatal)"
          else
            echo "::warning::no discord webhook available — warning is in the job log + run summary only."
          fi
