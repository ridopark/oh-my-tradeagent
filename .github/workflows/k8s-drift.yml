name: k8s drift check (advisory)

# Runs `kubectl diff -f infra/k8s/` against the live homelab k3s cluster
# whenever a PR touches `infra/k8s/**`, and posts the diff as a sticky
# PR comment. Advisory only — never blocks merge.
#
# Why this exists: kubeconform (in ci.yml) catches schema regressions but
# does NOT compare to live cluster state. This workflow closes that loop
# so reviewers see drift before merging. Implements Option 1 (advisory
# comment) from issue #133; Options 2 (blocking check) and 3 (GitOps)
# are deferred.
#
# Cluster reachability: requires a self-hosted runner with LAN access to
# the homelab (label `homelab`) plus a read-only kubeconfig in the
# `KUBECONFIG_READONLY` secret. Setup is one-time and documented in
# docs/ops/k8s-drift-check.md.
#
# Gate: the operator flips repo variable `K8S_DRIFT_CHECK_ENABLED=true`
# only after the runner is registered AND the secret is populated. Until
# then the job exits early with a friendly skip message so the workflow
# does not fail on its own introducing PR (no runner yet, no secret yet).
# The job also defends against an empty secret value in case the var
# gets flipped prematurely.
#
# Read-only safety: NOT RBAC-enforced, despite what this comment used to
# claim. `kubectl diff` performs a server-side DRY-RUN apply and the
# apiserver authorizes the underlying write verb even for a dry run, so the
# SA necessarily holds create/patch/update on the diffed namespaced kinds —
# a leaked token COULD mutate them. The no-mutation guarantee is PROCEDURAL
# (this workflow only ever runs `kubectl diff`, never `apply`) plus the
# layered defenses below. 56-ci-readonly-sa.yaml has always documented this
# correctly; this header contradicted it, which is the worse of the two
# failure modes for a security claim. Corrected 2026-08-16.
#
# The SA is scoped to namespace `copytrade`, and deliberately holds NO
# access to `secrets` — the diff output is posted verbatim into a PR
# comment on a PUBLIC repo, so read access to a Secret is an exfiltration
# path. See 56-ci-readonly-sa.yaml before widening any grant.
#
# Public-repo safety: three layered defenses make a self-hosted runner
# safe here — `pull_request_target` trigger, required-reviewer
# environment, no PR-supplied script execution. Threat model and
# rationale in docs/ops/k8s-drift-check.md#public-repo-workflow-safety.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "infra/k8s/**"
      - ".github/workflows/k8s-drift.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: k8s-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Preflight runs on GitHub-hosted infra so we can decide whether to
  # dispatch the actual diff job to the (possibly-unregistered) self-hosted
  # runner. This avoids "no runner available" failures on PRs that land
  # before the operator finishes one-time setup.
  preflight:
    name: Preflight (gate on operator setup)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Check K8S_DRIFT_CHECK_ENABLED + KUBECONFIG_READONLY presence
        id: gate
        env:
          K8S_DRIFT_CHECK_ENABLED: ${{ vars.K8S_DRIFT_CHECK_ENABLED }}
          KUBECONFIG_PRESENT: ${{ secrets.KUBECONFIG_READONLY != '' }}
        run: |
          if [ "${K8S_DRIFT_CHECK_ENABLED}" != "true" ]; then
            echo "::notice::K8S_DRIFT_CHECK_ENABLED is not 'true' — skipping drift check. See docs/ops/k8s-drift-check.md to enable."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${KUBECONFIG_PRESENT}" != "true" ]; then
            echo "::notice::KUBECONFIG_READONLY secret is empty — skipping drift check. See docs/ops/k8s-drift-check.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  drift:
    name: kubectl diff vs. live cluster
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    # LAN-only runner — see docs/ops/k8s-drift-check.md for registration.
    runs-on: [self-hosted, homelab]
    # Required-reviewer gate — see docs/ops/k8s-drift-check.md step 3.
    environment: production-drift-check
    timeout-minutes: 10
    steps:
      # pull_request_target defaults to checking out the base ref (main).
      # We explicitly check out the PR head's commit SHA so kubectl diff
      # operates on the PR's manifest content. Pinning by SHA (not ref)
      # prevents TOCTOU if the PR is force-pushed between trigger and
      # execution. persist-credentials: false ensures the elevated
      # GITHUB_TOKEN from pull_request_target context is not left on
      # disk where a subsequent step could leak it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Write read-only kubeconfig
        env:
          KUBECONFIG_READONLY: ${{ secrets.KUBECONFIG_READONLY }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBECONFIG_READONLY" > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: kubectl diff -f infra/k8s/
        id: diff
        # `kubectl diff` exits 1 when differences exist (documented quirk
        # called out in issue #133). `|| true` keeps the step green; the
        # captured stdout drives the PR comment regardless.
        run: |
          set +e
          # PER-FILE, not `kubectl diff -f infra/k8s/`. The whole-directory form ABORTS on the
          # first Forbidden: the first real run (2026-08-16) hit a missing networkpolicies grant,
          # reported that single error, and inspected nothing else — a green job covering zero
          # objects. Per-file means one uncoverable manifest can never blind the rest.
          #
          # Two manifests are deliberately NOT diffed, because covering them would require grants
          # that are worse than the gap:
          #   - 00-namespace.yaml     — Namespace is cluster-scoped; a dry-run apply needs
          #                             cluster-wide patch on namespaces.
          #   - 56-ci-readonly-sa.yaml — contains Role/ClusterRole/RoleBinding. Granting the drift
          #                             SA create/patch on RBAC kinds would let its own token
          #                             grant itself cluster-admin — a privilege-escalation
          #                             primitive reachable from a PUBLIC repo. Never add these.
          #
          # Skips are COUNTED AND NAMED in the comment. A check that silently narrows its own
          # coverage is the failure this workflow exists to catch.
          EXCLUDE_RE='^(00-namespace|56-ci-readonly-sa)\.yaml$'

          # `kubectl diff` reports two things that are not drift, and on the first real run they
          # were 2 of the 9 "drifted" files — enough noise to bury the findings that mattered:
          #
          #   1. Server-assigned metadata. `generation` bumps on every apply; creationTimestamp /
          #      uid / resourceVersion are assigned by the API server and appear on any object the
          #      dry-run has to synthesise. None of it is authored in the manifest.
          #   2. Pure list REORDERING. Strategic-merge appends, so a live env list can hold exactly
          #      the manifest's entries in a different order. Same names, same values, no drift.
          #
          # The filter below drops an object ONLY when the surviving removed and added lines are
          # the same multiset — i.e. every line is accounted for on both sides. A genuine
          # addition, removal, or value change leaves the multisets unequal and the object is
          # reported in full.
          #
          # GUARD: ordering CAN be semantic when one env entry expands another via $(VAR), which
          # k8s resolves in declaration order. If any line involved carries `$(`, the object is
          # reported as drift regardless. (No manifest uses env-to-env $() today; the guard is so
          # that adding one doesn't silently un-cover this check.)
          #
          # Suppressions are COUNTED AND NAMED in the comment, same rule as skips: a check that
          # quietly narrows what it reports is the failure this workflow exists to catch.
          #
          # WHY THIS IS A HEREDOC AND NOT scripts/normalize-k8s-diff.py — DO NOT "CLEAN THIS UP".
          # This workflow is `pull_request_target` on a PUBLIC repo, running on a SELF-HOSTED
          # runner that holds a cluster kubeconfig, and it checks out the PR HEAD sha. The third
          # layered defense in docs/ops/k8s-drift-check.md is "no PR-supplied script ever
          # executes". A heredoc lives in the workflow file, which pull_request_target always
          # takes from the BASE branch — trusted. A file under scripts/ lives in the checked-out
          # PR tree — attacker-controlled. Running `python3 scripts/<anything>` here would hand
          # any fork PR arbitrary code execution on the LAN runner. The rigor normally bought by
          # extracting-and-unit-testing is bought instead by ci.yml's
          # "k8s drift noise filter (mutation table)" step, which EXTRACTS this very heredoc and
          # runs the mutation suite against it on GitHub-hosted infra.
          #
          # python3 is a prerequisite of the FILTER, not of the CHECK. If it is missing the loop
          # below degrades to reporting kubectl diff unfiltered and says so in the comment —
          # noisier, never quieter. Losing the filter must not look like finding no drift.
          cat > "$RUNNER_TEMP/normalize.py" <<'PYEOF'
          import re, sys

          NOISE = re.compile(r'^[-+]\s*(generation|creationTimestamp|uid|resourceVersion):')
          # Split the file's diff into per-object chunks; each starts with a `--- ` header line.
          chunks, cur = [], []
          for line in sys.stdin.read().splitlines():
              if line.startswith('--- ') and cur:
                  chunks.append(cur); cur = [line]
              else:
                  cur.append(line)
          if cur:
              chunks.append(cur)

          kept = []
          for chunk in chunks:
              minus, plus, guarded = [], [], False
              for line in chunk:
                  if line.startswith('---') or line.startswith('+++') or NOISE.match(line):
                      continue
                  if line.startswith('-'):
                      minus.append(line[1:])
                  elif line.startswith('+'):
                      plus.append(line[1:])
              if '$(' in ''.join(minus + plus):
                  guarded = True
              if not guarded and sorted(minus) == sorted(plus):
                  continue  # nothing authored actually differs
              kept.append('\n'.join(chunk))

          # EXIT CODES: 0 = everything was noise, DRIFT_EXIT = real drift (printed above).
          # Deliberately NOT 1. Python exits 1 on an UNHANDLED EXCEPTION, with a traceback on
          # stderr and an EMPTY stdout — so if drift were signalled with 1, any crash in this
          # program would be read by the caller as "real drift" and rendered as a DRIFT section
          # with nothing under it. An empty drift entry reads as "checked it, nothing to show":
          # quieter than the truth, which is the one thing this filter must never be. 10 is a
          # value the interpreter never produces on its own, so a crash can only ever fall
          # through to the caller's unfiltered fallback.
          DRIFT_EXIT = 10

          if kept:
              print('\n'.join(kept))
              sys.exit(DRIFT_EXIT)
          sys.exit(0)
          PYEOF

          : > "$RUNNER_TEMP/drift.txt"
          : > "$RUNNER_TEMP/coverage.txt"

          # Truncation happens ABOVE this line, so the degradation notice below survives into the
          # posted comment.
          if command -v python3 >/dev/null 2>&1; then
            FILTER_AVAILABLE=1
          else
            FILTER_AVAILABLE=0
            echo "::warning::python3 not found on this runner — noise filter disabled; reporting kubectl diff UNFILTERED."
            echo "- ⚠ **noise filter unavailable** (no python3 on the runner) — every diff below is UNFILTERED, so server-assigned metadata and list reordering appear as drift." >> "$RUNNER_TEMP/coverage.txt"
          fi

          clean=0; drifted=0; skipped=0; errored=0; suppressed=0
          for f in infra/k8s/*.yaml; do
            b=$(basename "$f")
            if echo "$b" | grep -qE "$EXCLUDE_RE"; then
              skipped=$((skipped + 1))
              echo "- \`$b\` — excluded by design (cluster-scoped / RBAC kinds)" >> "$RUNNER_TEMP/coverage.txt"
              continue
            fi
            out=$(kubectl diff -f "$f" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              clean=$((clean + 1))
            elif [ $rc -eq 1 ]; then
              # Re-classify: strip server-assigned metadata and pure reordering, then see whether
              # anything authored actually differs. Filter exit 0 = it was all noise, 10 = real
              # drift remains. ANY other code means the FILTER failed, which is not the same
              # thing as finding nothing — see the DRIFT_EXIT comment above for why 10 and not 1.
              if [ "$FILTER_AVAILABLE" = "1" ]; then
                filtered=$(printf '%s\n' "$out" | python3 "$RUNNER_TEMP/normalize.py" 2>"$RUNNER_TEMP/filter.err")
                frc=$?
              else
                filtered=""
                frc=127
                : > "$RUNNER_TEMP/filter.err"
              fi
              # Belt AND braces: a clean 10 with nothing to show is still a broken filter, and
              # would render as an empty DRIFT section. Treat it as a failure, not as drift.
              if [ $frc -eq 10 ] && [ -z "$(printf '%s' "$filtered" | tr -d '[:space:]')" ]; then
                frc=99
              fi
              if [ $frc -eq 0 ]; then
                clean=$((clean + 1))
                suppressed=$((suppressed + 1))
                echo "- \`$b\` — clean (differed only by server-assigned metadata / list order)" >> "$RUNNER_TEMP/coverage.txt"
              elif [ $frc -eq 10 ]; then
                drifted=$((drifted + 1))
                { echo "### DRIFT — $b"; echo "$filtered"; echo; } >> "$RUNNER_TEMP/drift.txt"
              else
                # The filter failed (crash, missing interpreter, or an empty drift claim). Report
                # the RAW kubectl diff — never the filter's stdout, which is empty in exactly
                # these cases, and never an empty DRIFT section, which would read as "checked,
                # found nothing to show". Counted as drift so the finding cannot be lost, and the
                # filter's stderr is carried through so the cause is diagnosable from the comment.
                drifted=$((drifted + 1))
                {
                  echo "### DRIFT — $b (noise filter FAILED, exit $frc — diff below is UNFILTERED)"
                  if [ -s "$RUNNER_TEMP/filter.err" ]; then
                    echo "noise filter stderr:"
                    head -c 2000 "$RUNNER_TEMP/filter.err"
                    echo
                  fi
                  echo "$out"
                  echo
                } >> "$RUNNER_TEMP/drift.txt"
                echo "- \`$b\` — drift reported UNFILTERED (noise filter exited $frc)" >> "$RUNNER_TEMP/coverage.txt"
              fi
            else
              # NOT silently tolerated: an unreadable manifest is a COVERAGE GAP, and the
              # comment must say so rather than imply the object was checked and matched.
              errored=$((errored + 1))
              { echo "### COVERAGE GAP — $b (kubectl diff exit $rc; this manifest was NOT checked)"; echo "$out"; echo; } >> "$RUNNER_TEMP/drift.txt"
              echo "- \`$b\` — **NOT CHECKED** (exit $rc, see report)" >> "$RUNNER_TEMP/coverage.txt"
            fi
          done
          set -e
          checked=$((clean + drifted))
          printf 'Coverage: **%d** manifests checked (%d clean — %d of them after noise filtering, %d drifted), **%d** excluded by design, **%d** unreadable.\n' \
            "$checked" "$clean" "$suppressed" "$drifted" "$skipped" "$errored" > "$RUNNER_TEMP/coverage.head"
          cat "$RUNNER_TEMP/coverage.txt" >> "$RUNNER_TEMP/coverage.head"
          mv "$RUNNER_TEMP/coverage.head" "$RUNNER_TEMP/coverage.txt"
          echo "checked=$checked clean=$clean (noise-filtered=$suppressed) drifted=$drifted skipped=$skipped errored=$errored"
          # Truncate to keep PR comment under GitHub's 65k limit.
          # 60k leaves room for the markdown wrapper + marker.
          head -c 60000 "$RUNNER_TEMP/drift.txt" > "$RUNNER_TEMP/drift.trimmed.txt"
          if [ "$(wc -c < "$RUNNER_TEMP/drift.txt")" -gt 60000 ]; then
            printf '\n\n... (output truncated at 60000 bytes; run kubectl diff -f infra/k8s/ locally for the full report)\n' \
              >> "$RUNNER_TEMP/drift.trimmed.txt"
          fi

      - name: Post / update PR comment
        uses: actions/github-script@v7
        env:
          DRIFT_FILE: ${{ runner.temp }}/drift.trimmed.txt
          COVERAGE_FILE: ${{ runner.temp }}/coverage.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- k8s-drift-report -->';
            const driftRaw = fs.readFileSync(process.env.DRIFT_FILE, 'utf8').trim();
            // Coverage is ALWAYS rendered, including on the clean path. "No drift detected" with
            // no statement of what was inspected is exactly how a check that silently stopped
            // checking passes for a working one.
            const coverage = fs.readFileSync(process.env.COVERAGE_FILE, 'utf8').trim();
            const head = `${marker}\n### k8s drift check (advisory)\n\n${coverage}\n`;
            const body = driftRaw.length === 0
              ? `${head}\nNo drift detected in the manifests checked above.`
              : `${head}\n<details><summary>kubectl diff (per manifest)</summary>\n\n\`\`\`diff\n${driftRaw}\n\`\`\`\n\n</details>\n\n_Advisory only — does not block merge. See \`docs/ops/k8s-drift-check.md\`._`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Find prior comment by marker so re-runs replace instead of stack.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = comments.find(c => c.body && c.body.startsWith(marker));

            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
