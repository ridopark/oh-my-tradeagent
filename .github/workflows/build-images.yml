name: Build and push images

# Builds every service image. On push to main, tags and pushes to GHCR
# under `ghcr.io/<owner>/oh-my-tradeagent-<service>` with `latest` and
# the commit SHA. On pull_request, only builds (no push) so PRs validate
# the Dockerfiles + .dockerignore without leaking unfinished tags.
#
# workflow_dispatch (#723): the manual re-fire for the flake trap. When the CI
# leg flakes red on a main commit, this workflow fails at its ci-gate and
# deploy.yml's workflow_run preflight skips — correct, but previously
# UNRECOVERABLE without an empty commit: re-running CI alone re-fires nothing
# downstream. Recovery is now: re-run the failed CI jobs until green, then
# dispatch this workflow on main — the ci-gate re-reads the (now green) CI
# conclusion for the tip SHA, the images build, and deploy.yml chains off the
# completed run exactly as it does for a push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "contract/**"
      - "pom.xml"
      - "infra/docker/**"
      - "dashboard/**"
      - ".dockerignore"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "services/**"
      - "contract/**"
      - "pom.xml"
      - "infra/docker/**"
      - "dashboard/**"
      - ".dockerignore"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate the image build on a green CI run for THIS commit, on main only.
  # `build-images` and `CI` both fire on a push to main independently, and
  # `deploy.yml` chains off `build-images` finishing — NOT off CI. Without this
  # gate, the (faster) image build can finish and park `deploy` on its homelab
  # approval before CI's test suite has even concluded. By blocking the build
  # until CI is green, a red CI makes this workflow fail, which makes
  # `deploy.yml`'s `workflow_run.conclusion == 'success'` preflight skip the
  # whole deploy — no premature approval prompt, no shipping an unverified SHA.
  # Skipped on pull_request: PR builds never push, and the PR's own required
  # checks already gate the merge.
  ci-gate:
    name: Wait for CI
    # Also gates a manual dispatch (#723): the dispatch exists to re-fire the
    # chain AFTER a CI re-run went green, and the gate is what verifies that —
    # a dispatch on a still-red SHA fails here exactly like a push would.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for CI to conclude green for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A dispatch from any ref but main would push branch code as :latest —
          # which imagePullPolicy: Always turns into an uncontrolled estate-wide
          # deploy on the next pod/node restart. Refuse.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "❌ workflow_dispatch is only valid on main (got ${GITHUB_REF})."
            exit 1
          fi
          echo "Gating image build on a green CI run for ${SHA}"
          # CI fires on every push to main (no path filter), so a run is
          # guaranteed to appear — poll until it concludes. 100 * 15s = 25 min.
          for i in $(seq 1 100); do
            resp=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0] // {} | "\(.status // "none") \(.conclusion // "none")"')
            status=${resp% *}
            conclusion=${resp#* }
            echo "[$i] CI status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "✅ CI passed — proceeding to build/push."
                exit 0
              fi
              echo "❌ CI concluded '${conclusion}' — aborting build so deploy never fires."
              exit 1
            fi
            sleep 15
          done
          echo "⏱️ Timed out waiting for CI to conclude."
          exit 1

  build:
    name: ${{ matrix.service }}
    needs: ci-gate
    # Run when ci-gate passed (push) OR was skipped (pull_request). Blocks only
    # when ci-gate actually FAILED — i.e. CI was red on main.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java services share a single buildx cache scope so the contract-java compile
          # done by `mvn -am` is paid once across the matrix instead of 5x. Sidecar uses
          # a separate scope because its layer set is unrelated.
          - service: orchestrator
            module: orchestrator
            dockerfile: infra/docker/java-service.Dockerfile
            cache_scope: java-builder
          - service: audit
            module: audit
            dockerfile: infra/docker/java-service.Dockerfile
            cache_scope: java-builder
          - service: exec
            module: exec
            dockerfile: infra/docker/java-service.Dockerfile
            cache_scope: java-builder
          - service: market-data
            module: market-data
            dockerfile: infra/docker/java-service.Dockerfile
            cache_scope: java-builder
          - service: api-gateway
            module: api-gateway
            dockerfile: infra/docker/java-service.Dockerfile
            cache_scope: java-builder
          - service: tenant-dashboard-bff
            module: tenant-dashboard-bff
            dockerfile: infra/docker/java-service.Dockerfile
            cache_scope: java-builder
          - service: signal-source-discord
            module: ""
            dockerfile: services/signal-source-discord/Dockerfile
            cache_scope: signal-source-discord
          # Next.js dashboard — non-Java, its own cache scope (like signal-source-discord). The Node
          # Dockerfile uses repo-root context, so SERVICE_MODULE is unused for this row.
          - service: dashboard
            module: ""
            dockerfile: dashboard/Dockerfile
            cache_scope: dashboard
          # STC close-intent /classify service — torch-free ONNX encoder (fastembed).
          # Own cache scope (unrelated layer set, like the sidecar/dashboard rows).
          - service: stc-intent-service
            module: ""
            dockerfile: services/stc-intent-service/Dockerfile
            cache_scope: stc-intent-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # push OR the #723 manual re-fire — both push to GHCR; only PR builds don't.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: refs
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          base="ghcr.io/${owner_lc}/oh-my-tradeagent-${{ matrix.service }}"
          {
            echo "image_base=${base}"
            echo "tag_sha=${base}:${GITHUB_SHA}"
            echo "tag_latest=${base}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SERVICE_MODULE=${{ matrix.module }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.refs.outputs.tag_latest }}
            ${{ steps.refs.outputs.tag_sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
