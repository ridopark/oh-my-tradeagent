name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  k8s-dryrun:
    name: k8s (kubeconform)
    runs-on: ubuntu-latest
    # Job always starts, but the actual install/dry-run steps gate on
    # `infra/k8s/**` or this workflow file changing in the PR diff.
    # Catches schema regressions before the homelab `--dry-run=server`
    # step documented in infra/k8s/README.md. Does NOT replicate
    # admission webhooks — see issue #44.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra/k8s/** changes
        id: changed
        # PR-derived SHAs are routed through `env:` (per GitHub's security
        # hardening guide for untrusted input in shell `run:` blocks) rather
        # than being interpolated directly with ${{ ... }}. SHAs are hex-only
        # so the practical risk is nil, but the env-var pattern is the
        # documented best practice — see issue #97.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qE '^(infra/k8s/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kubeconform
        if: steps.changed.outputs.run == 'true'
        # kubeconform validates manifests against offline JSON schemas — no
        # API server needed. Replaces kubectl apply --dry-run=client which
        # requires a live discovery endpoint even with --validate=false.
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform -strict infra/k8s/
        if: steps.changed.outputs.run == 'true'
        # Client-side schema validation only — does not contact a cluster,
        # so it won't catch admission webhooks or namespace-bound refs
        # (e.g. missing Secrets). The homelab `--dry-run=server` step in
        # infra/k8s/README.md remains the pre-merge cluster-level gate.
        run: |
          kubeconform -strict -kubernetes-version 1.35.0 \
            -summary infra/k8s/

  java:
    name: Java (mvn verify + spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        env:
          # Enables ContractActivitiesImplIT (Testcontainers Postgres). The IT is gated so a
          # local `mvn verify` on a Docker-Desktop-on-WSL2 workstation can skip it cleanly.
          RUN_DB_ITS: "true"
        run: mvn -B -ntp verify

  python:
    name: Python (pydantic round-trip + regen drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Verify generated models are up to date
        run: |
          ./regen.sh
          if ! git diff --quiet ohmytradeagent_contract/models; then
            echo "::error::Generated pydantic models drifted from schemas. Run contract/python/regen.sh locally and commit."
            git diff ohmytradeagent_contract/models
            exit 1
          fi

      - name: pytest
        run: uv run pytest -q

  sidecar:
    name: Python sidecar (parser + emitter + watcher)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signal-source-discord
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: pytest
        run: uv run pytest -q
