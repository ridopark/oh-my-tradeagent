name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  k8s-dryrun:
    name: k8s (kubeconform)
    runs-on: ubuntu-latest
    # Job always starts, but the actual install/dry-run steps gate on
    # `infra/k8s/**` or this workflow file changing in the PR diff.
    # Catches schema regressions before the homelab `--dry-run=server`
    # step documented in infra/k8s/README.md. Does NOT replicate
    # admission webhooks — see issue #44.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra/k8s/** changes
        id: changed
        # PR-derived SHAs are routed through `env:` (per GitHub's security
        # hardening guide for untrusted input in shell `run:` blocks) rather
        # than being interpolated directly with ${{ ... }}. SHAs are hex-only
        # so the practical risk is nil, but the env-var pattern is the
        # documented best practice — see issue #97.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qE '^(infra/k8s/|tenants/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kubeconform
        if: steps.changed.outputs.run == 'true'
        # kubeconform validates manifests against offline JSON schemas — no
        # API server needed. Replaces kubectl apply --dry-run=client which
        # requires a live discovery endpoint even with --validate=false.
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Persist kubeconform's downloaded JSON schemas across runs. kubeconform's
      # default schema source is raw.githubusercontent.com (yannh/kubernetes-json-schema),
      # fetched per-resource on EVERY run; under a burst of concurrent CI jobs that
      # host rate-limits unauthenticated GETs, so a random subset of fetches fail
      # ("giving up after 3 attempts") and the run flakes (Invalid: 0, Errors: N).
      # A warm cache serves the schemas locally (via -cache below) so a green run
      # never touches the network. Key is scoped to the k8s + kubeconform versions
      # so it self-invalidates when either bumps.
      - name: Restore kubeconform schema cache
        id: kubeconform-cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .kubeconform-cache
          key: kubeconform-schemas-k8s1.35.0-kc0.6.7

      - name: kubeconform -strict infra/k8s/
        if: steps.changed.outputs.run == 'true'
        # Client-side schema validation only — does not contact a cluster,
        # so it won't catch admission webhooks or namespace-bound refs
        # (e.g. missing Secrets). The homelab `--dry-run=server` step in
        # infra/k8s/README.md remains the pre-merge cluster-level gate.
        # -cache serves schemas from the restored cache above; only a cold cache
        # (first run after this change / a key bump) hits the network.
        run: |
          # -cache requires the folder to exist; on a cold cache (restore miss) it
          # doesn't yet, and kubeconform errors "no such file or directory".
          mkdir -p .kubeconform-cache
          # kubeconform's default schema source (raw.githubusercontent) rate-limits
          # unauthenticated GETs, so a cold run can fail a random few of the ~39
          # per-resource fetches ("failed downloading schema … giving up"). Retry with
          # backoff: -cache persists each schema it DID download, so every attempt only
          # re-fetches the still-missing ones and the loop converges to a full local
          # cache (which the Save step then persists so future runs never hit the
          # network). A REAL validation error (no "failed downloading" line) fails fast
          # — we never retry a genuine manifest break.
          for attempt in 1 2 3 4 5; do
            out=$(kubeconform -strict -kubernetes-version 1.35.0 \
              -cache .kubeconform-cache -summary infra/k8s/ 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if ! echo "$out" | grep -q 'failed downloading schema'; then
              echo "kubeconform failed with a non-network (real validation) error — not retrying."
              exit 1
            fi
            echo "kubeconform attempt ${attempt}: schema download throttled; retrying after backoff…"
            sleep $((attempt * 10))
          done
          echo "kubeconform still failing after retries (schema host persistently throttling)"
          exit 1

      # Save only on a cold cache (no restore hit) AND only if kubeconform above
      # SUCCEEDED — a failed step halts the job so this step is skipped, meaning a
      # partial schema set from a rate-limited cold run is never persisted (no
      # cache poisoning). One green cold run warms the cache permanently.
      - name: Save kubeconform schema cache
        if: steps.changed.outputs.run == 'true' && steps.kubeconform-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .kubeconform-cache
          key: kubeconform-schemas-k8s1.35.0-kc0.6.7

      - name: tenants ConfigMap drift vs tenants/dev/*
        if: steps.changed.outputs.run == 'true'
        # The tenants-config ConfigMap embeds verbatim copies of tenants/dev/*;
        # a hand-maintained copy drifts. This is the guard 40-tenants-config.yaml's
        # header comment promised — it once dropped eod_force_flatten: false and
        # re-armed the EOD flatten on a copytrade position (Issue #202).
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-tenants-configmap-drift.py

  java:
    # Per-module matrix: each Maven module verifies on its own runner, in parallel.
    # Wall-clock is bounded by the slowest single module (orchestrator) instead of the
    # serial sum of all seven — the old single `mvn verify` job was the whole ~8-10min CI.
    # Isolating each module on its own runner also gives each its own Docker daemon, which
    # removes the cross-suite thread contention that flaked Temporal TestWorkflowEnvironment
    # time-skip tests in the aggregate job (see PLAN-2026-07-05-ci-java-test-parallelism.md).
    #
    # NOTE: the required status-check name changed from `Java (mvn verify + spotless)` to the
    # per-matrix contexts `Java (<module>)`. Branch-protection required checks must be updated
    # to match, or the merge gate silently stops enforcing.
    name: Java (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - contract/java
          - services/orchestrator
          - services/exec
          - services/market-data
          - services/api-gateway
          - services/audit
          - services/tenant-dashboard-bff
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build upstream reactor deps (e.g. orchestrator needs exec-svc + contract-java) without
      # running their tests or spotless — otherwise `-am verify` on api-gateway would re-run
      # orchestrator's whole suite and recreate the bottleneck. Step 2 then tests only this module.
      - name: Build upstream deps (${{ matrix.module }})
        run: >-
          mvn -B -ntp -pl ${{ matrix.module }} -am install
          -DskipTests -Dspotless.check.skip=true

      - name: mvn verify (${{ matrix.module }})
        env:
          # Enables ContractActivitiesImplIT (Testcontainers Postgres). The IT is gated so a
          # local `mvn verify` on a Docker-Desktop-on-WSL2 workstation can skip it cleanly.
          RUN_DB_ITS: "true"
        run: mvn -B -ntp -pl ${{ matrix.module }} verify

      # The per-module `verify` above only spotless-checks its own module. The root aggregator
      # pom.xml is in no leg's reactor (step 1 skips spotless via -am; step 2 drops -am), so its
      # sortPom formatting would go unchecked. Run the root check exactly once, on the cheapest
      # leg, with -N (non-recursive) so it validates only the root pom.
      - name: Root pom spotless (once)
        if: matrix.module == 'contract/java'
        run: mvn -B -ntp -N spotless:check

  python:
    name: Python (pydantic round-trip + regen drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Verify generated models are up to date
        run: |
          ./regen.sh
          if ! git diff --quiet ohmytradeagent_contract/models; then
            echo "::error::Generated pydantic models drifted from schemas. Run contract/python/regen.sh locally and commit."
            git diff ohmytradeagent_contract/models
            exit 1
          fi

      - name: pytest
        run: uv run pytest -q

  sidecar:
    name: Python sidecar (parser + emitter + watcher)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signal-source-discord
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: pytest
        run: uv run pytest -q
