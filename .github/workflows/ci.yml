name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    name: Java (mvn verify + spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp verify

  python:
    name: Python (pydantic round-trip + regen drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Verify generated models are up to date
        run: |
          ./regen.sh
          if ! git diff --quiet ohmytradeagent_contract/models; then
            echo "::error::Generated pydantic models drifted from schemas. Run contract/python/regen.sh locally and commit."
            git diff ohmytradeagent_contract/models
            exit 1
          fi

      - name: pytest
        run: uv run pytest -q

  sidecar:
    name: Python sidecar (parser + emitter + watcher)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signal-source-discord
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: pytest
        run: uv run pytest -q
